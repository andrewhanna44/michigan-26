<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Michigan '26">
<title>Michigan '26 &middot; Snots vs Ducks</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --surface2:#f4f6f8; --surface3:#e7ebef;
  --line:#dce2e8; --text:#0e1216; --muted:#5c6773; --dim:#8d97a3;
  --red:#c8102e; --red-dim:#fbe9ec;
  --snots:#8a6d00; --snots-solid:#a9840c; --snots-tint:#faf1d5; --snots-edge:#ecdcaa;
  --ducks:#1b6b3f; --ducks-solid:#1b6b3f; --ducks-tint:#e3f0e8; --ducks-edge:#bcdcc8;
  --half:#9aa4b0;
  --shadow:0 1px 2px rgba(14,18,22,.06), 0 1px 8px rgba(14,18,22,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
}
.splash{ /* the lock screen keeps the dark space theme */
  --surface:#1d2025; --surface2:#262a30; --line:#3a4048;
  --text:#e9ecef; --muted:#98a1ad; --dim:#6b7480; --red:#e03131;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:var(--safe-b)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.1px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:var(--surface2);border:1px solid var(--line);
  flex:none;font-size:16px;line-height:1}
.iconbtn:active{background:var(--surface3)}
.wrap{padding:14px 14px 40px}

/* ---------- lock screen ---------- */
.splash{position:fixed;inset:0;background:
  radial-gradient(1100px 620px at 50% -14%, #1e2a44 0%, #14161a 64%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;z-index:100;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;background:#fff;border-radius:50%;opacity:.5;
  animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.14}50%{opacity:.8}}
.splash-inner{position:relative;z-index:2;width:100%;max-width:400px;text-align:center}
.kicker{font-size:11px;letter-spacing:3.2px;color:#c7ad63;text-transform:uppercase;font-weight:750}
.bigtitle{font-size:39px;font-weight:850;letter-spacing:-1.2px;margin:5px 0 2px;line-height:1;color:#fff}
.bigtitle .yr{color:#c7ad63}
.dates{font-size:11.5px;color:var(--dim);letter-spacing:1.6px;text-transform:uppercase;font-weight:600}
.scene{width:100%;max-width:330px;margin:14px auto 6px;display:block}
.teamrow{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
.teamrow .t{font-size:12.5px;font-weight:850;letter-spacing:2.4px}
.teamrow .t.s{color:#d4b45c} .teamrow .t.d{color:#5fbf87}
.teamrow .vs{font-size:11px;font-weight:800;color:var(--dim);letter-spacing:1px}
.codein{width:100%;text-align:center;font-size:26px;letter-spacing:11px;font-weight:800;
  padding:15px 10px 15px 21px;border-radius:13px;background:var(--surface);
  border:1.5px solid var(--line);color:var(--text);text-transform:uppercase;outline:none}
.codein:focus{border-color:#c7ad63}
.codein::placeholder{letter-spacing:9px;color:#4a525c;font-weight:600}
.btn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--red);
  color:#fff;font-weight:750;font-size:16px;margin-top:10px;letter-spacing:.2px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow)}
.btn.ghost:active{background:var(--surface2)}
.btn.big{padding:17px;font-size:16.5px}
.hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.55}
.err{color:#ff8787;font-size:13px;margin-top:10px;font-weight:600;min-height:18px}

/* ---------- scoreboard ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.board-top{display:flex;align-items:flex-end;gap:8px}
.bteam{flex:1;text-align:center}
.bteam .nm{font-size:11px;font-weight:850;letter-spacing:2px;margin-bottom:3px}
.bteam.s .nm{color:var(--snots)} .bteam.d .nm{color:var(--ducks)}
.bteam .pts{font-size:42px;font-weight:850;line-height:.95;letter-spacing:-1.5px}
.bmid{flex:none;text-align:center;padding-bottom:11px}
.bmid .dash{font-size:15px;color:var(--dim);font-weight:800}
.clinch{text-align:center;font-size:11.5px;color:var(--dim);margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.clinch b{color:var(--muted)}
.pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:13px;background:var(--surface3)}
.pbar .s{background:var(--snots-solid)} .pbar .d{background:var(--ducks-solid)}

/* ---------- cards ---------- */
.sect{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--dim);
  text-transform:uppercase;margin:22px 0 9px}
.sect:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;display:block;width:100%;text-align:left;
  box-shadow:var(--shadow)}
.card:active{background:var(--surface2)}
.card.flat{background:var(--surface2);box-shadow:none}
.card.me{border-color:var(--red);border-width:1.5px}
.rowline{display:flex;align-items:center;gap:11px}
.rnum{width:33px;height:33px;border-radius:9px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--muted)}
.rnum.done{background:var(--red-dim);border-color:#f2ccd3;color:var(--red)}
.rmeta{flex:1;min-width:0}
.rmeta .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rright{flex:none;text-align:right}
.rright .big{font-weight:800;font-size:15px}
.rright .small{font-size:11px;color:var(--dim);margin-top:2px}
.chev{color:var(--dim);font-size:19px;flex:none;margin-left:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.badge.live{background:var(--red);color:#fff}
.badge.fin{background:var(--surface3);color:var(--muted)}
.badge.soon{background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.badge.s{background:var(--snots-tint);color:var(--snots)}
.badge.d{background:var(--ducks-tint);color:var(--ducks)}
.badge.h{background:var(--surface3);color:var(--muted)}

/* ---------- hole entry ---------- */
.holehead{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.holenav{display:flex;align-items:center;gap:12px}
.navbtn{width:42px;height:42px;border-radius:11px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:700}
.navbtn:active{background:var(--surface3)}
.navbtn:disabled{opacity:.32}
.holeinfo{flex:1;text-align:center}
.holeinfo .hn{font-size:23px;font-weight:850;line-height:1;letter-spacing:-.5px}
.holeinfo .hd{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.strip{display:flex;gap:3px;margin-top:10px}
.strip button{flex:1;height:27px;border-radius:5px;background:var(--surface2);
  border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--dim);
  display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.strip button.cur{outline:2px solid var(--text);outline-offset:-1px;color:var(--text)}
.strip button.w{background:var(--snots-solid);border-color:var(--snots-solid);color:#fff}
.strip button.l{background:var(--ducks-solid);border-color:var(--ducks-solid);color:#fff}
.strip button.h{background:var(--half);border-color:var(--half);color:#fff}

.sidebox{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.sidehdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  font-size:11px;font-weight:850;letter-spacing:2px;border-bottom:1px solid var(--line)}
.sidebox.s .sidehdr{color:var(--snots);background:var(--snots-tint)}
.sidebox.d .sidehdr{color:var(--ducks);background:var(--ducks-tint)}
.sidehdr .net{letter-spacing:.3px;font-weight:700;font-size:12px;color:var(--muted);text-transform:none}
.prow{padding:8px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow.best{background:var(--surface2)}
.pname{font-size:13.5px;font-weight:700;line-height:1.2}
.pname .hc{color:var(--dim);font-weight:600;font-size:10.5px;margin-left:5px}
.pname .ball{color:var(--red);font-weight:800;font-size:9.5px;letter-spacing:.6px;
  text-transform:uppercase;margin-left:5px}
.entry{display:flex;align-items:center;gap:9px;margin-top:5px}
.entry .lab{font-size:11.5px;color:var(--muted);font-weight:650;flex:none}
.gswrap{position:relative;flex:none}
.gsin{width:54px;height:44px;text-align:center;font-size:20px;font-weight:800;
  background:var(--surface2);border:1.5px solid transparent;border-radius:11px;
  color:var(--text);outline:none;padding:0;-moz-appearance:textfield}
.gsin::-webkit-outer-spin-button,.gsin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gsin:focus{background:#fff;border-color:var(--text)!important;border-radius:11px!important;
  box-shadow:0 0 0 3px rgba(14,18,22,.09)!important}
.gsin.blank{border:1.5px dashed var(--line);background:transparent}
/* Sits outside the score box so it stays visible on top of a circled birdie. */
.gsdots{position:absolute;top:-3px;right:-3px;display:flex;gap:2px;pointer-events:none}
.gsdots .dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 2px var(--surface)}
.entry .out{flex:1;text-align:right;font-size:11px;color:var(--dim);font-weight:650}
.entry .out b{display:block;font-size:17px;color:var(--text);font-weight:800;line-height:1.15}
.entry .clr{flex:none;width:31px;height:31px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--line);color:var(--dim);font-size:14px;display:flex;
  align-items:center;justify-content:center}

/* prev / save / next bar under the score boxes */
.holebar{display:flex;gap:7px;margin-top:12px}
.holebar button{border-radius:12px;padding:13px 6px;font-weight:750;font-size:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.holebar button:disabled{opacity:.34}
.holebar .side{flex:none;width:84px;color:var(--muted);font-size:11px;white-space:nowrap}
.holebar .go{flex:1;background:var(--red);border-color:var(--red);color:#fff;font-size:14px}
.holebar .go:active{filter:brightness(.9)}
.holebar .go.fin{background:var(--text);border-color:var(--text)}
.savedtag{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}

/* under par = red + circles.  par = plain black.  over par = black + boxes. */
.u{color:var(--red)!important}
.c1,.c2,.c3{border:1.5px solid currentColor!important;border-radius:50%!important}
.b1,.b2,.b3{border:1.5px solid currentColor!important;border-radius:4px!important}
.c2,.b2{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor}
.c3,.b3{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor,
        0 0 0 4.6px var(--surface),0 0 0 6px currentColor}
.mk{display:inline-flex;align-items:center;justify-content:center;
  min-width:21px;height:21px;line-height:1;font-weight:750}

.resbar{border-radius:13px;padding:11px;text-align:center;margin-bottom:9px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.resbar .r1{font-size:11.5px;color:var(--muted);font-weight:650}
.resbar .r2{font-size:19px;font-weight:850;margin-top:3px;letter-spacing:-.3px}
.resbar.s{background:var(--snots-tint);border-color:var(--snots-edge)}
.resbar.d{background:var(--ducks-tint);border-color:var(--ducks-edge)}
.resbar.s .r2{color:var(--snots)} .resbar.d .r2{color:var(--ducks)}
.lockbar{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:11px;font-size:12.5px;color:var(--muted);line-height:1.5}
.lockbar b{color:var(--text)}
.lockbar button{color:var(--red);font-weight:750;text-decoration:underline;padding:0}
.actions{display:flex;gap:9px;margin-top:14px}
.actions .btn{margin-top:0;flex:1}

/* ---------- scorecard grid ---------- */
.gridwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px;
  background:var(--surface);box-shadow:var(--shadow)}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gc{border-collapse:collapse;font-size:12px;width:100%}
table.gc th,table.gc td{padding:0;text-align:center;height:32px;min-width:34px;
  border-left:1px solid var(--line);border-top:1px solid var(--line);position:relative;
  font-variant-numeric:tabular-nums}
table.gc tr.gr td{height:37px}
table.gc tr:first-child th{border-top:none}
table.gc .lbl{text-align:left;padding:0 8px;min-width:130px;width:130px;position:sticky;left:0;
  background:var(--surface);z-index:2;border-left:none;font-weight:700;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
table.gc thead th{background:var(--surface2);font-weight:750;color:var(--muted);font-size:11px}
table.gc thead .lbl{background:var(--surface2)}
table.gc .tot{background:var(--surface2);font-weight:800}
table.gc .meta td{color:var(--dim);font-size:11px;font-weight:600}
table.gc .netrow td{color:var(--muted);font-size:11.5px;background:var(--surface2)}
table.gc .netrow td b{color:var(--text);font-weight:750}
table.gc .netrow .lbl{background:var(--surface2);color:var(--muted);font-weight:600;padding-left:16px}
table.gc .sep td{height:6px;background:var(--surface3);padding:0}
table.gc .sep .lbl{background:var(--surface3)}
table.gc .gdot{position:absolute;top:3px;right:3px;width:4px;height:4px;border-radius:50%;
  background:var(--red)}
table.gc .gdot.two{width:9px;background:none}
table.gc .gdot.two::before,table.gc .gdot.two::after{content:"";position:absolute;top:0;
  width:4px;height:4px;border-radius:50%;background:var(--red)}
table.gc .gdot.two::before{right:5px} table.gc .gdot.two::after{right:0}
table.gc td.w{background:var(--snots-solid);color:#fff}
table.gc td.l{background:var(--ducks-solid);color:#fff}
table.gc td.hh{background:var(--surface3);color:var(--muted)}
table.gc .rowres td{font-weight:800;font-size:9.5px;letter-spacing:-.2px}
table.gc .rowres .tot{font-size:9.5px;white-space:nowrap;padding:0 4px}
table.gc .tot{min-width:62px}
table.gc .bestrow td{font-weight:800}
.legend{font-size:11.5px;color:var(--dim);padding:10px 12px;line-height:1.7;
  border-top:1px solid var(--line);background:var(--surface)}
.legend .sw{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
  font-size:10px;font-weight:750;color:var(--text);margin:0 2px;vertical-align:middle}
.legend .sw.u{color:var(--red)}
.legend .rd{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--red);
  vertical-align:middle;margin:0 3px}

/* ---------- misc ---------- */
.syncpill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  padding:10px 12px;justify-content:center}
.syncpill .led{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.syncpill.on .led{background:#2f9e44} .syncpill.off .led{background:var(--red)}
.sheet{position:fixed;inset:0;background:rgba(14,18,22,.45);z-index:80;display:flex;
  align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:17px 17px 0 0;
  padding:0 16px calc(22px + var(--safe-b));max-height:86vh;overflow-y:auto}
.sheethdr{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;
  gap:10px;padding:17px 0 11px;border-bottom:1px solid var(--line);margin-bottom:14px;z-index:2}
.sheethdr h3{margin:0;font-size:17px;flex:1}
.sheet p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 15px}

.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);font-size:12px;font-weight:750;color:var(--muted);
  box-shadow:var(--shadow);white-space:nowrap}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}

/* ---------- statistics ---------- */
.statcards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.statcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:11px 12px;box-shadow:var(--shadow)}
.statcard .k{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.statcard .v{font-size:15px;font-weight:800;margin-top:4px;line-height:1.25}
.statcard .v small{display:block;font-size:11px;font-weight:650;color:var(--muted);margin-top:2px}
table.st{border-collapse:collapse;width:100%;font-size:12.5px}
table.st th,table.st td{padding:8px 4px;text-align:center;border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums}
table.st thead th{background:var(--surface2);font-size:10px;font-weight:800;color:var(--muted);
  letter-spacing:.6px;border-top:none;padding:8px 4px}
table.st .who{text-align:left;padding-left:11px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:118px}
table.st .who.s{color:var(--snots)} table.st .who.d{color:var(--ducks)}
table.st .num{font-weight:750}
table.st .lead{color:var(--red);font-weight:850}
table.st tbody tr:nth-child(even){background:var(--surface2)}
.codelist{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:13px;margin-bottom:15px}
.codelist .cn{padding:7px 0;border-bottom:1px solid var(--line)}
.codelist .cc{padding:7px 0;border-bottom:1px solid var(--line);font-weight:800;
  letter-spacing:1.5px;text-align:right;color:var(--red)}
</style>
</head>

/* ==========================================================================

   ========================================================================== */
const FIREBASE_CONFIG = {

const PT_WIN = 1, PT_HALVE = 0.5;

/* ==========================================================================
   2. DATA  (from Pat's "Michigan '26 Scoring File")

/* ==========================================================================
   3. SCORING ENGINE  (gross in -> everything else derived)
   ========================================================================== */
function strokesOn(allowance, strokeIndex){
  if (!allowance || allowance <= 0) return 0;
  let s = 0;
  if (strokeIndex <= allowance) s++;
  if (strokeIndex <= allowance - 18) s++;
  return s;
}
function playerStrokes(r, side, pl, h){
  const c = COURSES[r.course];
  let allow = pl[2];
  if (r.par3Low && c.par[h] === 3) allow = Math.min(...side.p.map(x => x[2]));
  return strokesOn(allow, c.hcp[h]);
}
function teamStrokes(r, side, h){ return strokesOn(side.net, COURSES[r.course].hcp[h]); }

function sideHole(r, m, key, h, scores){
  const side = m[key], row = scores[h] || {};
  if (r.mode === "team"){
    const g = row[key];
    if (g == null) return null;
    return {net: g - teamStrokes(r, side, h), gross: g, byId: null};
  }
  let best = null;
  for (const pl of side.p){
    const g = row[pl[0]];
    if (g == null) continue;
    const net = g - playerStrokes(r, side, pl, h);
    if (!best || net < best.net) best = {net, gross: g, byId: pl[0]};
  }
  return best;
}

function matchState(r, m, scores){
  let up = 0, sW = 0, dW = 0, halved = 0;
  const holes = new Array(18).fill(null);
  let closedAt = null, closedMargin = 0;
  for (let h = 0; h < 18; h++){
    const s = sideHole(r, m, "s", h, scores);
    const d = sideHole(r, m, "d", h, scores);
    if (!s || !d) continue;
    let w;
    if (s.net < d.net){ w = "s"; up++; sW++; }
    else if (d.net < s.net){ w = "d"; up--; dW++; }
    else { w = "h"; halved++; }
    holes[h] = w;
    if (closedAt === null && Math.abs(up) > 17 - h){
      closedAt = h + 1; closedMargin = Math.abs(up);
    }
  }
  const played = sW + dW + halved, thru = played;
  const done = closedAt !== null || played === 18;
  let text, winner = null;
  if (closedAt !== null){
    winner = up > 0 ? "s" : "d";
    const rem = 18 - closedAt;
    text = rem === 0 ? "1 UP" : `${closedMargin} & ${rem}`;
  } else if (played === 18){
    if (up === 0) text = "HALVED";
    else { winner = up > 0 ? "s" : "d"; text = `${Math.abs(up)} UP`; }
  } else if (played === 0){ text = "Not started"; }
  else {
    text = up === 0 ? "ALL SQUARE" : `${Math.abs(up)} UP`;
    winner = up === 0 ? null : (up > 0 ? "s" : "d");
  }
  return {up, thru, played, holes, done, winner, text, closedAt, started: played > 0,
          pts: {s: done ? (up > 0 ? PT_WIN : up < 0 ? 0 : PT_HALVE) : 0,
                d: done ? (up < 0 ? PT_WIN : up > 0 ? 0 : PT_HALVE) : 0}};
}

function standings(){
  let s = 0, d = 0, ps = 0, pd = 0, fin = 0, live = 0;
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done){ s += st.pts.s; d += st.pts.d; ps += st.pts.s; pd += st.pts.d; fin++; }
    else if (st.started){
      live++;
      if (st.up > 0) ps += PT_WIN; else if (st.up < 0) pd += PT_WIN;
      else { ps += PT_HALVE; pd += PT_HALVE; }
    }
  }
  return {s, d, projS: ps, projD: pd, fin, live};
}

/**
 * Per-player totals across the whole trip.
 * Best Ball / Shamble / Singles have a score per man, so it's his own.
 * Scramble / Alternate Shot only have a team score — that score is credited
 * to BOTH partners, since it's the number they made together.
 * Birdies/bogeys are counted off GROSS vs par, the way a scorecard reads.
 */
function playerStats(){
  const acc = {};
  Object.keys(PLAYERS).forEach(id => acc[id] =
    {holes:0, gross:0, net:0, par:0, eagle:0, birdie:0, parCt:0, bogey:0, dbl:0, rounds:new Set()});
  const bump = (a, gross, net, par, rid) => {
    a.holes++; a.gross += gross; a.net += net; a.par += par; a.rounds.add(rid);
    const d = gross - par;
    if (d <= -2) a.eagle++; else if (d === -1) a.birdie++;
    else if (d === 0) a.parCt++; else if (d === 1) a.bogey++; else a.dbl++;
  };
  ROUNDS.forEach(r => {
    const c = COURSES[r.course];
    r.matches.forEach(m => {
      const scores = Store.scores(m.id);
      ["s","d"].forEach(key => {
        const side = m[key];
        for (let h = 0; h < 18; h++){
          const row = scores[h] || {};
          if (r.mode === "team"){
            const g = row[key];
            if (g == null) continue;
            const net = g - teamStrokes(r, side, h);
            side.p.forEach(pl => bump(acc[pl[0]], g, net, c.par[h], r.n));
          } else side.p.forEach(pl => {
            const g = row[pl[0]];
            if (g == null) return;
            bump(acc[pl[0]], g, g - playerStrokes(r, side, pl, h), c.par[h], r.n);
          });
        }
      });
    });
  });
  return Object.keys(acc).map(id => {
    const a = acc[id];
    return {id, name: PLAYERS[id].n, team: PLAYERS[id].t, holes: a.holes,
            grossToPar: a.gross - a.par, netToPar: a.net - a.par,
            eagle: a.eagle, birdie: a.birdie, parCt: a.parCt,
            bogey: a.bogey, dbl: a.dbl, bogeyPlus: a.bogey + a.dbl,
            rounds: a.rounds.size};
  }).filter(p => p.holes > 0);
}

/* ==========================================================================
   4. STORE  — localStorage is durable truth, Firebase is shared truth.
   Every cell is timestamped, so merging is "newest wins".
   ========================================================================== */
const Store = (() => {
  const LS = `${EVENT_KEY}_data`;
  let data = {}, db = null, connected = false, authed = false, listeners = [];
  try { data = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ data = {}; }
  const flush = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} };
  const bucket = id => (data[id] = data[id] || {scores:{}, scorer:null});

  function mergeRemote(id, remote){
    if (!remote) return false;
    const b = bucket(id); let changed = false;
    if (remote.scores) for (const h in remote.scores) for (const e in remote.scores[h]){
      const rc = remote.scores[h][e], lc = (b.scores[h] || {})[e];
      if (!rc || typeof rc.t !== "number") continue;
      if (!lc || rc.t > lc.t){ b.scores[h] = b.scores[h] || {}; b.scores[h][e] = rc; changed = true; }
    }
    if (remote.scorer && (!b.scorer || remote.scorer.t > b.scorer.t)){
      b.scorer = remote.scorer; changed = true;
    }
    return changed;
  }

  return {
    get online(){ return connected; },
    get authed(){ return authed; },
    onChange(fn){ listeners.push(fn); },
    _emit(){ listeners.forEach(f => f()); },

    scores(id){
      const b = data[id]; if (!b) return {};
      const out = {};
      for (const h in b.scores) for (const e in b.scores[h]){
        const c = b.scores[h][e];
        if (c && c.v != null){ out[h] = out[h] || {}; out[h][e] = c.v; }
      }
      return out;
    },

    /* silent = write through without re-rendering, so a focused input keeps focus */
    setScore(id, h, entrant, val, by, silent){
      const b = bucket(id), t = Date.now();
      b.scores[h] = b.scores[h] || {};
      b.scores[h][entrant] = {v: val, t, by};
      flush();
      if (!silent) this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${entrant}`),
                     {v: val === null ? null : val, t, by}).catch(()=>{});
    },

    scorer(id){ return (data[id] || {}).scorer || null; },
    setScorer(id, pid){
      const b = bucket(id), t = Date.now();
      b.scorer = {id: pid, t}; flush(); this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: pid, t}).catch(()=>{});
    },

    /* Tombstone every hole/entrant this match could ever have, not just the
       ones this phone happens to know about — otherwise a reset issued here
       won't clear scores that only exist on someone else's phone. */
    resetMatch(id){
      const b = bucket(id), t = Date.now(), payload = {};
      const entry = ALL_MATCHES[id];
      const ents = new Set(Object.keys(b.scores).flatMap(h => Object.keys(b.scores[h])));
      if (entry){
        const {r, m} = entry;
        if (r.mode === "team"){ ents.add("s"); ents.add("d"); }
        else ["s","d"].forEach(k => m[k].p.forEach(pl => ents.add(pl[0])));
      }
      for (let h = 0; h < 18; h++) for (const e of ents){
        b.scores[h] = b.scores[h] || {};
        b.scores[h][e] = {v: null, t, by: "reset"};
        payload[`${h}/${e}`] = {v: null, t, by: "reset"};
      }
      b.scorer = {id: null, t};
      flush(); this._emit();
      if (db){
        update(ref(db, `${EVENT_KEY}/matches/${id}/scores`), payload).catch(()=>{});
        update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: null, t}).catch(()=>{});
      }
    },

    async connect(){
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        // Anonymous sign-in: no login screen, but the database can require a
        // token, which shuts out unauthenticated bots.
        try { await signInAnonymously(getAuth(app)); authed = true; }
        catch(e){ authed = false; console.warn("anonymous auth unavailable", e.code || e); }
        db = getDatabase(app);
        onValue(ref(db, ".info/connected"), s => { connected = !!s.val(); this._emit(); });
        onValue(ref(db, `${EVENT_KEY}/matches`), snap => {
          const all = snap.val() || {}; let changed = false;
          for (const id in all) if (mergeRemote(id, all[id])) changed = true;
          if (changed){ flush(); this._emit(); }
        }, err => console.warn("sync read blocked:", err.code || err));
      } catch(e){ console.warn("sync unavailable", e); }
    }
  };
})();

/* ==========================================================================
   5. SESSION
   ========================================================================== */
const Session = {
  get id(){ return localStorage.getItem(`${EVENT_KEY}_me`); },
  set id(v){ v ? localStorage.setItem(`${EVENT_KEY}_me`, v)
                : localStorage.removeItem(`${EVENT_KEY}_me`); },
  get me(){ return PLAYERS[this.id] || null; },
  get admin(){ return !!(this.me && this.me.admin); },
  find(code){
    const c = (code || "").trim().toUpperCase();
    return Object.keys(PLAYERS).find(id => PLAYERS[id].code === c) || null;
  }
};
const inMatch = (m, pid) => [...m.s.p, ...m.d.p].some(x => x[0] === pid);
function canScore(m){
  const me = Session.id; if (!me) return false;
  if (Session.admin) return true;
  const sc = Store.scorer(m.id);
  if (!sc || !sc.id) return inMatch(m, me);
  return sc.id === me;
}
function myMatch(){
  for (const r of ROUNDS) for (const m of r.matches){
    if (inMatch(m, Session.id) && !matchState(r, m, Store.scores(m.id)).done) return m.id;
  }
  for (let i = ROUNDS.length - 1; i >= 0; i--)
    for (const m of ROUNDS[i].matches) if (inMatch(m, Session.id)) return m.id;
  return null;
}

let V = {view:"home", round:0, matchId:null, hole:0, sheet:null, pending:false};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
const shotLbl = n => `${n <= 0 ? 0 : n} shot${n === 1 ? "" : "s"}`;
const fmtIdx = i => i < 0 ? `+${Math.abs(i).toFixed(1)}` : i.toFixed(1);

/* Golf scorecard notation: under par is red and circled (1 ring per stroke
   under), over par is black and boxed. Par is a plain black number. */
function markCls(gross, par){
  if (gross == null) return "";
  const d = gross - par;
  if (d < 0) return `u c${Math.min(3, -d)}`;
  if (d > 0) return `b${Math.min(3, d)}`;
  return "";
}
function yards(r, m, h){
  const c = COURSES[r.course], tee = m.tee || r.tee;
  if (c.yds[tee]) return c.yds[tee][h] + " yds";
  const parts = tee.split("/").filter(p => c.yds[p]);
  if (parts.length === 2) return `${c.yds[parts[0]][h]}/${c.yds[parts[1]][h]} yds`;
  return null;
}
const dotsHTML = n => n <= 0 ? "" :
  `<span class="gsdots">${'<span class="dot"></span>'.repeat(n)}</span>`;

/* ==========================================================================
   7. RENDER
   ========================================================================== */
function render(){
  const app = $("#app");
  if (!Session.id){ app.innerHTML = viewLogin(); wireLogin(); return; }
  let html = "";
  if (V.view === "home")  html = viewHome();
  if (V.view === "board") html = viewBoard();
  if (V.view === "stats") html = viewStats();
  if (V.view === "round") html = viewRound();
  if (V.view === "match") html = viewMatch();
  if (V.view === "card")  html = viewCard();
  if (V.sheet) html += viewSheet();
  app.innerHTML = html;
  wire();
}

function wireLogin(){
  const inp = $("#code");

              inp.value = ""; inp.focus(); return; }

  inp.oninput = () => { $("#err").textContent = ""; if (inp.value.length === 4) submit(); };

}

/* ---------- statistics ---------- */
const toPar = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
function viewStats(){
  const rows = playerStats();
  if (!rows.length) return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&lsaquo;</button>
      <h1>Statistics<div class="sub">Nothing scored yet</div></h1></div>
    <div class="wrap"><div class="empty">Statistics appear here once scores start going in.<br>
      Every man's gross and net contribution to par, birdies, eagles and bogeys &mdash;
      across all five rounds.</div></div>`;

  const sort = V.statSort || "net";
  const cmp = {
    net:    (a,b) => a.netToPar - b.netToPar,
    gross:  (a,b) => a.grossToPar - b.grossToPar,
    birdie: (a,b) => (b.birdie + b.eagle) - (a.birdie + a.eagle) || a.netToPar - b.netToPar,
    bogey:  (a,b) => b.bogeyPlus - a.bogeyPlus || b.netToPar - a.netToPar
  }[sort];
  const sorted = [...rows].sort(cmp);

  const bestBy = (fn, hi) => rows.reduce((x, y) => (hi ? fn(y) > fn(x) : fn(y) < fn(x)) ? y : x);
  const bNet = bestBy(p => p.netToPar, false), bGross = bestBy(p => p.grossToPar, false);
  // birdies and eagles rank separately — an eagle shouldn't quietly win "most birdies"
  const bBird = bestBy(p => p.birdie * 100 + p.eagle, true);
  const bEagle = bestBy(p => p.eagle, true), bBog = bestBy(p => p.bogeyPlus, true);
  const nm = p => p.name.split(" ").slice(-1)[0];

  const card = (k, v, sub) => `<div class="statcard"><div class="k">${k}</div>
    <div class="v">${v}<small>${sub}</small></div></div>`;

  const body = sorted.map(p => `<tr>
    <td class="who ${p.team}">${esc(nm(p))}</td>
    <td class="num">${toPar(p.grossToPar)}</td>
    <td class="num">${toPar(p.netToPar)}</td>
    <td class="${p.eagle === bEagle.eagle && p.eagle > 0 ? "lead" : ""}">${p.eagle || ""}</td>
    <td class="${p.birdie === bBird.birdie && p.birdie > 0 ? "lead" : ""}">${p.birdie || ""}</td>
    <td class="${p.bogeyPlus === bBog.bogeyPlus && p.bogeyPlus > 0 ? "lead" : ""}">${p.bogeyPlus || ""}</td>
    <td style="color:var(--dim)">${p.holes}</td></tr>`).join("");

  const tab = (k, lbl) => `<button class="${sort === k ? "on" : ""}" data-sort="${k}">${lbl}</button>`;

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&lsaquo;</button>
      <h1>Statistics<div class="sub">${rows.length} players &middot; contribution to par</div></h1></div>
    <div class="wrap">
      <div class="statcards">
        ${card("Best net", nm(bNet), `${toPar(bNet.netToPar)} to par`)}
        ${card("Best gross", nm(bGross), `${toPar(bGross.grossToPar)} to par`)}
        ${bEagle.eagle > 0
          ? card("Most eagles", nm(bEagle), `${bEagle.eagle} eagle${bEagle.eagle === 1 ? "" : "s"}`)
          : card("Most birdies", bBird.birdie > 0 ? nm(bBird) : "&mdash;",
              `${bBird.birdie} birdie${bBird.birdie === 1 ? "" : "s"}`)}
        ${card("Most bogeys+", bBog.bogeyPlus > 0 ? nm(bBog) : "&mdash;", `${bBog.bogeyPlus} holes over par`)}
      </div>
      <div class="tabs">${tab("net","Net")}${tab("gross","Gross")}${tab("birdie","Birdies")}${tab("bogey","Bogeys+")}</div>
      <div class="gridwrap"><div class="gscroll"><table class="st">
        <thead><tr><th class="who">Player</th><th>GROSS</th><th>NET</th>
          <th>EGL</th><th>BIR</th><th>BGY+</th><th>HOLES</th></tr></thead>
        <tbody>${body}</tbody></table></div>
        <div class="legend">Gross and net are each man's total contribution to par across every
          round he's played. On scramble and alternate shot the team's score counts for both
          partners. Birdies and bogeys are counted off gross.</div>
      </div>
      <button class="btn ghost" data-nav="home">Back to home</button>
    </div>`;
}

/* ---------- round ---------- */
function viewRound(){

  r.matches.forEach(m => list += matchCard(r, m, matchState(r, m, Store.scores(m.id))));
  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&lsaquo;</button>
      <h1>Round ${r.n} &middot; ${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(r.tee)} tees</div></h1>

      <div class="card flat"><div style="font-size:12.5px;color:var(--muted);line-height:1.65">
        <b style="color:var(--text)">Strokes:</b> ${esc(r.rule)}<br>
        <b style="color:var(--text)">Format:</b> ${fmtBlurb(r)}
        ${c.note ? `<br><b style="color:var(--text)">Note:</b> ${esc(c.note)}` : ""}
      </div></div>
      <div class="sect">Matches</div>${list}</div>`;
}
const fmtBlurb = r => ({
  "Scramble":"Both partners tee off, play the best ball, repeat. One score per team.",
  "Best Ball":"Everyone plays their own ball. The pair's better net score counts.",
  "Shamble":"Play the best drive, then everyone plays their own ball in. Better net counts.",
  "Alternate Shot":"Partners alternate shots on one ball. One score per team.",
  "Singles":"One on one, own ball, net match play."
})[r.fmt] || "";

function matchCard(r, m, st){
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const mine = inMatch(m, Session.id);
  const cls = st.winner ? st.winner : "h";
  const right = st.started ? `<span class="badge ${cls}">${esc(st.text)}</span>`
                           : `<span class="badge soon">${esc(m.t)}</span>`;
  const sub = st.done ? "Final" : st.started ? `thru ${st.thru}` : esc(r.fmt);
  return `<button class="card ${mine ? "me" : ""}" data-nav="match" data-id="${m.id}"><div class="rowline">
    <div class="rmeta">
      <div class="t1" style="color:var(--snots)">${esc(nm("s"))}</div>
      <div class="t1" style="color:var(--ducks)">${esc(nm("d"))}</div>
      <div class="t2" style="margin-top:4px">${sub}${mine ? " &middot; your match" : ""}</div>
    </div>
    <div class="rright"><div class="small" style="margin:0 0 5px">${right}</div></div>
    <div class="chev">&rsaquo;</div></div></button>`;
}

/* ---------- match: hole entry ---------- */
function viewMatch(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);
  const h = V.hole, editable = canScore(m), sc = Store.scorer(m.id), par = c.par[h];

  let strip = "";
  for (let i = 0; i < 18; i++){
    const w = st.holes[i];
    strip += `<button data-hole="${i}" id="chip-${i}" class="${i === h ? "cur " : ""}${
      w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : ""}">${i + 1}</button>`;
  }
  const yd = yards(r, m, h);

  const sideBox = key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores), rows = [];
    if (r.mode === "team"){
      rows.push(entryRow({
        name: side.p.map(p => last(p[0])).join(" / "), sub: shotLbl(side.net),
        entrant: key, gross: (scores[h] || {})[key],
        strokes: teamStrokes(r, side, h), par, editable}));
    } else side.p.forEach(pl => {
      rows.push(entryRow({
        name: PLAYERS[pl[0]].n, sub: shotLbl(pl[2]),
        entrant: pl[0], gross: (scores[h] || {})[pl[0]],
        strokes: playerStrokes(r, side, pl, h), par, editable,
        best: !!(bh && bh.byId === pl[0] && side.p.length > 1)}));
    });
    return `<div class="sidebox ${key}"><div class="sidehdr">
        <span>${key === "s" ? "SNOTS" : "DUCKS"}</span>
        <span class="net" id="sidenet-${key}">${bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;"}</span>
      </div>${rows.join("")}</div>`;
  };

  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&lsaquo;</button>
      <h1>${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(m.tee || r.tee)} &middot; ${esc(m.t)}</div></h1>
      <button class="iconbtn" data-sheet="menu">&#9776;</button>
    </div><div class="wrap">
      <div class="resbar ${st.winner || ""}" id="resbar">
        <div class="r1" id="res1">${holeLine(r, m, h, scores)}</div>
        <div class="r2" id="res2">${st.started ? matchLine(st) : "Match not started"}</div>
      </div>
      ${st.done ? `<button class="btn" style="margin:0 0 10px"
        data-nav="card" data-id="${m.id}">Match complete &mdash; Review Round &rsaquo;</button>` : ""}
      ${scorerBar(m, sc, editable)}
      <div class="holehead">
        <div class="holenav">
          <button class="navbtn" data-step="-1" ${h === 0 ? "disabled" : ""}>&lsaquo;</button>
          <div class="holeinfo"><div class="hn">Hole ${h + 1}</div>
            <div class="hd">Par ${par}${yd ? " &middot; " + yd : ""} &middot; S.I. ${c.hcp[h]}</div></div>
          <button class="navbtn" data-step="1" ${h === 17 ? "disabled" : ""}>&rsaquo;</button>
        </div>
        <div class="strip">${strip}</div>
      </div>
      ${sideBox("s")}${sideBox("d")}
      <div class="holebar">
        <button class="side" data-step="-1" ${h === 0 ? "disabled" : ""}>&lsaquo; Prev Hole</button>
        <button class="go ${h === 17 || st.done ? "fin" : ""}" data-proceed="1">${
          h === 17 || st.done ? "Save &amp; Review Round" : "Save Scores &amp; Proceed"}</button>
        <button class="side" data-step="1" ${h === 17 ? "disabled" : ""}>Next Hole &rsaquo;</button>
      </div>
      <div class="savedtag">Every score saves the moment you type it${
        Store.online ? " and syncs to everyone" : " &mdash; will sync when you get service"}.</div>
      <div class="actions">
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
        <button class="btn big ghost" data-nav="card" data-id="${m.id}">Full Scorecard</button>
      </div>
      ${Session.admin ? `<button class="btn ghost" data-reset="${m.id}"
        style="color:var(--red);margin-top:9px">Reset this match</button>` : ""}
    </div>`;
}
function holeLine(r, m, h, scores){
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return "Enter both sides to score the hole";
  return s.net < d.net ? "Snots win the hole" : d.net < s.net ? "Ducks win the hole" : "Hole halved";
}
function matchLine(st){
  if (st.done) return st.winner
    ? `${st.winner === "s" ? "SNOTS" : "DUCKS"} win ${esc(st.text)}` : "Match halved";
  if (st.up === 0) return `All square thru ${st.thru}`;
  return `${st.up > 0 ? "SNOTS" : "DUCKS"} ${Math.abs(st.up)} UP thru ${st.thru}`;
}
/* Always rendered at the same height — if this bar appears or disappears as
   scores go in, every button below it jumps under the scorer's thumb. */
function scorerBar(m, sc, editable){
  let body;
  if (sc && sc.id === Session.id) body = `<b>You're keeping score.</b> Everyone else sees this live.`;
  else if (sc && sc.id) body = `<b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.` +
    (Session.admin ? ` <button data-claim="${m.id}">Take over &rsaquo;</button>` : ` View only.`);
  else if (editable) body = `Nobody is keeping score yet. <button data-claim="${m.id}">I'll keep score &rsaquo;</button>`;
  else body = `<b>View only.</b> You're not in this match.`;
  return `<div class="lockbar">${body}</div>`;
}
function entryRow(o){
  const cls = markCls(o.gross, o.par);
  const val = o.gross == null ? "" : o.gross;
  return `<div class="prow ${o.best ? "best" : ""}">
    <div class="pname">${esc(o.name)}<span class="hc">${esc(o.sub)}</span>${
      o.best ? `<span class="ball">counts</span>` : ""}</div>
    <div class="entry">
      <span class="lab">Gross Score:</span>
      <span class="gswrap">
        <input class="gsin ${val === "" ? "blank" : cls}" id="gs-${o.entrant}"
          data-entrant="${o.entrant}" type="number" inputmode="numeric" pattern="[0-9]*"
          min="1" max="15" value="${val}" ${o.editable ? "" : "readonly"}>
        ${dotsHTML(o.strokes)}
      </span>
      <span class="out" id="net-${o.entrant}">${
        o.gross == null ? "" : `net<b>${o.gross - o.strokes}</b>`}</span>
      ${o.editable ? `<button class="clr" data-clear="${o.entrant}">&times;</button>` : ""}
    </div></div>`;
}

/* ---------- full scorecard ---------- */
function viewCard(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);

  // running "up" after each decided hole (+ve = Snots), null where not played
  const run = []; let u = 0;
  for (let h = 0; h < 18; h++){
    const w = st.holes[h];
    if (w === null){ run.push(null); continue; }
    if (w === "s") u++; else if (w === "d") u--;
    run.push(u);
  }
  const shortSide = key => m[key].p.length > 1
    ? m[key].p.map(p => last(p[0])[0]).join("/") : last(m[key].p[0][0]);

  const rowPair = (name, colour, strokeFn, grossFn, from, to) => {
    let g = `<tr class="gr"><td class="lbl" style="color:${colour}">${esc(name)}</td>`;
    let n = `<tr class="netrow"><td class="lbl">net</td>`;
    let gt = 0, nt = 0, any = false;
    for (let h = from; h <= to; h++){
      const s = strokeFn(h), v = grossFn(h);
      g += `<td>${s > 0 ? `<span class="gdot${s > 1 ? " two" : ""}"></span>` : ""}${
        v == null ? "" : `<span class="mk ${markCls(v, c.par[h])}">${v}</span>`}</td>`;
      n += `<td>${v != null ? `<b>${v - s}</b>` : ""}</td>`;
      if (v != null){ gt += v; nt += v - s; any = true; }
    }
    g += `<td class="tot">${any ? gt : ""}</td></tr>`;
    n += `<td class="tot">${any ? `<b>${nt}</b>` : ""}</td></tr>`;
    return g + n;
  };

  const nine = (from, to, label) => {
    let head = `<tr><th class="lbl">${label}</th>`;
    for (let h = from; h <= to; h++) head += `<th>${h + 1}</th>`;
    head += `<th class="tot">${label}</th></tr>`;
    let par = `<tr class="meta"><td class="lbl">Par</td>`, si = `<tr class="meta"><td class="lbl">Stroke index</td>`;
    let pT = 0;
    for (let h = from; h <= to; h++){ par += `<td>${c.par[h]}</td>`; si += `<td>${c.hcp[h]}</td>`; pT += c.par[h]; }
    par += `<td class="tot">${pT}</td></tr>`; si += `<td class="tot"></td></tr>`;

    let body = "";
    ["s","d"].forEach(key => {
      const side = m[key], colour = key === "s" ? "var(--snots)" : "var(--ducks)";
      if (r.mode === "team"){
        body += rowPair(side.p.map(p => last(p[0])).join(" / "), colour,
          h => teamStrokes(r, side, h), h => (scores[h] || {})[key], from, to);
      } else {
        side.p.forEach(pl => body += rowPair(PLAYERS[pl[0]].n, colour,
          h => playerStrokes(r, side, pl, h), h => (scores[h] || {})[pl[0]], from, to));
        if (side.p.length > 1){
          let g = `<tr class="bestrow"><td class="lbl" style="color:${colour}">${
            key === "s" ? "SNOTS" : "DUCKS"} net</td>`;
          let t = 0, any = false;
          for (let h = from; h <= to; h++){
            const v = sideHole(r, m, key, h, scores);
            g += `<td>${v ? v.net : ""}</td>`;
            if (v){ t += v.net; any = true; }
          }
          body += g + `<td class="tot">${any ? t : ""}</td></tr>`;
        }
      }
      body += `<tr class="sep"><td class="lbl"></td>${"<td></td>".repeat(to - from + 2)}</tr>`;
    });

    /* Running match status, not per-hole winners. A golfer looking at this
       wants "who's up and by how much", not to add up S's and D's. */
    let res = `<tr class="rowres"><td class="lbl">Match</td>`;
    let lastU = null;
    for (let h = from; h <= to; h++){
      const u = run[h];
      if (u === null){ res += `<td></td>`; continue; }
      lastU = u;
      res += `<td class="${u > 0 ? "w" : u < 0 ? "l" : "hh"}">${
        u === 0 ? "AS" : `${Math.abs(u)} UP`}</td>`;
    }
    let totTxt = "";
    if (to === 17 && st.done){
      totTxt = st.winner ? `${shortSide(st.winner)} ${st.text}` : "AS &frac12;&ndash;&frac12;";
    } else if (lastU !== null){
      totTxt = lastU === 0 ? "AS" : `${shortSide(lastU > 0 ? "s" : "d")} ${Math.abs(lastU)} UP`;
    }
    res += `<td class="tot">${totTxt}</td></tr>`;
    return `<div class="gridwrap"><div class="gscroll"><table class="gc">
      <thead>${head}</thead><tbody>${par}${si}${body}${res}</tbody></table></div></div>`;
  };

  return `<div class="topbar">
      <button class="iconbtn" data-nav="match" data-id="${m.id}">&lsaquo;</button>
      <h1>Scorecard<div class="sub">${esc(c.n)} &middot; ${esc(r.fmt)} &middot; ${esc(m.tee || r.tee)}</div></h1>
    </div><div class="wrap">
      <div class="resbar ${st.winner || ""}">
        <div class="r1">Match result</div>
        <div class="r2">${st.started ? matchLine(st) : "Not started"}</div></div>
      ${nine(0, 8, "OUT")}${nine(9, 17, "IN")}
      <div class="gridwrap"><div class="legend">
        <span class="sw u c1">3</span> birdie &middot; <span class="sw u c2">2</span> eagle &middot;
        <span class="sw b1">5</span> bogey &middot; <span class="sw b2">6</span> double<br>
        <span class="rd"></span> a stroke is given on that hole
        ${r.par3Low ? "<br>Par 3s: the pair plays off the lower partner's strokes." : ""}
      </div></div>
      <div class="actions">
        <button class="btn big ghost" data-nav="match" data-id="${m.id}">Return to Your Match</button>
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
      </div>
    </div>`;
}

/* ---------- menu ---------- */
function viewSheet(){
  if (V.sheet !== "menu") return "";
  let codes = "";
  if (Session.admin) codes = `<div class="sect" style="margin-top:4px">Player codes</div>
    <div class="codelist">` + Object.keys(PLAYERS).map(id =>
      `<div class="cn">${esc(PLAYERS[id].n)}<span style="color:var(--dim)"> &middot; ${
        PLAYERS[id].t === "s" ? "Snots" : "Ducks"}</span></div>
       <div class="cc mono">${PLAYERS[id].code}</div>`).join("") + `</div>`;
  return `<div class="sheet" data-close="1"><div class="sheet-in">
    <div class="sheethdr"><h3>${esc(Session.me.n)}</h3>
      <button class="iconbtn" data-closebtn="1">&times;</button></div>
    <p>${Session.me.t === "s" ? "Snots" : "Ducks"} &middot; Index ${fmtIdx(Session.me.idx)}${
      Session.admin ? " &middot; Commissioner" : ""}<br>
      ${Store.online ? "Live sync is on." : "Offline &mdash; scores save here and sync when you get service."}</p>
    ${codes}
    <button class="btn ghost" data-closebtn="1">Close</button>
    <button class="btn ghost" data-signout="1">Return to lock screen</button>
  </div></div>`;
}

/* ==========================================================================
   8. EVENTS
   ========================================================================== */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => {
    const n = el.dataset.nav;
    if (n === "home")  V.view = "home";
    if (n === "board") V.view = "board";
    if (n === "stats") V.view = "stats";
    if (n === "round"){ V.view = "round"; V.round = +el.dataset.i; }
    if (n === "match"){
      V.view = "match"; V.matchId = el.dataset.id;
      const {r, m} = ALL_MATCHES[V.matchId];
      V.round = ROUNDS.indexOf(r);
      const st = matchState(r, m, Store.scores(m.id));
      V.hole = st.done ? Math.max(0, (st.closedAt || 18) - 1) : Math.min(17, st.thru);
    }
    if (n === "card"){ V.view = "card"; V.matchId = el.dataset.id; }
    V.sheet = null; render(); window.scrollTo(0, 0);
  });

  document.querySelectorAll("[data-sheet]").forEach(el =>
    el.onclick = () => { V.sheet = el.dataset.sheet; render(); });
  document.querySelectorAll("[data-sort]").forEach(el =>
    el.onclick = () => { V.statSort = el.dataset.sort; render(); });
  document.querySelectorAll("[data-close]").forEach(el =>
    el.onclick = e => { if (e.target === el){ V.sheet = null; render(); } });
  document.querySelectorAll("[data-closebtn]").forEach(el =>
    el.onclick = () => { V.sheet = null; render(); });
  const so = document.querySelector("[data-signout]");
  if (so) so.onclick = () => { Session.id = null; V.sheet = null; V.view = "home"; render(); };

  document.querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    V.hole = Math.max(0, Math.min(17, V.hole + (+el.dataset.step))); render(); });
  document.querySelectorAll("[data-hole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.hole; render(); });

  const claim = document.querySelector("[data-claim]");
  if (claim) claim.onclick = () => { Store.setScorer(claim.dataset.claim, Session.id); render(); };
  const rst = document.querySelector("[data-reset]");
  if (rst) rst.onclick = () => {
    if (confirm("Wipe every score in this match and start it over?\n\nThis clears it on everyone's phone."))
      { Store.resetMatch(rst.dataset.reset); V.hole = 0; render(); } };

  /* --- gross score inputs -------------------------------------------------
     Writes are "silent" (no re-render) so the keyboard stays open and the
     caret doesn't jump. The derived numbers are patched in place instead. */
  document.querySelectorAll(".gsin").forEach(el => {
    if (el.readOnly) return;
    el.oninput = () => {
      const raw = el.value.replace(/[^0-9]/g, "").slice(0, 2);
      if (el.value !== raw) el.value = raw;
      let v = raw === "" ? null : parseInt(raw, 10);
      if (v !== null && (v < 1 || v > 15)) return;      // wait for a valid number
      const {m} = ALL_MATCHES[V.matchId];
      const sc = Store.scorer(m.id);
      if ((!sc || !sc.id) && inMatch(m, Session.id)) Store.setScorer(m.id, Session.id);
      Store.setScore(m.id, V.hole, el.dataset.entrant, v, Session.id, true);
      patch();
    };
    el.onfocus = () => {
      el.select();
      // iOS slides the keyboard up over the page; put the active box mid-screen.
      setTimeout(() => el.scrollIntoView({block: "center", behavior: "smooth"}), 260);
    };
    el.onblur = () => { if (V.pending){ V.pending = false; render(); } else patch(); };
  });
  const proceed = document.querySelector("[data-proceed]");
  if (proceed) proceed.onclick = () => {
    const ae = document.activeElement;
    if (ae && ae.classList.contains("gsin")) ae.blur();   // commit what's typed
    const {r, m} = ALL_MATCHES[V.matchId];
    const st = matchState(r, m, Store.scores(m.id));
    if (V.hole === 17 || st.done){ V.view = "card"; }
    else V.hole = Math.min(17, V.hole + 1);
    V.pending = false; render(); window.scrollTo(0, 0);
  };
  document.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => {
    const {m} = ALL_MATCHES[V.matchId];
    Store.setScore(m.id, V.hole, el.dataset.clear, null, Session.id, true);
    const inp = document.getElementById(`gs-${el.dataset.clear}`);
    if (inp) inp.value = "";
    patch();
  });

  if (V.view === "match"){
    let x0 = null, y0 = null;
    const w = document.querySelector(".wrap");
    w.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; };
    w.ontouchend = e => {
      if (x0 === null || document.activeElement.classList.contains("gsin")) { x0 = null; return; }
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8){
        V.hole = Math.max(0, Math.min(17, V.hole + (dx < 0 ? 1 : -1))); render();
      }
      x0 = null;
    };
  }
}

/** Update everything derived from a score without rebuilding the DOM. */
function patch(){
  if (V.view !== "match") return;
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores), h = V.hole;

  ["s","d"].forEach(key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores);
    const sn = document.getElementById(`sidenet-${key}`);
    if (sn) sn.innerHTML = bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;";
    const ents = r.mode === "team" ? [[key, teamStrokes(r, side, h)]]
      : side.p.map(pl => [pl[0], playerStrokes(r, side, pl, h)]);
    ents.forEach(([id, strokes]) => {
      const g = (scores[h] || {})[id];
      const out = document.getElementById(`net-${id}`);
      if (out) out.innerHTML = g == null ? "" : `net<b>${g - strokes}</b>`;
      const inp = document.getElementById(`gs-${id}`);
      if (inp){
        inp.className = "gsin " + (g == null ? "blank" : markCls(g, c.par[h]));
        const row = inp.closest(".prow");
        if (row) row.classList.toggle("best",
          !!(bh && bh.byId === id && r.mode !== "team" && side.p.length > 1));
      }
    });
  });

  const r1 = document.getElementById("res1"), r2 = document.getElementById("res2");
  if (r1) r1.textContent = holeLine(r, m, h, scores);
  if (r2) r2.textContent = st.started ? matchLine(st) : "Match not started";
  const rb = document.getElementById("resbar");
  if (rb) rb.className = "resbar " + (st.winner || "");
  for (let i = 0; i < 18; i++){
    const chip = document.getElementById(`chip-${i}`), w = st.holes[i];
    if (chip) chip.className = (i === h ? "cur " : "") +
      (w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : "");
  }
}

/* ==========================================================================
   9. BOOT
   ========================================================================== */
Store.onChange(() => {
  if (!Session.id) return;
  // Never rebuild the DOM out from under someone who is typing a score.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains("gsin")){ V.pending = true; return; }
  render();
});
Store.connect();
render();

window.MI26 = {PLAYERS, COURSES, ROUNDS, ALL_MATCHES, Store, Session, V,
  strokesOn, playerStrokes, teamStrokes, sideHole, matchState, standings, markCls,
  playerStats, toPar, render, patch, MATCH_COUNT, myMatch,
  resetAll(){ Object.keys(ALL_MATCHES).forEach(id => Store.resetMatch(id)); render(); }};
</script>
</body>
