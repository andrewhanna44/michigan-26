<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Michigan '26">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="site.webmanifest">
<title>Crusade in the Creek &middot; Snots vs Ducks</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --surface2:#f4f6f8; --surface3:#e7ebef;
  --line:#dce2e8; --text:#0e1216; --muted:#5c6773; --dim:#8d97a3;
  --red:#c8102e; --red-dim:#fbe9ec;
  --snots:#8a6d00; --snots-solid:#a9840c; --snots-tint:#faf1d5; --snots-edge:#ecdcaa;
  --ducks:#1b6b3f; --ducks-solid:#1b6b3f; --ducks-tint:#e3f0e8; --ducks-edge:#bcdcc8;
  --half:#9aa4b0;
  --shadow:0 1px 2px rgba(14,18,22,.06), 0 1px 8px rgba(14,18,22,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* The lock screen wears the Crusade in the Creek crest: forest green, gold, cream. */
.splash{
  --crest-green:#14472f; --crest-deep:#0e3322; --crest-gold:#c9a227; --crest-cream:#f2e7cd;
  --surface:#0e3322; --surface2:#123d29; --line:#2c6144;
  --text:#f2e7cd; --muted:#a9bfae; --dim:#7d9a88; --red:#c9a227;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:var(--safe-b)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.93);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.1px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:500}
.iconbtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:var(--surface2);border:1px solid var(--line);
  flex:none;font-size:16px;line-height:1}
.iconbtn:active{background:var(--surface3)}
.wrap{padding:14px 14px 40px}

/* ---------- lock screen ---------- */
.splash{position:fixed;inset:0;background:
  radial-gradient(900px 620px at 50% 18%, #1a5638 0%, #0b2a1c 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px;z-index:100;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;background:var(--crest-gold);border-radius:50%;opacity:.4;
  animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.1}50%{opacity:.55}}
.splash-inner{position:relative;z-index:2;width:100%;max-width:390px;text-align:center}
.crest{width:100%;max-width:272px;height:auto;margin:0 auto 16px;display:block}
.dates{font-size:11px;color:var(--crest-gold);letter-spacing:2.6px;text-transform:uppercase;
  font-weight:750;margin-bottom:15px}
.teamrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:15px}
.teamrow .t{font-size:12.5px;font-weight:850;letter-spacing:2.4px}
.teamrow .t.s{color:var(--crest-cream)} .teamrow .t.d{color:#7fc79b}
.teamrow .vs{font-size:10.5px;font-weight:800;color:var(--dim);letter-spacing:1px}
.codein{width:100%;text-align:center;font-size:26px;letter-spacing:11px;font-weight:800;
  padding:15px 10px 15px 21px;border-radius:13px;background:rgba(0,0,0,.28);
  border:1.5px solid var(--line);color:var(--crest-cream);text-transform:uppercase;outline:none}
.codein:focus{border-color:var(--crest-gold)}
.codein::placeholder{letter-spacing:9px;color:#4d6f5b;font-weight:600}
.splash .btn{background:var(--crest-gold);color:#0e3322}
.splash .hint{color:var(--dim)}
.btn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--red);
  color:#fff;font-weight:750;font-size:16px;margin-top:10px;letter-spacing:.2px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow)}
.btn.ghost:active{background:var(--surface2)}
.btn.big{padding:17px;font-size:16.5px}
.hint{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.55}
.err{color:#ff8787;font-size:13px;margin-top:10px;font-weight:600;min-height:18px}

/* ---------- scoreboard ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.board-top{display:flex;align-items:flex-end;gap:8px}
.bteam{flex:1;text-align:center}
.bteam .nm{font-size:11px;font-weight:850;letter-spacing:2px;margin-bottom:3px}
.bteam.s .nm{color:var(--snots)} .bteam.d .nm{color:var(--ducks)}
.bteam .pts{font-size:42px;font-weight:850;line-height:.95;letter-spacing:-1.5px}
.bmid{flex:none;text-align:center;padding-bottom:11px}
.bmid .dash{font-size:15px;color:var(--dim);font-weight:800}
.clinch{text-align:center;font-size:11.5px;color:var(--dim);margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line)}
.clinch b{color:var(--muted)}
.pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:13px;background:var(--surface3)}
.pbar .s{background:var(--snots-solid)} .pbar .d{background:var(--ducks-solid)}

.series{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:11px 14px;margin-bottom:11px;box-shadow:var(--shadow);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.series .sl{flex:1;min-width:0;font-size:12.5px;color:var(--muted);font-weight:650}
.series .sl b{color:var(--text);font-size:15px;font-weight:850;margin-left:3px}
.series .sy{display:flex;gap:5px}
.series .sy span{font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:6px;
  letter-spacing:.3px}
.series .sy .s{background:var(--snots-tint);color:var(--snots)}
.series .sy .d{background:var(--ducks-tint);color:var(--ducks)}
.series .sy .now{outline:1.5px solid var(--red);outline-offset:1px}

/* ---------- round briefing ---------- */
.brief{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.brief .bt{font-size:11px;font-weight:800;letter-spacing:1.6px;color:var(--dim);
  text-transform:uppercase;margin-bottom:6px}
.brief .bd{font-size:12.5px;color:var(--muted);line-height:1.55}
.brief .bd b{color:var(--text)}
.brief ul{margin:8px 0 0;padding:0;list-style:none}
.brief li{font-size:12.5px;padding:5px 0;border-top:1px solid var(--line);line-height:1.45}
.brief li .who{font-weight:750}
.brief li .who.s{color:var(--snots)} .brief li .who.d{color:var(--ducks)}
.brief li .hl{color:var(--muted)}
.brief .none{color:var(--dim)}

/* ---------- pre-match taunt ----------
   Plays once per match, on the way in. Always pro-Snots by design. Tap to skip.
   Pure CSS on inline SVG: nothing downloaded, nothing that can fail on course. */
.taunt{position:fixed;inset:0;z-index:95;background:radial-gradient(700px 500px at 50% 45%,#1a5638,#0b2a1c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:tfade .25s ease-out;cursor:pointer}
.taunt.out{animation:tout .32s ease-in forwards}
@keyframes tfade{from{opacity:0}to{opacity:1}}
@keyframes tout{to{opacity:0}}
.taunt svg{width:min(88vw,380px);height:auto;overflow:visible}
.taunt .tline{color:#f2e7cd;font-size:15px;font-weight:800;letter-spacing:2.4px;
  text-transform:uppercase;margin-top:20px;opacity:0;animation:tin .4s ease-out 1.25s forwards;
  text-align:center;padding:0 20px;line-height:1.5}
.taunt .tsub{color:#c9a227;font-size:11.5px;font-weight:750;letter-spacing:1.6px;
  text-transform:uppercase;margin-top:8px;opacity:0;animation:tin .4s ease-out 1.5s forwards}
.taunt .tskip{position:absolute;bottom:calc(26px + var(--safe-b));color:#7d9a88;
  font-size:11.5px;font-weight:650;letter-spacing:.6px}
@keyframes tin{to{opacity:1}}
/* ball flies in, then the duck gets it */
.tball{animation:tfly 1.05s cubic-bezier(.35,.1,.7,.5) forwards}
@keyframes tfly{0%{transform:translate(-320px,-90px) rotate(0)}100%{transform:translate(0,0) rotate(760deg)}}
.tduck{animation:thit .55s ease-out 1.02s both}
@keyframes thit{0%{transform:translate(0,0) rotate(0)}
  35%{transform:translate(26px,-14px) rotate(16deg)}
  100%{transform:translate(18px,4px) rotate(9deg)}}
.tfeather{opacity:0;animation:tpuff .9s ease-out 1.05s forwards}
@keyframes tpuff{0%{opacity:1;transform:translate(0,0) rotate(0) scale(.4)}
  100%{opacity:0;transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(1)}}
.tstar{opacity:0;animation:tstar 1.5s ease-out 1.08s forwards;transform-origin:center}
@keyframes tstar{0%{opacity:0;transform:scale(.3)}18%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.1)}}
.timpact{opacity:0;animation:timp .38s ease-out 1.02s forwards}
@keyframes timp{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(1.9)}}

/* ---------- Snots win: duck hunt ---------- */
.wsky{animation:tfade .3s ease-out}
.wgrass{animation:wrise .5s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes wrise{from{transform:translateY(70px)}to{transform:translateY(0)}}
.wastro{animation:wpop .55s cubic-bezier(.2,.9,.3,1.3) .45s both}
@keyframes wpop{from{transform:translateY(90px)}to{transform:translateY(0)}}
.wduck{transform-origin:center}
.wduck.a{animation:wfly1 2.5s ease-in .25s both}
.wduck.b{animation:wfly2 2.5s ease-in .55s both}
@keyframes wfly1{
  0%{transform:translate(-230px,26px) rotate(-6deg)}
  44%{transform:translate(6px,-12px) rotate(4deg)}
  52%{transform:translate(16px,-6px) rotate(24deg)}
  100%{transform:translate(46px,250px) rotate(230deg);opacity:.85}}
@keyframes wfly2{
  0%{transform:translate(-260px,-34px) rotate(-4deg)}
  44%{transform:translate(-24px,-58px) rotate(6deg)}
  52%{transform:translate(-14px,-50px) rotate(-22deg)}
  100%{transform:translate(-58px,250px) rotate(-210deg);opacity:.85}}
.wwing{transform-origin:22px 8px;animation:wflap .26s ease-in-out infinite alternate}
@keyframes wflap{from{transform:rotate(-26deg)}to{transform:rotate(24deg)}}
.wflash{opacity:0;animation:wbang .3s ease-out 1.32s}
.wflash.two{animation-delay:1.62s}
@keyframes wbang{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.8)}}
.wpuff{opacity:0;animation:wbang .5s ease-out 1.35s}
.wpuff.two{animation-delay:1.65s}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);
  z-index:90;max-width:calc(100% - 28px);width:max-content;background:#0e1216;color:#fff;
  border-radius:13px;padding:12px 16px;font-size:13.5px;font-weight:650;line-height:1.4;
  box-shadow:0 8px 28px rgba(0,0,0,.3);text-align:center;animation:tup .22s ease-out}
@keyframes tup{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.toast b{font-weight:850}
.toast .win.s{color:#f0d78a} .toast .win.d{color:#7fc79b}

/* ---------- cards ---------- */
.sect{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--dim);
  text-transform:uppercase;margin:22px 0 9px}
.sect:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;display:block;width:100%;text-align:left;
  box-shadow:var(--shadow)}
.card:active{background:var(--surface2)}
.card.flat{background:var(--surface2);box-shadow:none}
.card.me{border-color:var(--red);border-width:1.5px}
.rowline{display:flex;align-items:center;gap:11px}
.rnum{width:33px;height:33px;border-radius:9px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;color:var(--muted)}
.rnum.done{background:var(--red-dim);border-color:#f2ccd3;color:var(--red)}
.rmeta{flex:1;min-width:0}
.rmeta .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rright{flex:none;text-align:right}
.rright .big{font-weight:800;font-size:15px}
.rright .small{font-size:11px;color:var(--dim);margin-top:2px}
.chev{color:var(--dim);font-size:19px;flex:none;margin-left:2px}
.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.badge.live{background:var(--red);color:#fff}
.badge.fin{background:var(--surface3);color:var(--muted)}
.badge.soon{background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.badge.s{background:var(--snots-tint);color:var(--snots)}
.badge.d{background:var(--ducks-tint);color:var(--ducks)}
.badge.h{background:var(--surface3);color:var(--muted)}

/* ---------- hole entry ---------- */
.holehead{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:11px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.holenav{display:flex;align-items:center;gap:12px}
.navbtn{width:42px;height:42px;border-radius:11px;background:var(--surface2);flex:none;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:700}
.navbtn:active{background:var(--surface3)}
.navbtn:disabled{opacity:.32}
.holeinfo{flex:1;text-align:center}
.holeinfo .hn{font-size:23px;font-weight:850;line-height:1;letter-spacing:-.5px}
.holeinfo .hd{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:600}
.strip{display:flex;gap:3px;margin-top:10px}
.strip button{flex:1;height:27px;border-radius:5px;background:var(--surface2);
  border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--dim);
  display:flex;align-items:center;justify-content:center;padding:0;min-width:0}
.strip button.cur{outline:2px solid var(--text);outline-offset:-1px;color:var(--text)}
.strip button.w{background:var(--snots-solid);border-color:var(--snots-solid);color:#fff}
.strip button.l{background:var(--ducks-solid);border-color:var(--ducks-solid);color:#fff}
.strip button.h{background:var(--half);border-color:var(--half);color:#fff}

.sidebox{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.sidehdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  font-size:11px;font-weight:850;letter-spacing:2px;border-bottom:1px solid var(--line)}
.sidebox.s .sidehdr{color:var(--snots);background:var(--snots-tint)}
.sidebox.d .sidehdr{color:var(--ducks);background:var(--ducks-tint)}
.sidehdr .net{letter-spacing:.3px;font-weight:700;font-size:12px;color:var(--muted);text-transform:none}
.prow{padding:8px 12px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.prow.best{background:var(--surface2)}
.pname{font-size:13.5px;font-weight:700;line-height:1.2}
.pname .hc{color:var(--dim);font-weight:600;font-size:10.5px;margin-left:5px}
.pname .ball{color:var(--red);font-weight:800;font-size:9.5px;letter-spacing:.6px;
  text-transform:uppercase;margin-left:5px}
.entry{display:flex;align-items:center;gap:9px;margin-top:5px}
.entry .lab{font-size:11.5px;color:var(--muted);font-weight:650;flex:none}
.gswrap{position:relative;flex:none}
.gsin{width:54px;height:44px;text-align:center;font-size:20px;font-weight:800;
  background:var(--surface2);border:1.5px solid transparent;border-radius:11px;
  color:var(--text);outline:none;padding:0;-moz-appearance:textfield}
.gsin::-webkit-outer-spin-button,.gsin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gsin:focus{background:#fff;border-color:var(--text)!important;border-radius:11px!important;
  box-shadow:0 0 0 3px rgba(14,18,22,.09)!important}
.gsin.blank{border:1.5px dashed var(--line);background:transparent}
/* Sits outside the score box so it stays visible on top of a circled birdie. */
.gsdots{position:absolute;top:-3px;right:-3px;display:flex;gap:2px;pointer-events:none}
.gsdots .dot{width:6px;height:6px;border-radius:50%;background:var(--red);
  box-shadow:0 0 0 2px var(--surface)}
.entry .out{flex:1;text-align:right;font-size:11px;color:var(--dim);font-weight:650}
.entry .out b{display:block;font-size:17px;color:var(--text);font-weight:800;line-height:1.15}
.entry .clr{flex:none;width:31px;height:31px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:800;display:flex;
  align-items:center;justify-content:center}
.entry .clr.on{background:var(--red);border-color:var(--red);color:#fff}
.gsin.picked{background:var(--red-dim);border:1.5px solid var(--red)!important;
  color:var(--red);border-radius:11px!important}

/* prev / save / next bar under the score boxes */
.holebar{display:flex;gap:7px;margin-top:12px}
.holebar button{border-radius:12px;padding:13px 6px;font-weight:750;font-size:13px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.holebar button:disabled{opacity:.34}
.holebar .side{flex:none;width:84px;color:var(--muted);font-size:11px;white-space:nowrap}
.holebar .go{flex:1;background:var(--red);border-color:var(--red);color:#fff;font-size:14px}
.holebar .go:active{filter:brightness(.9)}
.holebar .go.fin{background:var(--text);border-color:var(--text)}
.savedtag{text-align:center;font-size:11px;color:var(--dim);margin-top:8px}

/* under par = red + circles.  par = plain black.  over par = black + boxes. */
.u{color:var(--red)!important}
.c1,.c2,.c3{border:1.5px solid currentColor!important;border-radius:50%!important}
.b1,.b2,.b3{border:1.5px solid currentColor!important;border-radius:4px!important}
.c2,.b2{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor}
.c3,.b3{box-shadow:0 0 0 1.6px var(--surface),0 0 0 3px currentColor,
        0 0 0 4.6px var(--surface),0 0 0 6px currentColor}
.mk{display:inline-flex;align-items:center;justify-content:center;
  min-width:21px;height:21px;line-height:1;font-weight:750}
.mk.picked{color:var(--red);font-weight:850}
table.gc td.tap{cursor:pointer}
table.gc td.tap:active{background:var(--surface3)}

.resbar{border-radius:13px;padding:11px;text-align:center;margin-bottom:9px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.resbar .r1{font-size:11.5px;color:var(--muted);font-weight:650}
.resbar .r2{font-size:19px;font-weight:850;margin-top:3px;letter-spacing:-.3px}
.resbar.s{background:var(--snots-tint);border-color:var(--snots-edge)}
.resbar.d{background:var(--ducks-tint);border-color:var(--ducks-edge)}
.resbar.halved{background:var(--surface3);border-color:var(--line)}
.resbar.s .r2{color:var(--snots)} .resbar.d .r2{color:var(--ducks)}
.resbar.halved .r2{color:var(--muted)}
table.gc .rowres .tot.s{background:var(--snots-solid);color:#fff}
table.gc .rowres .tot.d{background:var(--ducks-solid);color:#fff}
table.gc .rowres .tot.h{background:var(--half);color:#fff}
.lockbar{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:11px;font-size:12.5px;color:var(--muted);line-height:1.5}
.lockbar b{color:var(--text)}
.lockbar button{color:var(--red);font-weight:750;text-decoration:underline;padding:0}

/* A restrained colour per round so they're easy to tell apart at a glance —
   deliberately nothing near the Snots gold or Ducks green. */
const ROUND_COLOUR = ["#2f5d8a", "#5a4b8a", "#a05a2c", "#2f7d7d", "#8a2f4a"];
const rColour = n => ROUND_COLOUR[(n - 1) % ROUND_COLOUR.length];

/* Series history. This year's winner is appended automatically once every
   match is final — see seriesHTML(). */
const SERIES = [{y:2023, w:"s"}, {y:2024, w:"s"}, {y:2025, w:"d"}];

const ALL_MATCHES = {};
ROUNDS.forEach(r => r.matches.forEach(m => ALL_MATCHES[m.id] = {r, m}));
const MATCH_COUNT  = Object.keys(ALL_MATCHES).length;
const TOTAL_POINTS = MATCH_COUNT * PT_WIN;
const CLINCH       = TOTAL_POINTS / 2 + PT_HALVE;

/* ==========================================================================
   3. SCORING ENGINE  (gross in -> everything else derived)
   ========================================================================== */
function strokesOn(allowance, strokeIndex){
  if (!allowance || allowance <= 0) return 0;
  let s = 0;
  if (strokeIndex <= allowance) s++;
  if (strokeIndex <= allowance - 18) s++;
  return s;
}
function playerStrokes(r, side, pl, h){
  const c = COURSES[r.course];
  let allow = pl[2];
  if (r.par3Low && c.par[h] === 3) allow = Math.min(...side.p.map(x => x[2]));
  return strokesOn(allow, c.hcp[h]);
}
function teamStrokes(r, side, h){ return strokesOn(side.net, COURSES[r.course].hcp[h]); }

/**
 * Everyone's number on one hole, with picked-up balls ("X") resolved.
 *
 * A pick-up scores double par — except when double par would actually win the
 * hole, which would reward walking in. In that case he takes one more than the
 * worst score in the group, so a pick-up can never help his side.
 */
function holeScores(r, m, h, scores){
  const c = COURSES[r.course], par = c.par[h], row = scores[h] || {};
  const ents = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => ents.push({id:k, side:k, raw: row[k], strokes: teamStrokes(r, m[k], h)}));
  } else {
    ["s","d"].forEach(k => m[k].p.forEach(pl =>
      ents.push({id: pl[0], side: k, raw: row[pl[0]], strokes: playerStrokes(r, m[k], pl, h)})));
  }
  const realNets = ents.filter(e => typeof e.raw === "number").map(e => e.raw - e.strokes);
  const best = realNets.length ? Math.min(...realNets) : null;
  const worst = realNets.length ? Math.max(...realNets) : null;

  const out = {};
  ents.forEach(e => {
    if (e.raw == null) return;
    if (e.raw === PICKED){
      // "<=" not "<": tying the best would still let a walk-in halve the hole
      const dbl = 2 * par;
      const gross = (best !== null && dbl - e.strokes <= best) ? worst + 1 + e.strokes : dbl;
      out[e.id] = {gross, net: gross - e.strokes, strokes: e.strokes, picked: true, side: e.side};
    } else {
      out[e.id] = {gross: e.raw, net: e.raw - e.strokes, strokes: e.strokes, picked: false, side: e.side};
    }
  });
  return out;
}

function sideHole(r, m, key, h, scores){
  const hs = holeScores(r, m, h, scores);
  if (r.mode === "team"){
    const v = hs[key];
    return v ? {net: v.net, gross: v.gross, byId: null, picked: v.picked} : null;
  }
  let best = null;
  for (const pl of m[key].p){
    const v = hs[pl[0]];
    if (!v) continue;
    if (!best || v.net < best.net) best = {net: v.net, gross: v.gross, byId: pl[0], picked: v.picked};
  }
  return best;
}

function matchState(r, m, scores){
  let up = 0, sW = 0, dW = 0, halved = 0;
  const holes = new Array(18).fill(null);
  let closedAt = null, closedMargin = 0;
  for (let h = 0; h < 18; h++){
    const s = sideHole(r, m, "s", h, scores);
    const d = sideHole(r, m, "d", h, scores);
    if (!s || !d) continue;
    let w;
    if (s.net < d.net){ w = "s"; up++; sW++; }
    else if (d.net < s.net){ w = "d"; up--; dW++; }
    else { w = "h"; halved++; }
    holes[h] = w;
    if (closedAt === null && Math.abs(up) > 17 - h){
      closedAt = h + 1; closedMargin = Math.abs(up);
    }
  }
  const played = sW + dW + halved, thru = played;
  const done = closedAt !== null || played === 18;
  let text, winner = null;
  if (closedAt !== null){
    winner = up > 0 ? "s" : "d";
    const rem = 18 - closedAt;
    text = rem === 0 ? "1 UP" : `${closedMargin} & ${rem}`;
  } else if (played === 18){
    if (up === 0) text = "HALVED";
    else { winner = up > 0 ? "s" : "d"; text = `${Math.abs(up)} UP`; }
  } else if (played === 0){ text = "Not started"; }
  else {
    text = up === 0 ? "ALL SQUARE" : `${Math.abs(up)} UP`;
    winner = up === 0 ? null : (up > 0 ? "s" : "d");
  }
  return {up, thru, played, holes, done, winner, text, closedAt, started: played > 0,
          pts: {s: done ? (up > 0 ? PT_WIN : up < 0 ? 0 : PT_HALVE) : 0,
                d: done ? (up < 0 ? PT_WIN : up > 0 ? 0 : PT_HALVE) : 0}};
}

function standings(){
  let s = 0, d = 0, ps = 0, pd = 0, fin = 0, live = 0;
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done){ s += st.pts.s; d += st.pts.d; ps += st.pts.s; pd += st.pts.d; fin++; }
    else if (st.started){
      live++;
      if (st.up > 0) ps += PT_WIN; else if (st.up < 0) pd += PT_WIN;
      else { ps += PT_HALVE; pd += PT_HALVE; }
    }
  }
  return {s, d, projS: ps, projD: pd, fin, live};
}

/**
 * Per-player totals across the whole trip.
 * Best Ball / Shamble / Singles have a score per man, so it's his own.
 * Scramble / Alternate Shot only have a team score — that score is credited
 * to BOTH partners, since it's the number they made together.
 * Birdies/bogeys are counted off GROSS vs par, the way a scorecard reads.
 */
function playerStats(){
  const acc = {};
  Object.keys(PLAYERS).forEach(id => acc[id] = {holes:0, gross:0, net:0, par:0,
    eagle:0, birdie:0, parCt:0, over:0,
    eagleN:0, birdieN:0, parCtN:0, overN:0, underN:0, rounds:new Set()});
  const bump = (a, gross, net, par, rid) => {
    a.holes++; a.gross += gross; a.net += net; a.par += par; a.rounds.add(rid);
    const d = gross - par;
    if (d <= -2) a.eagle++; else if (d === -1) a.birdie++;
    else if (d === 0) a.parCt++; else a.over++;
    const n = net - par;                       // same counts, measured off net
    if (n <= -2) a.eagleN++; else if (n === -1) a.birdieN++;
    else if (n === 0) a.parCtN++; else a.overN++;
    if (n < 0) a.underN++;                     // MVP tie-break
  };
  ROUNDS.forEach(r => {
    const c = COURSES[r.course];
    r.matches.forEach(m => {
      const scores = Store.scores(m.id);
      for (let h = 0; h < 18; h++){
        const hs = holeScores(r, m, h, scores);   // picked-up balls already resolved
        if (r.mode === "team"){
          ["s","d"].forEach(k => { const v = hs[k]; if (!v) return;
            m[k].p.forEach(pl => bump(acc[pl[0]], v.gross, v.net, c.par[h], r.n)); });
        } else for (const id in hs) bump(acc[id], hs[id].gross, hs[id].net, c.par[h], r.n);
      }
    });
  });
  const pts = playerPoints();
  return Object.keys(acc).map(id => {
    const a = acc[id];
    return {id, name: PLAYERS[id].n, last: last(id), team: PLAYERS[id].t, holes: a.holes,
            grossToPar: a.gross - a.par, netToPar: a.net - a.par,
            eagle: a.eagle, birdie: a.birdie, parCt: a.parCt, over: a.over,
            eagleN: a.eagleN, birdieN: a.birdieN, parCtN: a.parCtN, overN: a.overN,
            underN: a.underN, points: pts[id] || 0, rounds: a.rounds.size};
  }).filter(p => p.holes > 0);
}

/** Points each player has contributed. In a 2v2 match both partners get the
    side's points — they won it together. */
function playerPoints(){
  const out = {};
  Object.keys(PLAYERS).forEach(id => out[id] = 0);
  ROUNDS.forEach(r => r.matches.forEach(m => {
    const st = matchState(r, m, Store.scores(m.id));
    if (!st.done) return;
    ["s","d"].forEach(k => m[k].p.forEach(pl => out[pl[0]] += st.pts[k]));
  }));
  return out;
}

/** Most points on the leading team. Ties broken by holes played under net par. */
function mvp(){
  const st = standings();
  if (st.s === st.d && st.projS === st.projD) return null;
  const team = (st.s > st.d) || (st.s === st.d && st.projS > st.projD) ? "s" : "d";
  const pool = playerStats().filter(p => p.team === team && p.points > 0);
  if (!pool.length) return null;
  pool.sort((a, b) => b.points - a.points || b.underN - a.underN || a.netToPar - b.netToPar);
  return {...pool[0], team, decided: st.fin === MATCH_COUNT};
}

/* ==========================================================================
   4. STORE  — localStorage is durable truth, Firebase is shared truth.
   Every cell is timestamped, so merging is "newest wins".
   ========================================================================== */
const Store = (() => {
  const LS = `${EVENT_KEY}_data`, LS_CHAT = `${EVENT_KEY}_chat`, LS_SEEN = `${EVENT_KEY}_chatseen`;
  let data = {}, chatData = {}, chatSeen = {};
  let db = null, connected = false, authed = false, chatBlocked = null, listeners = [];
  /* Every merge is "newest timestamp wins". If we trusted each phone's own
     clock, one man with a wrong clock would either lose every correction he
     makes or silently overwrite everyone else's. Firebase tells us how far
     this device is from the server, so we stamp everything in server time. */
  let clockOffset = 0;
  const now = () => Date.now() + clockOffset;
  try { data = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ data = {}; }
  try { chatData = JSON.parse(localStorage.getItem(LS_CHAT) || "{}"); } catch(e){ chatData = {}; }
  try { chatSeen = JSON.parse(localStorage.getItem(LS_SEEN) || "{}"); } catch(e){ chatSeen = {}; }
  const flush = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} };
  const flushChat = () => { try { localStorage.setItem(LS_CHAT, JSON.stringify(chatData)); } catch(e){} };
  const bucket = id => (data[id] = data[id] || {scores:{}, scorer:null});

  function mergeRemote(id, remote){
    if (!remote) return false;
    const b = bucket(id); let changed = false;
    if (remote.scores) for (const h in remote.scores) for (const e in remote.scores[h]){
      const rc = remote.scores[h][e], lc = (b.scores[h] || {})[e];
      if (!rc || typeof rc.t !== "number") continue;
      if (!lc || rc.t > lc.t){ b.scores[h] = b.scores[h] || {}; b.scores[h][e] = rc; changed = true; }
    }
    if (remote.scorer && (!b.scorer || remote.scorer.t > b.scorer.t)){
      b.scorer = remote.scorer; changed = true;
    }
    if (remote.submitted && (!b.submitted || remote.submitted.t > b.submitted.t)){
      b.submitted = remote.submitted; changed = true;
    }
    return changed;
  }

  return {
    get online(){ return connected; },
    get authed(){ return authed; },
    get chatBlocked(){ return chatBlocked; },
    onChange(fn){ listeners.push(fn); },
    _emit(){ listeners.forEach(f => f()); },

    scores(id){
      const b = data[id]; if (!b) return {};
      const out = {};
      for (const h in b.scores) for (const e in b.scores[h]){
        const c = b.scores[h][e];
        if (!c) continue;
        if (c.x){ out[h] = out[h] || {}; out[h][e] = PICKED; }
        else if (c.v != null){ out[h] = out[h] || {}; out[h][e] = c.v; }
      }
      return out;
    },

    /* val: a number, null to clear, or PICKED for a picked-up ball.
       silent = write through without re-rendering, so a focused input keeps focus */
    setScore(id, h, entrant, val, by, silent){
      const b = bucket(id), t = now();
      const pick = val === PICKED;
      const cell = {v: pick ? null : val, x: pick ? true : null, t, by};
      b.scores[h] = b.scores[h] || {};
      b.scores[h][entrant] = cell;
      flush();
      if (!silent) this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${entrant}`), cell).catch(()=>{});
    },

    scorer(id){ return (data[id] || {}).scorer || null; },
    setScorer(id, pid){
      const b = bucket(id), t = now();
      b.scorer = {id: pid, t}; flush(); this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: pid, t}).catch(()=>{});
    },

    /* A submitted match is signed off and locked. Scoring stays open until
       someone submits, so all 18 holes can be entered for the statistics even
       after the match itself is mathematically over. */
    isSubmitted(id){ const s = (data[id] || {}).submitted; return !!(s && s.v); },
    submittedBy(id){ const s = (data[id] || {}).submitted; return s && s.v ? s.by : null; },
    setSubmitted(id, val, by){
      const b = bucket(id), t = now();
      b.submitted = {v: !!val, by: by || "", t}; flush(); this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/submitted`),
                     {v: !!val, by: by || "", t}).catch(()=>{});
    },

    /* Tombstone every hole/entrant this match could ever have, not just the
       ones this phone happens to know about — otherwise a reset issued here
       won't clear scores that only exist on someone else's phone. */
    resetMatch(id){
      const b = bucket(id), t = now(), payload = {};
      const entry = ALL_MATCHES[id];
      const ents = new Set(Object.keys(b.scores).flatMap(h => Object.keys(b.scores[h])));
      if (entry){
        const {r, m} = entry;
        if (r.mode === "team"){ ents.add("s"); ents.add("d"); }
        else ["s","d"].forEach(k => m[k].p.forEach(pl => ents.add(pl[0])));
      }
      for (let h = 0; h < 18; h++) for (const e of ents){
        b.scores[h] = b.scores[h] || {};
        b.scores[h][e] = {v: null, t, by: "reset"};
        payload[`${h}/${e}`] = {v: null, t, by: "reset"};
      }
      b.scorer = {id: null, t};
      b.submitted = {v: false, by: "reset", t};
      flush(); this._emit();
      if (db){
        update(ref(db, `${EVENT_KEY}/matches/${id}/scores`), payload).catch(()=>{});
        update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: null, t}).catch(()=>{});
        update(ref(db, `${EVENT_KEY}/matches/${id}/submitted`),
               {v: false, by: "reset", t}).catch(()=>{});
      }
    },

    /* ---- chat -------------------------------------------------------------
       Messages are create-only: the rules refuse overwrites and deletes, so
       nobody (including a bot) can rewrite the history. Sends are optimistic —
       the message shows immediately and is marked "sending" until the server
       confirms, so a dead spot never eats a message silently. */
    chat(channel){
      const c = chatData[channel] || {};
      return Object.keys(c).map(id => ({id, ...c[id]}))
        .sort((a, b) => a.t - b.t);
    },
    chatSend(channel, txt, by){
      const t = now();
      const id = db ? push(ref(db, `${EVENT_KEY}/chat/${channel}`)).key
                    : `local-${t}-${Math.random().toString(36).slice(2, 8)}`;
      chatData[channel] = chatData[channel] || {};
      chatData[channel][id] = {by, txt, t, state: "sending"};
      flushChat(); this._emit();
      if (!db){ chatData[channel][id].state = "failed"; flushChat(); this._emit(); return; }
      set(ref(db, `${EVENT_KEY}/chat/${channel}/${id}`), {by, txt, t})
        .then(() => { if (chatData[channel][id]){ delete chatData[channel][id].state;
                      flushChat(); this._emit(); } })
        .catch(err => { chatData[channel][id].state = "failed";
                        chatData[channel][id].err = err.code || String(err);
                        flushChat(); this._emit(); });
    },
    chatRetry(){
      for (const ch in chatData) for (const id in chatData[ch]){
        const m = chatData[ch][id];
        if (m.state !== "failed") continue;
        delete chatData[ch][id];
        this.chatSend(ch, m.txt, m.by);
      }
    },
    chatUnread(channel){
      const seen = chatSeen[channel] || 0;
      return this.chat(channel).filter(m => m.t > seen && m.by !== Session.id).length;
    },
    chatMarkRead(channel){
      const list = this.chat(channel);
      chatSeen[channel] = list.length ? list[list.length - 1].t : now();
      try { localStorage.setItem(LS_SEEN, JSON.stringify(chatSeen)); } catch(e){}
    },

    /* ---- backup ------------------------------------------------------------
       A full snapshot of every score, scorer, submission and chat message.
       Restoring feeds it back through the same newest-wins merge the live sync
       uses, so a restore can only ever add back what was lost — it can't
       clobber something newer that happened in the meantime. */
    exportAll(){
      return {app:"crusade-in-the-creek", build:BUILD, event:EVENT_KEY,
              takenAt:new Date(now()).toISOString(), matches:data, chat:chatData};
    },
    /* A restore has to beat a wipe. A reset writes "deleted" markers stamped
       LATER than the backup, so a plain newest-wins merge would refuse to bring
       anything back — useless in the one situation a backup is for. So: a cell
       that currently holds no score is treated as missing and always restored,
       and everything written is re-stamped now so it propagates to phones that
       are still holding the wipe. A cell that holds a real, newer score is left
       alone. */
    importAll(blob){
      if (!blob || blob.event !== EVENT_KEY) throw new Error("That file isn't a Crusade backup.");
      let restored = 0, skipped = 0;
      const stamp = now();
      const empty = c => !c || (c.v == null && !c.x);
      for (const id in (blob.matches || {})){
        const inc = blob.matches[id], b = bucket(id);
        for (const h in (inc.scores || {})) for (const e in inc.scores[h]){
          const rc = inc.scores[h][e], lc = (b.scores[h] || {})[e];
          if (!rc || typeof rc.t !== "number") continue;
          if (empty(rc)) continue;                       // nothing to restore
          if (empty(lc) || rc.t > lc.t){
            const cell = {...rc, t: stamp};
            b.scores[h] = b.scores[h] || {}; b.scores[h][e] = cell; restored++;
            if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${e}`), cell).catch(()=>{});
          } else skipped++;
        }
        for (const field of ["scorer","submitted"]){
          const rc = inc[field];
          if (!rc || typeof rc.t !== "number") continue;
          const lc = b[field];
          const lcEmpty = !lc || (field === "scorer" ? !lc.id : !lc.v);
          if (lcEmpty || rc.t > lc.t){
            const cell = {...rc, t: stamp};
            b[field] = cell; restored++;
            if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/${field}`), cell).catch(()=>{});
          } else skipped++;
        }
      }
      for (const ch in (blob.chat || {})){
        chatData[ch] = chatData[ch] || {};
        for (const mid in blob.chat[ch]){
          const msg = blob.chat[ch][mid];
          if (!msg || typeof msg.t !== "number" || chatData[ch][mid]) continue;
          delete msg.state; delete msg.err;
          chatData[ch][mid] = msg; restored++;
          if (db) set(ref(db, `${EVENT_KEY}/chat/${ch}/${mid}`), msg).catch(()=>{});
        }
      }
      flush(); flushChat(); this._emit();
      return {restored, skipped};
    },

    async connect(){
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        // Anonymous sign-in: no login screen, but the database can require a
        // token, which shuts out unauthenticated bots.
        try { await signInAnonymously(getAuth(app)); authed = true; }
        catch(e){ authed = false; console.warn("anonymous auth unavailable", e.code || e); }
        db = getDatabase(app);
        onValue(ref(db, ".info/connected"), s => { connected = !!s.val(); this._emit(); });
        onValue(ref(db, ".info/serverTimeOffset"), s => {
          const v = s.val();
          if (typeof v === "number") clockOffset = v;
        });
        onValue(ref(db, `${EVENT_KEY}/matches`), snap => {
          const all = snap.val() || {}; let changed = false;
          for (const id in all) if (mergeRemote(id, all[id])) changed = true;
          if (changed){ flush(); this._emit(); }
        }, err => console.warn("sync read blocked:", err.code || err));
        /* The server is the authority here, not this phone. Firebase applies a
           write to its local cache before the server has accepted it, so a
           message the rules reject briefly looks real. If we only ever ADDED
           from the snapshot, that phantom would live on this phone forever,
           showing its owner a message nobody else can see. So: rebuild from
           the snapshot each time, keeping only local messages that genuinely
           haven't reached the server yet (still sending, or failed). */
        onValue(ref(db, `${EVENT_KEY}/chat`), snap => {
          const all = snap.val() || {}, next = {};
          for (const ch in all){
            next[ch] = {};
            for (const id in all[ch]){
              const m = all[ch][id];
              if (m && typeof m.t === "number") next[ch][id] = m;
            }
          }
          for (const ch in chatData){
            next[ch] = next[ch] || {};
            for (const id in chatData[ch]){
              const m = chatData[ch][id];
              if (m && m.state && !next[ch][id]) next[ch][id] = m;
            }
          }
          chatData = next; flushChat(); this._emit();
        }, err => { chatBlocked = err.code || String(err);
                    console.warn("chat read blocked:", chatBlocked); this._emit(); });
      } catch(e){ console.warn("sync unavailable", e); }
    }
  };
})();

   ========================================================================== */
const Session = {
  get id(){ return localStorage.getItem(`${EVENT_KEY}_me`); },
  set id(v){ v ? localStorage.setItem(`${EVENT_KEY}_me`, v)
                : localStorage.removeItem(`${EVENT_KEY}_me`); },
  get me(){ return PLAYERS[this.id] || null; },
  get admin(){ return !!(this.me && this.me.admin); },
  find(code){
    const c = (code || "").trim().toUpperCase();
    return Object.keys(PLAYERS).find(id => PLAYERS[id].code === c) || null;
  }
};
const inMatch = (m, pid) => [...m.s.p, ...m.d.p].some(x => x[0] === pid);
/* Scoring is never granted implicitly. Someone in the match must actively
   declare themselves scorekeeper first — otherwise four men open the same
   match, all get editable boxes, and the card turns to mush. */
function canScore(m){
  const me = Session.id; if (!me) return false;
  if (Store.isSubmitted(m.id)) return false;     // signed off — reopen to edit
  if (Session.admin) return true;
  const sc = Store.scorer(m.id);
  return !!(sc && sc.id === me);
}
const canClaim = m => Session.admin || inMatch(m, Session.id);
function myMatch(){
  for (const r of ROUNDS) for (const m of r.matches){
    if (inMatch(m, Session.id) && !matchState(r, m, Store.scores(m.id)).done) return m.id;
  }
  for (let i = ROUNDS.length - 1; i >= 0; i--)
    for (const m of ROUNDS[i].matches) if (inMatch(m, Session.id)) return m.id;
  return null;
}

let V = {view:"home", round:0, matchId:null, hole:0, sheet:null, pending:false,
         chan:"all", draft:null, refocusChat:false, statSort:"net", fromCard:false};

/* GitHub Pages caches the page, so a phone can keep running an old build for
   hours after a fix ships. Poll for a newer BUILD and offer a one-tap reload —
   nobody on a golf course is going to know how to clear a browser cache. */
let updateReady = false;
async function checkForUpdate(){
  if (updateReady) return;
  try {
    // a 12-byte file, not the whole 100KB page — this runs every 10 minutes on
    // 20 phones using their cellular data
    const res = await fetch(`version.txt?cb=${Date.now()}`, {cache: "no-store"});
    if (!res.ok) return;
    const live = (await res.text()).trim();
    if (live && live !== BUILD){ updateReady = true; if (Session.id) render(); }
  } catch(e){ /* offline — try again later */ }
}
function applyUpdate(){
  // a plain reload can be served from cache; a fresh query string cannot
  location.replace(location.pathname + "?v=" + Date.now());
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtPt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");
const shotLbl = n => `${n <= 0 ? 0 : n} shot${n === 1 ? "" : "s"}`;
const fmtIdx = i => i < 0 ? `+${Math.abs(i).toFixed(1)}` : i.toFixed(1);

/* Golf scorecard notation: under par is red and circled (1 ring per stroke
   under), over par is black and boxed. Par is a plain black number. */
function markCls(gross, par){
  if (gross == null) return "";
  const d = gross - par;
  if (d < 0) return `u c${Math.min(3, -d)}`;
  if (d > 0) return `b${Math.min(3, d)}`;
  return "";
}
function yards(r, m, h){
  const c = COURSES[r.course], tee = m.tee || r.tee;
  if (c.yds[tee]) return c.yds[tee][h] + " yds";
  const parts = tee.split("/").filter(p => c.yds[p]);
  if (parts.length === 2) return `${c.yds[parts[0]][h]}/${c.yds[parts[1]][h]} yds`;
  return null;
}
const dotsHTML = n => n <= 0 ? "" :
  `<span class="gsdots">${'<span class="dot"></span>'.repeat(n)}</span>`;

   ========================================================================== */
function render(){
  const app = $("#app");
  if (!Session.id){ app.innerHTML = viewLogin(); wireLogin(); return; }
  let html = updateReady
    ? `<button class="updbar" data-update="1">A newer version is ready &mdash; tap to update</button>` : "";
  if (V.view === "home")  html += viewHome();
  if (V.view === "board") html += viewBoard();
  if (V.view === "matches") html += viewMatches();
  if (V.view === "stats") html += viewStats();
  if (V.view === "chat")  html += viewChat();
  if (V.view === "round") html += viewRound();
  if (V.view === "match") html += viewMatch();
  if (V.view === "card")  html += viewCard();
  if (V.sheet) html += viewSheet();
  app.innerHTML = html;
  wire();
}

/** Round-level roll-up used by both the Matches list and the Leaderboard. */
function roundSummary(r){
  let s = 0, d = 0, done = 0, live = 0, sLead = 0, dLead = 0, allSq = 0, notStarted = 0;
  r.matches.forEach(m => {
    const ms = matchState(r, m, Store.scores(m.id));
    if (ms.done){ s += ms.pts.s; d += ms.pts.d; done++; }
    else if (ms.started){ live++;
      if (ms.up > 0) sLead++; else if (ms.up < 0) dLead++; else allSq++; }
    else notStarted++;
  });
  return {s, d, done, live, sLead, dLead, allSq, notStarted,
          complete: done === r.matches.length, started: done + live > 0};
}
const roundBadge = sum => sum.complete ? `<span class="badge fin">Complete</span>`
  : sum.live ? `<span class="badge live">Live</span>`
  : `<span class="badge soon">Upcoming</span>`;

/* ---------- leaderboard (Ryder Cup style) ----------
   Deliberately different from All Matches: this is a board you read, not a
   menu you navigate. Each row puts a side on the left, a side on the right,
   and the running status between them, with the leader's half tinted. */
function viewBoard(){
  const st = standings();
  let out = "";
  ROUNDS.forEach((r, ri) => {
    const sum = roundSummary(r);
    let rows = "";
    r.matches.forEach(m => {
      const ms = matchState(r, m, Store.scores(m.id));
      const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
      const win = ms.winner, done = ms.done;
      const cls = k => k === win ? `win ${k}` : (win ? "lose" : k);
      let status, thru, midCls = "";
      if (!ms.started){ status = `<span class="st h">&ndash;</span>`; thru = esc(m.t); }
      else if (done){
        // finished: the whole box takes the winner's colour, halves stay grey
        midCls = win ? `won ${win}` : "won h";
        status = `<span class="st">${win ? esc(ms.text) : "AS"}</span>`;
        thru = win ? (Store.isSubmitted(m.id) ? "FINAL" : "unconfirmed") : "HALVED";
      } else {
        status = `<span class="st ${ms.up > 0 ? "s" : ms.up < 0 ? "d" : "h"}">${
          ms.up === 0 ? "AS" : `${Math.abs(ms.up)}&#9650;`}</span>`;
        thru = `THRU ${ms.thru}`;
      }
      rows += `<button class="lbrow" data-nav="match" data-id="${m.id}">
        <span class="lbside ${cls("s")}">${esc(nm("s"))}</span>
        <span class="lbmid ${midCls}">${status}<span class="thru">${thru}</span></span>
        <span class="lbside right ${cls("d")}">${esc(nm("d"))}</span></button>`;
    });
    const tally = sum.live
      ? `<span class="s">Snots lead ${sum.sLead}</span><span class="sep">&middot;</span>
         <span class="d">Ducks lead ${sum.dLead}</span>${
           sum.allSq ? `<span class="sep">&middot;</span><span style="color:var(--muted)">${sum.allSq} AS</span>` : ""}${
           sum.done ? `<span class="sep">&middot;</span><span style="color:var(--dim)">${sum.done} final</span>` : ""}`
      : sum.started
        ? `<span class="s">Snots ${fmtPt(sum.s)}</span><span class="sep">&middot;</span>
           <span class="d">Ducks ${fmtPt(sum.d)}</span>`
        : `<span style="color:var(--dim);font-weight:650">${r.matches.length} matches &middot; ${esc(r.matches[0].t)}</span>`;
    out += `<div class="lbround">
      <div class="lbhead"><div class="rd">
        <div class="r1">ROUND ${r.n} &middot; ${esc(COURSES[r.course].n.toUpperCase())}</div>
        <div class="r2">${esc(r.fmt)} &middot; ${esc(r.day)}</div></div>
        ${roundBadge(sum)}</div>
      <div class="lbtally">${tally}</div>${rows}</div>`;
  });
  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Leaderboard<div class="sub">Snots vs Ducks &middot; ${fmtPt(CLINCH)} to clinch</div></h1>
      <button class="iconbtn" data-nav="home" title="Home">&#8962;</button></div>
    <div class="wrap">${boardHTML(st)}${out}${syncHTML()}</div>`;
}

/* ---------- statistics ---------- */
const toPar = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
const trophySVG = () => `<svg class="trophy" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M7 3h10v5a5 5 0 0 1-10 0z" fill="currentColor"/>
  <path d="M7 4H4.5a3.5 3.5 0 0 0 3.5 3.5M17 4h2.5A3.5 3.5 0 0 1 16 7.5"
    stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <rect x="10.6" y="12.4" width="2.8" height="4" fill="currentColor"/>
  <rect x="7.5" y="16" width="9" height="2.6" rx="1" fill="currentColor"/>
  <rect x="6" y="19" width="12" height="2.4" rx="1.2" fill="currentColor"/></svg>`;
function viewStats(){
  const rows = playerStats();
  if (!rows.length) return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">Nothing scored yet</div></h1>
      <button class="iconbtn" data-nav="home" title="Home">&#8962;</button></div>
    <div class="wrap"><div class="empty">Statistics appear here once scores start going in.<br>
      Every man's gross and net contribution to par, birdies, eagles and bogeys &mdash;
      across all five rounds.</div></div>`;

  // every statistic the filter can show: label, how to read it, sort direction
  const STATS = {
    mvp:     {lbl:"MVP ranking",          get:p=>p.points, fmt:fmtPt, tie:(a,b)=>b.underN - a.underN},
    net:     {lbl:"Net score to par",     get:p=>p.netToPar,   fmt:toPar, low:true},
    gross:   {lbl:"Gross score to par",   get:p=>p.grossToPar, fmt:toPar, low:true},
    worst:   {lbl:"Most over par (Gross)",get:p=>p.grossToPar, fmt:toPar},
    eagle:   {lbl:"Eagles (Gross)",       get:p=>p.eagle},
    eagleN:  {lbl:"Eagles (Net)",         get:p=>p.eagleN},
    birdie:  {lbl:"Birdies (Gross)",      get:p=>p.birdie},
    birdieN: {lbl:"Birdies (Net)",        get:p=>p.birdieN},
    par:     {lbl:"Pars (Gross)",         get:p=>p.parCt},
    parN:    {lbl:"Pars (Net)",           get:p=>p.parCtN},
    over:    {lbl:"Holes over par (Gross)", get:p=>p.over},
    overN:   {lbl:"Holes over par (Net)",   get:p=>p.overN},
    points:  {lbl:"Team points won",      get:p=>p.points, fmt:fmtPt}
  };
  const key = STATS[V.statSort] ? V.statSort : "net";
  const S = STATS[key];
  const val = p => S.get(p);
  const shown = p => (S.fmt ? S.fmt(val(p)) : String(val(p)));
  const sorted = [...rows].sort((a, b) =>
    (S.low ? val(a) - val(b) : val(b) - val(a)) ||
    (S.tie ? S.tie(a, b) : 0) || a.netToPar - b.netToPar);

  const bestBy = (fn, hi) => rows.reduce((x, y) => (hi ? fn(y) > fn(x) : fn(y) < fn(x)) ? y : x);
  const bNet = bestBy(p => p.netToPar, false), bGross = bestBy(p => p.grossToPar, false);
  const bBird = bestBy(p => p.birdie, true), bWorst = bestBy(p => p.grossToPar, true);
  const best = mvp();

  // every badge is a shortcut into the leaderboard below it
  const card = (k, p, v, sub, jump, icon) => `<button class="statcard ${p ? p.team : ""}"
    data-sort="${jump}"><div class="k">${k}</div>
    <div class="v">${v}${icon || ""}<small>${sub}</small></div></button>`;

  const body = sorted.map((p, i) => `<tr class="${p.team}">
    <td class="rk">${i + 1}</td>
    <td class="nm">${esc(p.last)}</td>
    <td class="tm">${p.team === "s" ? "Snots" : "Ducks"}</td>
    <td class="vl">${shown(p)}</td></tr>`).join("");

  const options = Object.keys(STATS).map(k =>
    `<option value="${k}"${k === key ? " selected" : ""}>${STATS[k].lbl}</option>`).join("");

  const mvpNote = (key === "mvp" || key === "points") ? `<div class="legend"><b>How MVP is decided.</b>
    Every match win is worth 1 point and a halved match &frac12;. In the four 2v2 rounds
    both partners are credited the side's full point &mdash; they won it together.
    The MVP is the man with the most points <b>on the winning team</b>.
    <br><b>Tie-break:</b> most holes played under net par.</div>` : "";

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">${rows.length} players scored so far</div></h1>
      <button class="iconbtn" data-nav="home" title="Home">&#8962;</button></div>
    <div class="wrap">
      <div class="statcards">
        <button class="statcard ${best ? best.team : ""} mvpcard" data-sort="mvp">
          <div class="k">${best && best.decided ? "MVP" : "MVP so far"}${trophySVG()}</div>
          <div class="v">${best ? esc(best.name) : "&mdash;"}
          <small>${best
            ? `${fmtPt(best.points)} point${best.points === 1 ? "" : "s"} for the
               ${best.team === "s" ? "Snots" : "Ducks"} &middot; tie-break: ${best.underN} hole${
               best.underN === 1 ? "" : "s"} under net par`
            : "Decided once one team is ahead"}</small></div></button>
        ${card("Best net", bNet, esc(bNet.last), `${toPar(bNet.netToPar)} to par`, "net")}
        ${card("Best gross", bGross, esc(bGross.last), `${toPar(bGross.grossToPar)} to par`, "gross")}
        ${card("Most birdies (Gross)", bBird.birdie > 0 ? bBird : null,
          bBird.birdie > 0 ? esc(bBird.last) : "&mdash;",
          `${bBird.birdie} birdie${bBird.birdie === 1 ? "" : "s"}`, "birdie")}
        ${card("Most over par (Gross)", bWorst.grossToPar > 0 ? bWorst : null,
          bWorst.grossToPar > 0 ? esc(bWorst.last) : "&mdash;",
          `${toPar(bWorst.grossToPar)} to par`, "worst")}
      </div>
      <div class="sect">Leaderboard</div>
      <div class="filterbar">
        <label for="statsel">Show</label>
        <select id="statsel" class="statsel">${options}</select>
      </div>
      <div class="gridwrap"><table class="sl"><tbody>${body}</tbody></table>
        <div class="legend">Each man's own scores from best ball, shamble and singles.
          On scramble and alternate shot the team's score counts for both partners, and a
          picked-up ball (X) counts as double par. <b>Gross</b> is what he actually made;
          <b>Net</b> applies his strokes.</div>
        ${mvpNote}
      </div>
      <button class="btn ghost" data-nav="home">Back to home</button>
    </div>`;
}

  const hs = holeScores(r, m, h, scores), row = scores[h] || {};

    const side = m[key], bh = sideHole(r, m, key, h, scores), rows = [];

      rows.push(entryRow({

      rows.push(entryRow({

      ${!st.started ? briefHTML(r, m) : ""}
      ${Store.isSubmitted(m.id) ? `<div class="lockbar"><b>Round submitted.</b>

        : scorerBar(m, sc)}
      <div class="holehead">
        <div class="holenav">

          <div class="holeinfo"><div class="hn">Hole ${h + 1}</div>
            <div class="hd">Par ${par}${yd ? " &middot; " + yd : ""} &middot; S.I. ${c.hcp[h]}</div></div>
          <button class="navbtn" data-step="1" ${h === 17 ? "disabled" : ""}>&rsaquo;</button>

      </div>
      <div class="savedtag">Every score saves the moment you type it${
        Store.online ? " and syncs to everyone" : " &mdash; will sync when you get service"}.${
        st.done ? " Keep going &mdash; the remaining holes still count for statistics." : ""}</div>
      <div class="actions">
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
        <button class="btn big ghost" data-nav="card" data-id="${m.id}">Full Scorecard</button>
      </div>
      ${Session.admin ? `<button class="btn ghost" data-reset="${m.id}"
        style="color:var(--red);margin-top:9px">Reset this match</button>` : ""}

/** Opening briefing: what this round is, and exactly who gets shots where. */
function briefHTML(r, m){
  const c = COURSES[r.course];
  const rows = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => {
      const side = m[k], holes = [];
      for (let h = 0; h < 18; h++) if (teamStrokes(r, side, h)) holes.push(h + 1);
      rows.push({k, name: side.p.map(p => last(p[0])).join(" / "), n: side.net, holes});
    });
  } else ["s","d"].forEach(k => m[k].p.forEach(pl => {
    const holes = [];
    for (let h = 0; h < 18; h++){ const n = playerStrokes(r, m[k], pl, h);
      for (let i = 0; i < n; i++) holes.push(h + 1); }
    rows.push({k, name: PLAYERS[pl[0]].n, n: pl[2], holes});
  }));
  return `<div class="brief">
    <div class="bt">Round ${r.n} &middot; ${esc(r.fmt)}</div>
    <div class="bd">${fmtBlurb(r)}<br><b>Strokes:</b> ${esc(r.rule)}</div>
    <ul>${rows.map(x => `<li><span class="who ${x.k}">${esc(x.name)}</span>
      <span class="hl">&mdash; ${x.holes.length ? `${x.holes.length} shot${x.holes.length===1?"":"s"}
      on hole${x.holes.length===1?"":"s"} ${x.holes.join(", ")}` : "no shots"}</span></li>`).join("")}</ul>
    ${r.par3Low ? `<div class="bd" style="margin-top:8px">On par 3s the pair plays off the
      lower partner's strokes.</div>` : ""}
  </div>`;
}

/** "Hodgman / Bertolini beat Mosele / MacDonald on Hole 1 with a Birdie" */
function holeVerdict(r, m, h, scores){
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return null;
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const term = (gross, par) => {
    const x = gross - par;
    return x <= -3 ? "an Albatross" : x === -2 ? "an Eagle" : x === -1 ? "a Birdie"
         : x === 0 ? "a Par" : x === 1 ? "a Bogey" : x === 2 ? "a Double Bogey"
         : x === 3 ? "a Triple Bogey" : `a ${x} over par`;
  };
  const par = COURSES[r.course].par[h];
  if (s.net === d.net)
    return {w:null, html:`<b>${esc(nm("s"))}</b> and <b>${esc(nm("d"))}</b> halved
      Hole ${h + 1} with ${term(s.gross, par)}`};
  const w = s.net < d.net ? "s" : "d", l = w === "s" ? "d" : "s";
  const win = w === "s" ? s : d;
  return {w, html:`<b class="win ${w}">${esc(nm(w))}</b> beat ${esc(nm(l))} on Hole ${h + 1}
    with ${term(win.gross, par)}${win.picked ? " (picked up)" : ""}`};
}
/* The taunt. Shown once per match, on the way in, always at the duck's expense. */
const TAUNT_KEY = `${EVENT_KEY}_taunted`;
function taunted(){ try { return JSON.parse(localStorage.getItem(TAUNT_KEY) || "{}"); } catch(e){ return {}; } }
function markTaunted(id){
  const t = taunted(); t[id] = 1;
  try { localStorage.setItem(TAUNT_KEY, JSON.stringify(t)); } catch(e){}
}

    <path d="M0 0 c9 -5 17 -2 20 6 c-9 5 -17 2 -20 -6 z" fill="${CREAM}"
      transform="translate(196 96) rotate(${i * 47})"/></g>`;

    <path d="M0 -9 L2.6 -2.6 L9 0 L2.6 2.6 L0 9 L-2.6 2.6 L-9 0 L-2.6 -2.6 Z"
      fill="${GOLD}" transform="translate(${x} ${y})"/></g>`;
  return `<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <ellipse cx="215" cy="222" rx="86" ry="9" fill="#000" opacity=".28"/>
    <g class="tduck">
      <path d="M244 214 h-58 a20 20 0 0 1 -20 -20 v-30 h82 z" fill="${CREAM}" stroke="${DEEP}" stroke-width="4"/>

      <path d="M180 84 l14 10 M194 84 l-14 10" stroke="${DEEP}" stroke-width="4" stroke-linecap="round"/>
      <path d="M214 82 l14 10 M228 82 l-14 10" stroke="${DEEP}" stroke-width="4" stroke-linecap="round"/>
      <path d="M232 152 c22 6 30 22 26 40" stroke="${DEEP}" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <g class="timpact"><circle cx="196" cy="96" r="30" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/></g>
    ${star(150,54,0)}${star(238,58,1)}${star(196,38,2)}${star(126,92,3)}
    ${[0,1,2,3,4,5].map((i) => feather(i, (i%2?-1:1)*(60+i*13), -50 - i*11, (i%2?-1:1)*(120+i*40))).join("")}
    <g class="tball"><circle cx="196" cy="96" r="13" fill="#fff" stroke="${DEEP}" stroke-width="3"/>
      <circle cx="192" cy="92" r="1.6" fill="#c9ccd1"/><circle cx="199" cy="93" r="1.6" fill="#c9ccd1"/>
      <circle cx="196" cy="99" r="1.6" fill="#c9ccd1"/><circle cx="201" cy="99" r="1.6" fill="#c9ccd1"/>

}
function playTaunt(r, m){
  const el = document.createElement("div");
  el.className = "taunt";
  el.innerHTML = `${tauntSVG()}
    <div class="tline">Round ${r.n} &middot; ${esc(r.fmt)}</div>
    <div class="tsub">${esc(COURSES[r.course].n)} &middot; Play well</div>
    <div class="tskip">tap to skip</div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 320); };
  el.onclick = close;
  document.body.appendChild(el);
  clearTimeout(playTaunt._t);
  playTaunt._t = setTimeout(close, 3600);
}

   by Andrew's instruction. */

  const CREAM = "#f2e7cd", DEEP = "#0b2a1c", GOLD = "#c9a227", GRASS = "#0e3a26";
  const duck = cls => `<g class="wduck ${cls}">
    <ellipse cx="0" cy="6" rx="26" ry="15" fill="${CREAM}" stroke="${DEEP}" stroke-width="3"/>
    <circle cx="20" cy="-6" r="11" fill="${CREAM}" stroke="${DEEP}" stroke-width="3"/>
    <path d="M30 -6 l14 4 l-14 5 z" fill="#e8820c" stroke="${DEEP}" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="23" cy="-9" r="1.9" fill="${DEEP}"/>
    <path class="wwing" d="M-4 2 c-4 -20 10 -30 24 -22 c-10 4 -14 14 -12 24 z"
      fill="${GOLD}" stroke="${DEEP}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-26 8 l-16 -6 l4 12 z" fill="${CREAM}" stroke="${DEEP}" stroke-width="2.6" stroke-linejoin="round"/></g>`;
  // NOTE: a CSS transform in the animation REPLACES an element's SVG transform
  // attribute, so anything animated must be nested inside a positioning <g>.
  const flash = (x, y, two) => `<g transform="translate(${x} ${y})">
    <g class="wflash${two ? " two" : ""}">
    <path d="M0 -16 L5 -5 L17 0 L5 5 L0 16 L-5 5 L-17 0 L-5 -5 Z" fill="${GOLD}"/></g></g>`;
  const puff = (x, y, two) => `<g transform="translate(${x} ${y})">
    <g class="wpuff${two ? " two" : ""}">
    ${[0,1,2,3,4].map(i => `<circle cx="${(Math.cos(i*1.26)*13).toFixed(1)}"
      cy="${(Math.sin(i*1.26)*13).toFixed(1)}" r="5" fill="${CREAM}" opacity=".85"/>`).join("")}
    </g></g>`;
  return `<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g class="wsky">
      <circle cx="326" cy="52" r="26" fill="${GOLD}" opacity=".28"/>
      <g transform="translate(150 96)">${duck("a")}</g>
      <g transform="translate(268 124)">${duck("b")}</g>
      ${flash(196, 84)} ${flash(266, 66, true)}
      ${puff(196, 84)} ${puff(266, 66, true)}
    </g>
    <g class="wgrass">
      <path d="M0 232 q46 -22 92 0 t92 0 t92 0 t92 0 v70 H0 z" fill="${GRASS}"/>
      <g class="wastro">
        <rect x="150" y="214" width="46" height="52" rx="15" fill="${CREAM}" stroke="${DEEP}" stroke-width="3.5"/>
        <circle cx="173" cy="200" r="27" fill="${CREAM}" stroke="${DEEP}" stroke-width="3.5"/>
        <path d="M175 180 a20 20 0 0 1 0 40 z" fill="#14472f"/>
        <path d="M183 188 a13 13 0 0 0 -3 22" stroke="${CREAM}" stroke-width="3"
          fill="none" stroke-linecap="round" opacity=".65"/>
        <path d="M188 224 L246 176" stroke="${GOLD}" stroke-width="9"
          stroke-linecap="round"/>
        <path d="M244 172 l16 -6 l4 10 l-16 6 z" fill="${GOLD}" stroke="${DEEP}" stroke-width="2.6"/>
      </g>
      <path d="M0 244 q46 -20 92 0 t92 0 t92 0 t92 0 v58 H0 z" fill="#0b2f1e"/>

}
function playWin(r, m, st){
  const nm = m.s.p.map(p => last(p[0])).join(" / ");
  const el = document.createElement("div");
  el.className = "taunt";
  el.innerHTML = `${duckHuntSVG()}
    <div class="tline">Snots win ${esc(st.text)}</div>
    <div class="tsub">${esc(nm)}</div>
    <div class="tskip">tap to skip</div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 320); };
  el.onclick = close;
  document.body.appendChild(el);
  clearTimeout(playWin._t);
  playWin._t = setTimeout(close, 4200);
}

function showToast(html){
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t);
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { if (t.parentNode) t.remove(); }, 4200);
}

function holeLine(r, m, h, scores){
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return "Enter both sides to score the hole";
  return s.net < d.net ? "Snots win the hole" : d.net < s.net ? "Ducks win the hole" : "Hole halved";
}
function matchLine(st){
  if (st.done) return st.winner
    ? `${st.winner === "s" ? "SNOTS" : "DUCKS"} win ${esc(st.text)}` : "Match halved";
  if (st.up === 0) return `All square thru ${st.thru}`;
  return `${st.up > 0 ? "SNOTS" : "DUCKS"} ${Math.abs(st.up)} UP thru ${st.thru}`;
}
/* Always rendered at the same height — if this bar appears or disappears as
   scores go in, every button below it jumps under the scorer's thumb. */
function scorerBar(m, sc){
  const mine = sc && sc.id === Session.id;
  let body;
  if (mine) body = `<b>You're keeping score.</b> Everyone else sees this live.
    <button data-release="${m.id}">Hand off &rsaquo;</button>`;
  else if (sc && sc.id) body = `<b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.` +
    (canClaim(m) ? ` <button data-claim="${m.id}">Take over &rsaquo;</button>` : ` View only.`);
  else if (canClaim(m)) body = `<b>Nobody is keeping score yet.</b> Scores are locked until
    someone takes it on. <button data-claim="${m.id}">I'll keep score &rsaquo;</button>`;
  else body = `<b>View only.</b> You're not in this match.`;
  return `<div class="lockbar">${body}</div>`;
}
function entryRow(o){
  const picked = o.raw === PICKED;
  const cls = picked ? "picked" : markCls(o.gross, o.par);
  const val = picked ? "X" : (o.raw == null ? "" : o.raw);
  return `<div class="prow ${o.best ? "best" : ""}">
    <div class="pname">${esc(o.name)}<span class="hc">${esc(o.sub)}</span>${
      o.best ? `<span class="ball">counts</span>` : ""}</div>
    <div class="entry">
      <span class="lab">Gross Score:</span>
      <span class="gswrap">
        <input class="gsin ${val === "" ? "blank" : cls}" id="gs-${o.entrant}"
          data-entrant="${o.entrant}" type="${picked ? "text" : "number"}"
          inputmode="numeric" pattern="[0-9]*" min="1" max="15" value="${val}"
          ${o.editable && !picked ? "" : "readonly"}>
        ${dotsHTML(o.strokes)}
      </span>
      <span class="out" id="net-${o.entrant}">${
        o.gross == null ? "" : `${picked ? "plays" : "net"}<b>${o.gross - o.strokes}</b>`}</span>
      ${o.editable ? `<button class="clr ${picked ? "on" : ""}" data-pick="${o.entrant}"
        title="Picked up">X</button>
        <button class="clr" data-clear="${o.entrant}">&#8630;</button>` : ""}
    </div></div>`;
}

/* ---------- full scorecard ---------- */
function viewCard(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);

  // running "up" after each decided hole (+ve = Snots), null where not played
  const run = []; let u = 0;
  for (let h = 0; h < 18; h++){
    const w = st.holes[h];
    if (w === null){ run.push(null); continue; }
    if (w === "s") u++; else if (w === "d") u--;
    run.push(u);
  }
  const shortSide = key => m[key].p.length > 1
    ? m[key].p.map(p => last(p[0])[0]).join("/") : last(m[key].p[0][0]);

  const rowPair = (name, colour, entrantId, from, to) => {
    let g = `<tr class="gr"><td class="lbl" style="color:${colour}">${esc(name)}</td>`;
    let n = `<tr class="netrow"><td class="lbl">net</td>`;
    let gt = 0, nt = 0, any = false;
    for (let h = from; h <= to; h++){
      const hs = holeScores(r, m, h, scores);
      const v = hs[entrantId], raw = (scores[h] || {})[entrantId];
      const s = v ? v.strokes : 0;
      const cell = !v ? ""
        : raw === PICKED ? `<span class="mk picked">X</span>`
        : `<span class="mk ${markCls(v.gross, c.par[h])}">${v.gross}</span>`;
      g += `<td class="tap" data-gohole="${h}">${
        s > 0 ? `<span class="gdot${s > 1 ? " two" : ""}"></span>` : ""}${cell}</td>`;
      n += `<td>${v ? `<b>${v.net}</b>` : ""}</td>`;
      if (v){ gt += v.gross; nt += v.net; any = true; }
    }
    g += `<td class="tot">${any ? gt : ""}</td></tr>`;
    n += `<td class="tot">${any ? `<b>${nt}</b>` : ""}</td></tr>`;
    return g + n;
  };

  const nine = (from, to, label) => {
    let head = `<tr><th class="lbl">${label}</th>`;
    for (let h = from; h <= to; h++) head += `<th>${h + 1}</th>`;
    head += `<th class="tot">${label}</th></tr>`;
    let par = `<tr class="meta"><td class="lbl">Par</td>`, si = `<tr class="meta"><td class="lbl">Stroke index</td>`;
    let pT = 0;
    for (let h = from; h <= to; h++){ par += `<td>${c.par[h]}</td>`; si += `<td>${c.hcp[h]}</td>`; pT += c.par[h]; }
    par += `<td class="tot">${pT}</td></tr>`; si += `<td class="tot"></td></tr>`;

    let body = "";
    ["s","d"].forEach(key => {
      const side = m[key], colour = key === "s" ? "var(--snots)" : "var(--ducks)";
      if (r.mode === "team"){
        body += rowPair(side.p.map(p => last(p[0])).join(" / "), colour, key, from, to);
      } else {
        side.p.forEach(pl => body += rowPair(PLAYERS[pl[0]].n, colour, pl[0], from, to));
        if (side.p.length > 1){
          let g = `<tr class="bestrow"><td class="lbl" style="color:${colour}">${
            key === "s" ? "SNOTS" : "DUCKS"} net</td>`;
          let t = 0, any = false;
          for (let h = from; h <= to; h++){
            const v = sideHole(r, m, key, h, scores);
            g += `<td>${v ? v.net : ""}</td>`;
            if (v){ t += v.net; any = true; }
          }
          body += g + `<td class="tot">${any ? t : ""}</td></tr>`;
        }
      }
      body += `<tr class="sep"><td class="lbl"></td>${"<td></td>".repeat(to - from + 2)}</tr>`;
    });

    /* Running match status, not per-hole winners. A golfer looking at this
       wants "who's up and by how much", not to add up S's and D's. */
    let res = `<tr class="rowres"><td class="lbl">Match</td>`;
    let lastU = null;
    for (let h = from; h <= to; h++){
      const u = run[h];
      if (u === null){ res += `<td></td>`; continue; }
      lastU = u;
      res += `<td class="${u > 0 ? "w" : u < 0 ? "l" : "hh"}">${
        u === 0 ? "AS" : `${Math.abs(u)} UP`}</td>`;
    }
    let totTxt = "", totCls = "";
    if (to === 17 && st.done){
      totTxt = st.winner ? `${shortSide(st.winner)} ${st.text}` : "AS &frac12;&ndash;&frac12;";
      totCls = st.winner || "h";                       // final result carries the winner's colour
    } else if (lastU !== null){
      totTxt = lastU === 0 ? "AS" : `${shortSide(lastU > 0 ? "s" : "d")} ${Math.abs(lastU)} UP`;
      totCls = lastU > 0 ? "s" : lastU < 0 ? "d" : "h";
    }
    res += `<td class="tot ${totCls}">${totTxt}</td></tr>`;
    return `<div class="gridwrap"><div class="gscroll"><table class="gc">
      <thead>${head}</thead><tbody>${par}${si}${body}${res}</tbody></table></div></div>`;
  };

  const holesFilled = st.holes.filter(Boolean).length;
  const submitted = Store.isSubmitted(m.id);
  const canSubmit = st.done && !submitted && (canScore(m) || Session.admin);

  return `<div class="topbar">
      <button class="iconbtn" data-nav="match" data-id="${m.id}">&#8592;</button>
      <h1>Review Round<div class="sub">${esc(c.n)} &middot; ${esc(r.fmt)} &middot; ${esc(m.tee || r.tee)}</div></h1>
      <button class="iconbtn" data-nav="home" title="Home">&#8962;</button>
    </div><div class="wrap">
      <div class="resbar ${st.done && !st.winner ? "halved" : (st.winner || "")}">
        <div class="r1">${submitted ? "Submitted &middot; official" : "Match result"}</div>
        <div class="r2">${st.started ? matchLine(st) : "Not started"}</div></div>
      ${canSubmit ? `<div class="lockbar">Check the card against the paper copy, then submit.
        ${holesFilled < 18 ? `<b>${18 - holesFilled} hole${18 - holesFilled === 1 ? "" : "s"}
        still blank</b> &mdash; you can submit anyway, but those holes won't count toward statistics.`
        : "All 18 holes are in."}</div>
        <button class="btn" style="margin:0 0 11px" data-submit="${m.id}">Attest &amp; Submit Round</button>` : ""}
      ${submitted ? `<div class="lockbar"><b>This round is submitted and locked.</b>
        ${Session.admin ? `<button data-unsubmit="${m.id}">Reopen &rsaquo;</button>`
          : "Ask Andrew or Pat if it needs reopening."}</div>` : ""}
      ${!st.done && st.started ? `<div class="lockbar">Match still in progress &mdash;
        thru ${st.thru}. You can submit once it's decided.</div>` : ""}
      ${nine(0, 8, "OUT")}${nine(9, 17, "IN")}
      <div class="gridwrap"><div class="legend">
        <span class="sw u c1">3</span> birdie &middot; <span class="sw u c2">2</span> eagle &middot;
        <span class="sw b1">5</span> bogey &middot; <span class="sw b2">6</span> double<br>
        <span class="rd"></span> a stroke is given on that hole
        ${r.par3Low ? "<br>Par 3s: the pair plays off the lower partner's strokes." : ""}
      </div></div>
      <div class="actions">
        <button class="btn big ghost" data-nav="match" data-id="${m.id}">Return to Your Match</button>
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
      </div>
    </div>`;
}

    <button class="btn ghost" data-closebtn="1">Close</button>
    <button class="btn ghost" data-signout="1">Return to lock screen</button>
