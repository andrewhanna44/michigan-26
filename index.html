  const badge = n => n > 0 ? `<span class="dotbadge">${n > 99 ? "99+" : n}</span>` : "";

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Chat<div class="sub">${ch === "all" ? "Everyone &middot; all 20 players"
        : `${mine === "s" ? "Snots" : "Ducks"} only &middot; your 10`}</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div class="chanbar">
        <button class="${V.chan !== "team" ? "on" : ""}" data-chan="all">Everyone${
          V.chan === "team" ? badge(otherUnread) : ""}</button>
        <button class="${V.chan === "team" ? "on " + mine : ""}" data-chan="team">${
          mine === "s" ? "Snots" : "Ducks"} only${V.chan !== "team" ? badge(otherUnread) : ""}</button>
      </div>
      ${Store.chatBlocked ? `<div class="warnbar"><b>Chat isn't switched on yet.</b>
        The database is still refusing chat messages &mdash; Andrew needs to publish the
        updated rules in the Firebase console. Scoring is unaffected.</div>` : ""}
      ${failed ? `<div class="warnbar"><b>Some messages didn't send.</b>
        <button data-retry="1" style="color:var(--red);font-weight:750;text-decoration:underline">
        Try again &rsaquo;</button></div>` : ""}
      <div class="chatwrap">
        <div class="chatlist" id="chatlist">${list}</div>
        <div class="composer">
          <button class="tagbtn" id="tagbtn" title="Tag someone">@</button>
          <textarea class="chatin" id="chatin" rows="1" maxlength="500"
            placeholder="${ch === "all" ? "Message everyone…" : `Message the ${mine === "s" ? "Snots" : "Ducks"}…`}"></textarea>
          <button class="sendbtn" id="chatsend">Send</button>
        </div>
        ${V.tagOpen ? `<div class="tagpick">
          <div class="tagpickhd">Tag someone &mdash; they'll see it next time they open the app</div>
          ${(ch === "all" ? Object.keys(PLAYERS)
              : Object.keys(PLAYERS).filter(id => PLAYERS[id].t === Session.me.t))
            .filter(id => id !== Session.id)
            .map(id => `<button class="tagname ${PLAYERS[id].t}" data-tag="${id}">
              ${avatarSVG(id, "sm")}<span>${esc(PLAYERS[id].n)}</span></button>`).join("")}
        </div>` : ""}
      </div>
      <div class="savedtag">${ch === "all"
        ? "Everyone on the trip sees this."
        : "Only your team sees this in the app &mdash; but it isn't encrypted. Don't put anything in here you'd mind the other side reading."}</div>
    </div>`;
}

/* ---------- player profile ---------- */
function viewProfile(){
  const meId = V.profileId && PLAYERS[V.profileId] ? V.profileId : Session.id;
  const p = PLAYERS[meId], own = meId === Session.id;
  const stats = playerStats().find(x => x.id === meId);
  const pts = playerPoints()[meId] || 0;

  let mine = "";
  ROUNDS.forEach(r => r.matches.forEach(m => {
    if (!inMatch(m, meId)) return;
    const ms = matchState(r, m, Store.scores(m.id));
    const side = m.s.p.some(x => x[0] === meId) ? "s" : "d";
    const opp = m[side === "s" ? "d" : "s"].p.map(x => last(x[0])).join(" / ");
    const partner = m[side].p.filter(x => x[0] !== meId).map(x => last(x[0])).join(" / ");
    const up = side === "s" ? ms.up : -ms.up;      // from this man's point of view
    const badge = !ms.started ? `<span class="badge soon">${esc(m.t)}</span>`
      : ms.done ? `<span class="badge ${ms.winner === side ? side : "h"}">${
          ms.winner === side ? "WON " + esc(ms.text) : ms.winner ? "LOST" : "HALVED"}</span>`
      : `<span class="badge ${up === 0 ? "h" : side}">${
          up === 0 ? "AS" : `${Math.abs(up)} ${up > 0 ? "UP" : "DN"}`}</span>`;
    mine += `<button class="card" data-nav="match" data-id="${m.id}"><div class="rowline">
      <div class="rnum" style="color:${rColour(r.n)};border-color:${rColour(r.n)};background:${rColour(r.n)}14">${r.n}</div>
      <div class="rmeta"><div class="t1">${partner ? `with ${esc(partner)}` : "Singles"}</div>
        <div class="t2">v ${esc(opp)} &middot; ${esc(r.fmt)}</div></div>
      <div class="rright"><div class="small">${badge}</div></div>
      <div class="chev">&rsaquo;</div></div></button>`;
  }));

  const fact = (k, v) => `<div class="pfact"><div class="k">${k}</div><div class="v">${v}</div></div>`;

  let roster = "";
  ["s","d"].forEach(t => {
    roster += `<div class="sect">${t === "s" ? "Snots" : "Ducks"}</div>`;
    Object.keys(PLAYERS).filter(id => PLAYERS[id].t === t)
      .sort((a,b) => PLAYERS[a].idx - PLAYERS[b].idx)
      .forEach(id => {
        const q = PLAYERS[id];
        roster += `<button class="card ${id === Session.id ? "me" : ""}" data-profile="${id}">
          <div class="rowline">${avatarSVG(id, "sm")}
          <div class="rmeta"><div class="t1">${esc(q.n)}${q.admin ? ` <span class="cmsh">ADMIN</span>` : ""}</div>
            <div class="t2">Index ${fmtIdx(q.idx)} &middot; Room ${q.room} &middot; ${q.yrs} year${q.yrs === 1 ? "" : "s"}</div></div>
          <div class="chev">&rsaquo;</div></div></button>`;
      });
  });

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>${own ? "Your profile" : esc(p.n)}<div class="sub">${
        p.t === "s" ? "Snots" : "Ducks"}${p.title ? " &middot; " + esc(p.title) : ""}</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div class="pcard ${p.t}">
        ${avatarSVG(meId, "big")}
        <div class="pname">${esc(p.n)}</div>
        <div class="pteam">${p.t === "s" ? "SNOTS" : "DUCKS"}${
          p.title ? ` &middot; ${esc(p.title.toUpperCase())}` : ""}</div>
        ${p.admin ? `<div class="padmin">ADMIN ACCESS</div>` : ""}
        <div class="pfacts">
          ${fact("Handicap", fmtIdx(p.idx))}
          ${fact("Room", p.room)}
          ${fact("Years", p.yrs)}
          ${fact("Points", fmtPt(pts))}
        </div>
      </div>
      ${own ? `<div class="mycode"><div class="mck">Your login code</div>
        <div class="mcv mono">${p.code}</div>
        <div class="mch">This is your key to the app. Write it down.</div></div>` : ""}
      <div class="card flat"><div style="font-size:12.5px;color:var(--muted);line-height:1.7">
        ${stats ? `<b style="color:var(--text)">So far:</b> ${stats.holes} holes &middot;
          ${toPar(stats.grossToPar)} gross &middot; ${toPar(stats.netToPar)} net &middot;
          ${stats.birdie} birdie${stats.birdie === 1 ? "" : "s"}${
          stats.eagle ? ` &middot; ${stats.eagle} eagle${stats.eagle === 1 ? "" : "s"}` : ""}`
        : "No holes played yet."}</div></div>
      <div class="sect">${own ? "Your matches" : "Matches"}</div>${mine}
      <div class="sect" style="margin-top:24px">The field</div>${roster}
    </div>`;
}

const toPar = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
const trophySVG = () => `<svg class="trophy" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M7 3h10v5a5 5 0 0 1-10 0z" fill="currentColor"/>
  <path d="M7 4H4.5a3.5 3.5 0 0 0 3.5 3.5M17 4h2.5A3.5 3.5 0 0 1 16 7.5"
    stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <rect x="10.6" y="12.4" width="2.8" height="4" fill="currentColor"/>
  <rect x="7.5" y="16" width="9" height="2.6" rx="1" fill="currentColor"/>
  <rect x="6" y="19" width="12" height="2.4" rx="1.2" fill="currentColor"/></svg>`;
function viewStats(){
  const rows = playerStats();
  if (!rows.length) return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">Nothing scored yet</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap"><div class="empty">Statistics appear here once scores start going in.<br>
      Every man's gross and net contribution to par, birdies, eagles and bogeys &mdash;
      across all five rounds.</div></div>`;

  // every statistic the filter can show: label, how to read it, sort direction
  const STATS = {
    mvp:     {lbl:"MVP ranking",          get:p=>p.points, fmt:fmtPt, tie:(a,b)=>b.underN - a.underN},
    net:     {lbl:"Net score to par",     get:p=>p.netToPar,   fmt:toPar, low:true},
    gross:   {lbl:"Gross score to par",   get:p=>p.grossToPar, fmt:toPar, low:true},
    worst:   {lbl:"Most over par (Gross)",get:p=>p.grossToPar, fmt:toPar},
    eagle:   {lbl:"Eagles (Gross)",       get:p=>p.eagle},
    eagleN:  {lbl:"Eagles (Net)",         get:p=>p.eagleN},
    birdie:  {lbl:"Birdies (Gross)",      get:p=>p.birdie},
    birdieN: {lbl:"Birdies (Net)",        get:p=>p.birdieN},
    par:     {lbl:"Pars (Gross)",         get:p=>p.parCt},
    parN:    {lbl:"Pars (Net)",           get:p=>p.parCtN},
    over:    {lbl:"Holes over par (Gross)", get:p=>p.over},
    overN:   {lbl:"Holes over par (Net)",   get:p=>p.overN},
    points:  {lbl:"Team points won",      get:p=>p.points, fmt:fmtPt}
  };
  const key = STATS[V.statSort] ? V.statSort : "net";
  const S = STATS[key];
  const val = p => S.get(p);
  const shown = p => (S.fmt ? S.fmt(val(p)) : String(val(p)));
  const sorted = [...rows].sort((a, b) =>
    (S.low ? val(a) - val(b) : val(b) - val(a)) ||
    (S.tie ? S.tie(a, b) : 0) || a.netToPar - b.netToPar);

  const bestBy = (fn, hi) => rows.reduce((x, y) => (hi ? fn(y) > fn(x) : fn(y) < fn(x)) ? y : x);
  const bNet = bestBy(p => p.netToPar, false), bGross = bestBy(p => p.grossToPar, false);
  const bBird = bestBy(p => p.birdie, true), bWorst = bestBy(p => p.grossToPar, true);
  const best = mvp();

  // every badge is a shortcut into the leaderboard below it
  const card = (k, p, v, sub, jump, icon) => `<button class="statcard ${p ? p.team : ""}"
    data-sort="${jump}"><div class="k">${k}</div>
    <div class="v">${v}${icon || ""}<small>${sub}</small></div></button>`;

  const body = sorted.map((p, i) => `<tr class="${p.team}">
    <td class="rk">${i + 1}</td>
    <td class="nm">${esc(p.last)}</td>
    <td class="tm">${p.team === "s" ? "Snots" : "Ducks"}</td>
    <td class="vl">${shown(p)}</td></tr>`).join("");

  const options = Object.keys(STATS).map(k =>
    `<option value="${k}"${k === key ? " selected" : ""}>${STATS[k].lbl}</option>`).join("");

  const mvpNote = (key === "mvp" || key === "points") ? `<div class="legend"><b>How MVP is decided.</b>
    Every match win is worth 1 point and a halved match &frac12;. In the four 2v2 rounds
    both partners are credited the side's full point &mdash; they won it together.
    The MVP is the man with the most points <b>on the winning team</b>.
    <br><b>Tie-break:</b> most holes played under net par.</div>` : "";

  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&#8592;</button>
      <h1>Statistics<div class="sub">${rows.length} players scored so far</div></h1>
      ${navBtnsHTML()}</div>
    <div class="wrap">
      <div class="statcards">
        <button class="statcard ${best ? best.team : ""} mvpcard" data-sort="mvp">
          <div class="k">${best && best.decided ? "MVP" : "MVP so far"}${trophySVG()}</div>
          <div class="v">${best ? esc(best.name) : "&mdash;"}
          <small>${best
            ? `${fmtPt(best.points)} point${best.points === 1 ? "" : "s"} for the
               ${best.team === "s" ? "Snots" : "Ducks"} &middot; tie-break: ${best.underN} hole${
               best.underN === 1 ? "" : "s"} under net par`
            : "Decided once one team is ahead"}</small></div></button>
        ${card("Best net", bNet, esc(bNet.last), `${toPar(bNet.netToPar)} to par`, "net")}
        ${card("Best gross", bGross, esc(bGross.last), `${toPar(bGross.grossToPar)} to par`, "gross")}
        ${card("Most birdies (Gross)", bBird.birdie > 0 ? bBird : null,
          bBird.birdie > 0 ? esc(bBird.last) : "&mdash;",
          `${bBird.birdie} birdie${bBird.birdie === 1 ? "" : "s"}`, "birdie")}
        ${card("Most over par (Gross)", bWorst.grossToPar > 0 ? bWorst : null,
          bWorst.grossToPar > 0 ? esc(bWorst.last) : "&mdash;",
          `${toPar(bWorst.grossToPar)} to par`, "worst")}
      </div>
      <div class="sect">Leaderboard</div>
      <div class="filterbar">
        <label for="statsel">Show</label>
        <select id="statsel" class="statsel">${options}</select>
      </div>
      <div class="gridwrap"><table class="sl"><tbody>${body}</tbody></table>
        <div class="legend">Each man's own scores from best ball, shamble and singles.
          On scramble and alternate shot the team's score counts for both partners, and a
          picked-up ball (X) counts as double par. <b>Gross</b> is what he actually made;
          <b>Net</b> applies his strokes.</div>
        ${mvpNote}
      </div>
      <button class="btn ghost" data-nav="home">Back to home</button>
    </div>`;
}

/* ---------- round ---------- */
function viewRound(){
  const r = ROUNDS[V.round], c = COURSES[r.course];
  let list = "";
  r.matches.forEach(m => list += matchCard(r, m, matchState(r, m, Store.scores(m.id))));
  return `<div class="topbar">
      <button class="iconbtn" data-nav="matches">&#8592;</button>
      <h1>Round ${r.n} &middot; ${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(r.tee)} tees</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="card flat"><div style="font-size:12.5px;color:var(--muted);line-height:1.65">
        <b style="color:var(--text)">Strokes:</b> ${esc(r.rule)}<br>
        <b style="color:var(--text)">Format:</b> ${fmtBlurb(r)}
        ${c.note ? `<br><b style="color:var(--text)">Note:</b> ${esc(c.note)}` : ""}
      </div></div>
      <div class="sect">Matches</div>${list}</div>`;
}
const fmtBlurb = r => ({
  "Scramble":"Both partners tee off, play the best ball, repeat. One score per team.",
  "Best Ball":"Everyone plays their own ball. The pair's better net score counts.",
  "Shamble":"Play the best drive, then everyone plays their own ball in. Better net counts.",
  "Alternate Shot":"Partners alternate shots on one ball. One score per team.",
  "Singles":"One on one, own ball, net match play."
})[r.fmt] || "";

function matchCard(r, m, st){
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const mine = inMatch(m, Session.id);
  const cls = st.winner ? st.winner : "h";
  const right = st.started ? `<span class="badge ${cls}">${esc(st.text)}</span>`
                           : `<span class="badge soon">${esc(m.t)}</span>`;
  const sub = st.done ? "Final" : st.started ? `thru ${st.thru}` : esc(r.fmt);
  return `<button class="card ${mine ? "me" : ""}" data-nav="match" data-id="${m.id}"><div class="rowline">
    <div class="rmeta">
      <div class="t1" style="color:var(--snots)">${esc(nm("s"))}</div>
      <div class="vs" style="margin:2px 0">VS</div>
      <div class="t1" style="color:var(--ducks)">${esc(nm("d"))}</div>
      <div class="t2" style="margin-top:5px">${sub}${mine ? " &middot; your match" : ""}</div>
    </div>
    <div class="rright"><div class="small" style="margin:0 0 5px">${right}</div></div>
    <div class="chev">&rsaquo;</div></div></button>`;
}

/* ---------- match: hole entry ---------- */
function viewMatch(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);
  const h = V.hole, editable = canScore(m), sc = Store.scorer(m.id), par = c.par[h];

  // You can't run ahead of the card: the first hole without a result is as far
  // as anyone may go. Everything behind it stays open for corrections.
  let firstOpen = 17;
  for (let i = 0; i < 18; i++){ if (st.holes[i] === null){ firstOpen = i; break; } }
  const holeDone = st.holes[h] !== null;

  let strip = "";
  for (let i = 0; i < 18; i++){
    const w = st.holes[i], sp = specialAt(r.n, i);
    const locked = i > firstOpen;
    strip += `<button data-hole="${i}" id="chip-${i}" ${locked ? "disabled" : ""}
      class="${i === h ? "cur " : ""}${locked ? "lock " : ""}${sp ? "sp " : ""}${
      w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : ""}">${i + 1}${
      sp ? `<span class="spdot"></span>` : ""}</button>`;
  }
  const yd = yards(r, m, h);
  const sp = specialAt(r.n, h);

  const hs = holeScores(r, m, h, scores), row = scores[h] || {};
  const sideBox = key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores), rows = [];
    if (r.mode === "team"){
      rows.push(entryRow({
        name: side.p.map(p => last(p[0])).join(" / "), sub: shotLbl(side.net),
        entrant: key, raw: row[key], gross: hs[key] ? hs[key].gross : null,
        strokes: teamStrokes(r, side, h), par, editable}));
    } else side.p.forEach(pl => {
      rows.push(entryRow({
        name: PLAYERS[pl[0]].n, sub: shotLbl(pl[2]),
        entrant: pl[0], raw: row[pl[0]], gross: hs[pl[0]] ? hs[pl[0]].gross : null,
        strokes: playerStrokes(r, side, pl, h), par, editable,
        best: !!(bh && bh.byId === pl[0] && side.p.length > 1)}));
    });
    return `<div class="sidebox ${key}"><div class="sidehdr">
        <span>${key === "s" ? "SNOTS" : "DUCKS"}</span>
        <span class="net" id="sidenet-${key}">${bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;"}</span>
      </div>${rows.join("")}</div>`;
  };

  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&#8592;</button>
      <h1>${esc(c.n)}<div class="sub">${esc(m.tee || r.tee)} &middot; ${esc(m.t)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="resbarwrap" id="resbarwrap">
        <div class="resbar ${st.winner || ""}" id="resbar">
          <div class="r1" id="res1">${holeLine(r, m, h, scores)}</div>
          <div class="r2" id="res2">${matchBegun(m.id) ? matchLine(st) : "Match not started"}</div>
        </div>
        <div class="vflashstack" id="vflashstack"></div>
      </div>
      ${st.done && !Store.isSubmitted(m.id) ? `<button class="btn" style="margin:0 0 10px"
        data-nav="card" data-id="${m.id}">Match decided &mdash; Review &amp; Submit &rsaquo;</button>` : ""}
      <button class="roundbar ${V.briefOpen ? "open" : ""}" data-briefopen="1">
        <span class="rbn" style="background:${rColour(r.n)}">${r.n}</span>
        <span class="rbt">Round ${r.n} &middot; ${esc(r.fmt)}</span>
        <span class="rbc">${V.briefOpen ? "Hide" : "Details"} <i>&#9662;</i></span></button>
      ${V.briefOpen ? `<div class="brief briefdrop">${briefBody(r, m)}${
        Store.isSubmitted(m.id) ? "" : handoffHTML(m)}</div>` : ""}
      ${Store.isSubmitted(m.id) ? `<div class="lockbar"><b>Round submitted.</b>
        Signed off by ${esc(PLAYERS[Store.submittedBy(m.id)] ? PLAYERS[Store.submittedBy(m.id)].n : "a commissioner")}.
        ${Session.admin ? `<button data-unsubmit="${m.id}">Reopen &rsaquo;</button>` : "Scores are locked."}</div>`
        : scorerBar(m, sc)}
      <div class="holehead">
        <div class="holenav">
          <button class="navbtn" data-step="-1" ${h === 0 ? "disabled" : ""}>&#8592;</button>
          <div class="holeinfo"><div class="hn">Hole ${h + 1}</div>
            <div class="hd">Par ${par}${yd ? " &middot; " + yd : ""} &middot; S.I. ${c.hcp[h]}</div>
            ${sp ? `<div class="spbadge ${sp}">${SPECIAL_LABEL[sp]}</div>` : ""}</div>
          <button class="navbtn" data-step="1" ${h === 17 || !holeDone ? "disabled" : ""}>&rsaquo;</button>
        </div>
        <div class="strip">${strip}</div>
      </div>
      ${sideBox("s")}${sideBox("d")}
      <div class="holebar">
        <button class="go ${h === 17 || V.fromCard ? "fin" : ""}" data-proceed="1"
          ${holeDone || V.fromCard ? "" : "disabled"}>${
          V.fromCard ? "Back to Review" : h === 17 ? "Review Round" : "Save Scores &amp; Proceed"}</button>
      </div>
      <div class="gate${holeDone || V.fromCard ? " off" : ""}" id="gatebar">Enter a score for
        <b>every player</b> before moving on.</div>
      <div class="savedtag">Every score saves the moment you type it${
        Store.online ? " and syncs to everyone" : " &mdash; will sync when you get service"}.${
        st.done ? " Keep going &mdash; the remaining holes still count for statistics." : ""}</div>
      <div class="actions">
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
        <button class="btn big ghost" data-nav="card" data-id="${m.id}">Full Scorecard</button>
      </div>
      ${Session.admin ? `<button class="btn ghost" data-reset="${m.id}"
        style="color:var(--red);margin-top:9px">Reset this match</button>` : ""}
    </div>`;
}
/** The briefing detail — used standalone before a match, and collapsed inside it. */
function briefBody(r, m){
  const rows = [];
  if (r.mode === "team"){
    ["s","d"].forEach(k => {
      const side = m[k], holes = [];
      for (let h = 0; h < 18; h++) if (teamStrokes(r, side, h)) holes.push(h + 1);
      rows.push({k, name: side.p.map(p => last(p[0])).join(" / "), n: side.net, holes});
    });
  } else ["s","d"].forEach(k => m[k].p.forEach(pl => {
    const holes = [];
    for (let h = 0; h < 18; h++){ const n = playerStrokes(r, m[k], pl, h);
      for (let i = 0; i < n; i++) holes.push(h + 1); }
    rows.push({k, name: PLAYERS[pl[0]].n, n: pl[2], holes});
  }));
  return `<div class="bd">${fmtBlurb(r)}<br><b>Strokes:</b> ${esc(r.rule)}</div>
    <ul>${rows.map(x => `<li><span class="who ${x.k}">${esc(x.name)}</span>
      <span class="hl">&mdash; ${x.holes.length ? `${x.holes.length} shot${x.holes.length===1?"":"s"}
      on hole${x.holes.length===1?"":"s"} ${x.holes.join(", ")}` : "no shots"}</span></li>`).join("")}</ul>
    ${r.par3Low ? `<div class="bd" style="margin-top:8px">On par 3s the pair plays off the
      lower partner's strokes.</div>` : ""}
    ${SPECIALS[r.n] ? `<div class="bd" style="margin-top:8px">
      <b>Closest to the Pin:</b> hole ${SPECIALS[r.n].ctp} &nbsp;&middot;&nbsp;
      <b>Long Drive:</b> hole ${SPECIALS[r.n].ld}</div>` : ""}`;
}

/** Who may be handed the card, and the button to do it. */
function handoffHTML(m){
  const sc = Store.scorer(m.id);
  const others = [...m.s.p, ...m.d.p].map(p => p[0]).filter(id => !sc || id !== sc.id);
  if (!canClaim(m) && !(sc && sc.id === Session.id)) return "";
  return `<div class="handoff">
    <div class="hoh">${sc && sc.id ? "Hand scoring to someone else" : "Who's keeping score?"}</div>
    ${others.map(id => `<button class="honame ${PLAYERS[id].t}" data-give="${m.id}"
      data-to="${id}">${avatarSVG(id, "sm")}<span>${esc(PLAYERS[id].n)}</span>
      <em>${id === Session.id ? "that's me" : sc && sc.id ? "give the card" : "keeps score"}</em>
      </button>`).join("")}
    ${sc && sc.id ? `<button class="hodrop" data-release="${m.id}">Nobody &mdash; lock scoring</button>` : ""}
  </div>`;
}

/** "Hodgman / Bertolini beat Mosele / MacDonald on Hole 1 with a Birdie" */
function holeVerdict(r, m, h, scores){
  if (!holeEntered(r, m, h, scores)) return null;  // wait for every score, not just one per side
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return null;
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const term = (gross, par) => {
    const x = gross - par;
    return x <= -3 ? "an Albatross" : x === -2 ? "an Eagle" : x === -1 ? "a Birdie"
         : x === 0 ? "a Par" : x === 1 ? "a Bogey" : x === 2 ? "a Double Bogey"
         : x === 3 ? "a Triple Bogey" : `a ${x} over par`;
  };
  const par = COURSES[r.course].par[h];
  if (s.net === d.net)
    return {w:null, html:`<b>${esc(nm("s"))}</b> and <b>${esc(nm("d"))}</b> halved
      Hole ${h + 1} with ${term(s.gross, par)}`};
  const w = s.net < d.net ? "s" : "d", l = w === "s" ? "d" : "s";
  const win = w === "s" ? s : d;
  return {w, html:`<b class="win ${w}">${esc(nm(w))}</b> beat ${esc(nm(l))} on Hole ${h + 1}
    with ${term(win.gross, par)}${win.picked ? " (picked up)" : ""}`};
}

/** Darth Snot, force-choking a duck. */

function playScene(o){
  document.querySelectorAll(".taunt").forEach(e => e.remove());
  const el = document.createElement("div");
  el.className = "taunt" + (o.cls ? " " + o.cls : "");
  el.innerHTML = `${o.svg}
    <div class="tline">${o.line}</div>
    ${o.sub ? `<div class="tsub">${o.sub}</div>` : ""}
    <div class="tskip">tap to skip</div>`;
  const close = () => { el.classList.add("out"); setTimeout(() => el.remove(), 320); };
  el.onclick = close;
  document.body.appendChild(el);
  clearTimeout(playScene._t);
  playScene._t = setTimeout(close, o.ms || 3800);
}

/**
 * A hole just became complete. Announce who won it, then — if the NEXT hole is a
 * side contest — flash that too, one after the other.
 * Deliberately does NOT celebrate the match being won: a fat-fingered score can
 * make a match look over when it isn't. That fires on submit instead.
 */
/**
 * The last expected score for a hole just came off the keyboard. Give the
 * scorer a beat to finish a two-digit number, then do everything at once:
 * commit, rebuild the screen (which unlocks the forward arrow and Save
 * button), and announce the verdict. Any further keystroke or a cleared
 * score cancels it.
 */
function scheduleHoleSettle(r, m, h){
  clearTimeout(scheduleHoleSettle._t);
  scheduleHoleSettle._armed = {mId: m.id, h};   // so further keystrokes push it back
  scheduleHoleSettle._t = setTimeout(() => {
    scheduleHoleSettle._armed = null;
    if ((V.view !== "match" && V.view !== "card") || V.matchId !== m.id) return;
    const verdict = holeVerdict(r, m, h, Store.scores(m.id));
    if (!verdict) return;                     // a score was cleared in the meantime
    const ae = document.activeElement;
    if (ae && ae.classList.contains("gsin")) ae.blur();
    V.pending = false; render();
    afterHoleComplete(r, m, h, verdict);
  }, 900);
}

function afterHoleComplete(r, m, h, verdict){
  flashHoleResult(verdict.html);
  let delay = 1500;

  // three straight holes to the Snots — Turkey
  const st = matchState(r, m, Store.scores(m.id));
  const played = [];
  for (let i = 0; i <= h; i++) if (st.holes[i] !== null) played.push({i, w: st.holes[i]});
  const tail = played.slice(-3);
  if (tail.length === 3 && tail.every(x => x.w === "s") && tail[2].i === h){
    const names = m.s.p.map(p => last(p[0])).join(" / ");
    setTimeout(() => playTurkey(names), delay);
    delay += 4400;
  }

  // a Snot eagle, gross or net
  const hs = holeScores(r, m, h, Store.scores(m.id));
  const par = COURSES[r.course].par[h];
  const ents = r.mode === "team" ? ["s"] : m.s.p.map(p => p[0]);
  for (const id of ents){
    const v = hs[id]; if (!v || v.picked) continue;
    const who = r.mode === "team" ? m.s.p.map(p => last(p[0])).join(" / ") : PLAYERS[id].n;
    if (v.gross - par <= -2){ setTimeout(() => playBigDuck(who, "gross"), delay); delay += 4400; break; }
    if (v.net - par <= -2){ setTimeout(() => playBigDuck(who, "net"), delay); delay += 4400; break; }
  }

  // the next hole is a side contest
  const nxt = specialAt(r.n, h + 1);
  if (nxt && h + 1 <= 17) setTimeout(() => flashSpecial(nxt, h + 2), delay);
}

/* The Crusade being won plays once, on every phone that sees it happen. */
const VICTORY_KEY = `${EVENT_KEY}_victory`;
function checkVictory(){
  if (!Session.id) return;
  // Count SUBMITTED cards only — same principle as the match-win scene: a
  // mistyped score must never start a party, and this one can only ever fire
  // once. The clinching point arrives when its card is signed off.
  let s = 0;
  for (const id in ALL_MATCHES){
    if (!Store.isSubmitted(id)) continue;
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done) s += st.pts.s;
  }
  if (s < CLINCH) return;
  try { if (localStorage.getItem(VICTORY_KEY)) return;
        localStorage.setItem(VICTORY_KEY, "1"); } catch(e){}
  playVictory(s);
}

/**
 * Hole-won announcements — flash right over the match bar, not mid-screen.
 * If a second one lands while the first is still up (two singles matches in
 * the same group, or a quick correction), they stack instead of overlapping.
 * Live banners are tracked outside the render cycle: a re-render rebuilds the
 * DOM underneath them, so they re-attach to the fresh stack each time.
 */
const VFLASH_LIVE = [];
function flashHoleResult(html){
  const el = document.createElement("div");
  el.className = "vflash"; el.innerHTML = html;
  VFLASH_LIVE.push(el);
  while (VFLASH_LIVE.length > 3) VFLASH_LIVE.shift().remove();
  setTimeout(() => {
    const i = VFLASH_LIVE.indexOf(el);
    if (i > -1) VFLASH_LIVE.splice(i, 1);
    el.remove();
  }, 3000);
  mountVflashes();
}
function mountVflashes(){
  const stack = document.getElementById("vflashstack");
  if (!stack) return;                       // not on the hole screen right now
  VFLASH_LIVE.forEach(el => {
    if (el.parentNode === stack) return;
    // survived a re-render: re-attach without replaying the fade-in
    if (el.parentNode){ el.style.animation = "none"; el.style.opacity = "1"; }
    stack.appendChild(el);
  });
}

function showToast(html){
  const old = document.querySelector(".toast"); if (old) old.remove();
  const t = document.createElement("div");
  t.className = "toast"; t.innerHTML = html;
  document.body.appendChild(t);
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { if (t.parentNode) t.remove(); }, 4200);
}

function holeLine(r, m, h, scores){
  if (!holeEntered(r, m, h, scores)) return "";
  const s = sideHole(r, m, "s", h, scores), d = sideHole(r, m, "d", h, scores);
  if (!s || !d) return "";
  return s.net < d.net ? "Snots win the hole" : d.net < s.net ? "Ducks win the hole" : "Hole halved";
}
function matchLine(st){
  if (st.done) return st.winner
    ? `${st.winner === "s" ? "SNOTS" : "DUCKS"} win ${esc(st.text)}` : "Match halved";
  if (st.up === 0) return `All square thru ${st.thru}`;
  return `${st.up > 0 ? "SNOTS" : "DUCKS"} ${Math.abs(st.up)} UP thru ${st.thru}`;
}
/* Always rendered at the same height — if this bar appears or disappears as
   scores go in, every button below it jumps under the scorer's thumb. */
function scorerBar(m, sc){
  const mine = sc && sc.id === Session.id;
  let body;
  if (mine) body = `<b>You're keeping score.</b> Everyone else sees this live.
    <button data-briefopen="1">Hand off scoring &rsaquo;</button>`;
  else if (sc && sc.id) body = `<b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.` +
    (canClaim(m) ? ` <button data-claim="${m.id}">Take over &rsaquo;</button>` : ` View only.`);
  else if (canClaim(m)) body = `<b>Nobody is keeping score yet.</b> Scores are locked until
    someone takes it on. <button data-claim="${m.id}">I'll keep score &rsaquo;</button>`;
  else body = `<b>View only.</b> You're not in this match.`;
  return `<div class="lockbar">${body}</div>`;
}
function entryRow(o){
  const picked = o.raw === PICKED;
  const cls = picked ? "picked" : markCls(o.gross, o.par);
  const val = picked ? "X" : (o.raw == null ? "" : o.raw);
  return `<div class="prow ${o.best ? "best" : ""}">
    <div class="pname">${esc(o.name)}<span class="hc">${esc(o.sub)}</span>${
      o.best ? `<span class="ball">counts</span>` : ""}</div>
    <div class="entry">
      <span class="lab">Gross Score:</span>
      <span class="gswrap">
        <input class="gsin ${val === "" ? "blank" : cls}" id="gs-${o.entrant}"
          data-entrant="${o.entrant}" type="${picked ? "text" : "number"}"
          inputmode="numeric" pattern="[0-9]*" min="1" max="15" value="${val}"
          ${o.editable && !picked ? "" : "readonly"}>
        ${dotsHTML(o.strokes)}
      </span>
      <span class="out" id="net-${o.entrant}">${
        o.gross == null ? "" : `${picked ? "plays" : "net"}<b>${o.gross - o.strokes}</b>`}</span>
      ${o.editable ? `<span class="acts">
        <button class="act pick ${picked ? "on" : ""}" data-pick="${o.entrant}">
          <b>Picked</b><i>up</i></button>
        <button class="act clear" data-clear="${o.entrant}">
          <b>Clear</b><i>score</i></button>
      </span>` : ""}
    </div></div>`;
}

/* ---------- full scorecard ---------- */
function viewCard(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);

  // running "up" after each decided hole (+ve = Snots), null where not played
  const run = []; let u = 0;
  for (let h = 0; h < 18; h++){
    const w = st.holes[h];
    if (w === null){ run.push(null); continue; }
    if (w === "s") u++; else if (w === "d") u--;
    run.push(u);
  }
  const shortSide = key => m[key].p.length > 1
    ? m[key].p.map(p => last(p[0])[0]).join("/") : last(m[key].p[0][0]);

  const rowPair = (name, colour, entrantId, strokesFor, from, to) => {
    let g = `<tr class="gr"><td class="lbl" style="color:${colour}">${esc(name)}</td>`;
    let n = `<tr class="netrow"><td class="lbl">net</td>`;
    let gt = 0, nt = 0, any = false;
    for (let h = from; h <= to; h++){
      const hs = holeScores(r, m, h, scores);
      const v = hs[entrantId], raw = (scores[h] || {})[entrantId];
      // strokes show whether or not the hole has been scored yet, same as live entry
      const s = strokesFor(h);
      const cell = !v ? ""
        : raw === PICKED ? `<span class="mk picked">X</span>`
        : `<span class="mk ${markCls(v.gross, c.par[h])}">${v.gross}</span>`;
      g += `<td class="tap" data-gohole="${h}">${
        s > 0 ? `<span class="gdot${s > 1 ? " two" : ""}"></span>` : ""}${cell}</td>`;
      n += `<td>${v ? `<b>${v.net}</b>` : ""}</td>`;
      if (v){ gt += v.gross; nt += v.net; any = true; }
    }
    g += `<td class="tot">${any ? gt : ""}</td></tr>`;
    n += `<td class="tot">${any ? `<b>${nt}</b>` : ""}</td></tr>`;
    return g + n;
  };

  const nine = (from, to, label) => {
    let head = `<tr><th class="lbl">${label}</th>`;
    for (let h = from; h <= to; h++){
      const sp = specialAt(r.n, h);
      head += `<th${sp ? ` class="sph" title="${SPECIAL_LABEL[sp]}"` : ""}>${h + 1}${
        sp ? `<span class="sptag">${SPECIAL_SHORT[sp]}</span>` : ""}</th>`;
    }
    head += `<th class="tot">${label}</th></tr>`;
    let par = `<tr class="meta"><td class="lbl">Par</td>`, si = `<tr class="meta"><td class="lbl">Stroke index</td>`;
    let pT = 0;
    for (let h = from; h <= to; h++){ par += `<td>${c.par[h]}</td>`; si += `<td>${c.hcp[h]}</td>`; pT += c.par[h]; }
    par += `<td class="tot">${pT}</td></tr>`; si += `<td class="tot"></td></tr>`;

    let body = "";
    ["s","d"].forEach(key => {
      const side = m[key], colour = key === "s" ? "var(--snots)" : "var(--ducks)";
      if (r.mode === "team"){
        body += rowPair(side.p.map(p => last(p[0])).join(" / "), colour, key,
          h => teamStrokes(r, side, h), from, to);
      } else {
        side.p.forEach(pl => body += rowPair(PLAYERS[pl[0]].n, colour, pl[0],
          h => playerStrokes(r, side, pl, h), from, to));
        if (side.p.length > 1){
          let g = `<tr class="bestrow"><td class="lbl" style="color:${colour}">${
            key === "s" ? "SNOTS" : "DUCKS"} net</td>`;
          let t = 0, any = false;
          for (let h = from; h <= to; h++){
            const v = sideHole(r, m, key, h, scores);
            g += `<td>${v ? v.net : ""}</td>`;
            if (v){ t += v.net; any = true; }
          }
          body += g + `<td class="tot">${any ? t : ""}</td></tr>`;
        }
      }
      body += `<tr class="sep"><td class="lbl"></td>${"<td></td>".repeat(to - from + 2)}</tr>`;
    });

    /* Running match status, not per-hole winners. A golfer looking at this
       wants "who's up and by how much", not to add up S's and D's. */
    let res = `<tr class="rowres"><td class="lbl">Match</td>`;
    let lastU = null;
    for (let h = from; h <= to; h++){
      const u = run[h];
      if (u === null){ res += `<td></td>`; continue; }
      lastU = u;
      res += `<td class="${u > 0 ? "w" : u < 0 ? "l" : "hh"}">${
        u === 0 ? "AS" : `${Math.abs(u)} UP`}</td>`;
    }
    let totTxt = "", totCls = "";
    if (to === 17 && st.done){
      totTxt = st.winner ? `${shortSide(st.winner)} ${st.text}` : "AS &frac12;&ndash;&frac12;";
      totCls = st.winner || "h";                       // final result carries the winner's colour
    } else if (lastU !== null){
      totTxt = lastU === 0 ? "AS" : `${shortSide(lastU > 0 ? "s" : "d")} ${Math.abs(lastU)} UP`;
      totCls = lastU > 0 ? "s" : lastU < 0 ? "d" : "h";
    }
    res += `<td class="tot ${totCls}">${totTxt}</td></tr>`;
    return `<div class="gridwrap"><div class="gscroll"><table class="gc">
      <thead>${head}</thead><tbody>${par}${si}${body}${res}</tbody></table></div></div>`;
  };

  const holesFilled = st.holes.filter(Boolean).length;
  const submitted = Store.isSubmitted(m.id);
  const canSubmit = st.done && !submitted && (canScore(m) || Session.admin);

  return `<div class="topbar">
      <button class="iconbtn" data-nav="match" data-id="${m.id}">&#8592;</button>
      <h1>Review Round<div class="sub">${esc(c.n)} &middot; ${esc(r.fmt)} &middot; ${esc(m.tee || r.tee)}</div></h1>
      ${navBtnsHTML()}
    </div><div class="wrap">
      <div class="resbar ${st.done && !st.winner ? "halved" : (st.winner || "")}">
        <div class="r1">${submitted ? "Submitted &middot; official" : "Match result"}</div>
        <div class="r2">${st.started ? matchLine(st) : "Not started"}</div></div>
      ${canSubmit ? `<div class="lockbar">Check the card against the paper copy, then submit.
        ${holesFilled < 18 ? `<b>${18 - holesFilled} hole${18 - holesFilled === 1 ? "" : "s"}
        still blank</b> &mdash; you can submit anyway, but those holes won't count toward statistics.`
        : "All 18 holes are in."}</div>
        <button class="btn" style="margin:0 0 11px" data-submit="${m.id}">Attest &amp; Submit Round</button>` : ""}
      ${submitted ? `<div class="lockbar"><b>This round is submitted and locked.</b>
        ${Session.admin ? `<button data-unsubmit="${m.id}">Reopen &rsaquo;</button>`
          : "Ask Andrew or Pat if it needs reopening."}</div>` : ""}
      ${!st.done && st.started ? `<div class="lockbar">Match still in progress &mdash;
        thru ${st.thru}. You can submit once it's decided.</div>` : ""}
      ${nine(0, 8, "OUT")}${nine(9, 17, "IN")}
      <div class="gridwrap"><div class="legend">
        <span class="sw u c1">3</span> birdie &middot; <span class="sw u c2">2</span> eagle &middot;
        <span class="sw b1">5</span> bogey &middot; <span class="sw b2">6</span> double<br>
        <span class="rd"></span> a stroke is given on that hole
        ${r.par3Low ? "<br>Par 3s: the pair plays off the lower partner's strokes." : ""}
      </div></div>
      <div class="actions">
        <button class="btn big ghost" data-nav="match" data-id="${m.id}">Return to Your Match</button>
        <button class="btn big ghost" data-nav="board">Live Leaderboard</button>
      </div>
    </div>`;
}

/* ---------- menu ---------- */
function viewSheet(){
  if (V.sheet !== "menu") return "";
  let codes = "";
  if (Session.admin) codes = `<div class="sect" style="margin-top:4px">Player codes</div>
    <div class="codelist">` + Object.keys(PLAYERS).map(id =>
      `<div class="cn">${esc(PLAYERS[id].n)}<span style="color:var(--dim)"> &middot; ${
        PLAYERS[id].t === "s" ? "Snots" : "Ducks"}</span></div>
       <div class="cc mono">${PLAYERS[id].code}</div>`).join("") + `</div>`;
  return `<div class="sheet" data-close="1"><div class="sheet-in">
    <div class="sheethdr"><h3>${esc(Session.me.n)}</h3>
      <button class="iconbtn" data-closebtn="1">&times;</button></div>
    <p>${Session.me.t === "s" ? "Snots" : "Ducks"} &middot; Index ${fmtIdx(Session.me.idx)}${
      Session.me.title ? " &middot; " + esc(Session.me.title) : ""}<br>
      ${Store.online ? "Live sync is on." : "Offline &mdash; scores save here and sync when you get service."}<br>
      <span style="color:var(--dim)">Version ${BUILD}</span></p>
    <div class="mycode"><div class="mck">Your login code</div>
      <div class="mcv mono">${Session.me.code}</div>
      <div class="mch">Write this down. It's how you get back in if you're ever signed out.</div></div>
    ${codes}
    ${Session.admin ? `<div class="sect" style="margin-top:4px">Backup</div>
      <p style="margin-bottom:10px">Downloads every score, scorecard and chat message as a
      single file. If anything is ever lost, load that file back and it restores &mdash;
      it can only add back what's missing, never overwrite something newer.</p>
      <button class="btn ghost" data-export="1">Download backup</button>
      <button class="btn ghost" data-restore="1">Restore from backup&hellip;</button>
      <input type="file" id="restorefile" accept="application/json,.json" style="display:none">` : ""}
    <button class="btn ghost" data-closebtn="1">Close</button>
    <button class="btn ghost" data-signout="1">Return to lock screen</button>
  </div></div>`;
}

/* ==========================================================================
   8. EVENTS
   ========================================================================== */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => {
    const n = el.dataset.nav;
    if (n !== "match") V.fromCard = false;   // leaving the card/hole loop
    if (n === "home")  V.view = "home";
    if (n === "board") V.view = "board";
    if (n === "matches") V.view = "matches";
    if (n === "profile"){ V.view = "profile"; V.profileId = null; }
    if (n === "stats") V.view = "stats";
    if (n === "chat")  V.view = "chat";
    if (n === "round"){ V.view = "round"; V.round = +el.dataset.i; }
    if (n === "match"){
      V.view = "match"; V.matchId = el.dataset.id;
      const {r, m} = ALL_MATCHES[V.matchId];
      V.round = ROUNDS.indexOf(r);
      // land on the first hole still missing a score, not on the close-out hole,
      // so the card can be finished for the statistics
      const sc = Store.scores(m.id);
      let first = 17;
      for (let h = 0; h < 18; h++){
        if (!holeEntered(r, m, h, sc)){ first = h; break; }
      }
      V.hole = first;
      // A match with no scores AT ALL opens on its own briefing screen — format,
      // who's stroking where, and who's picking up the card — before any scoring.
      // "Any score" and not "a completed hole": a half-entered hole means the
      // group is mid-round and must land back on the scoring screen.
      const begun = matchBegun(m.id);
      if (!begun) V.view = "brief";
      V.briefOpen = false;
      V.pendingTaunt = !begun && !taunted()[m.id] ? m.id : null;
    }
    if (n === "card"){ V.view = "card"; V.matchId = el.dataset.id; }
    V.sheet = null; render(); window.scrollTo(0, 0);
    if (V.pendingTaunt){
      const {r, m} = ALL_MATCHES[V.pendingTaunt];
      markTaunted(V.pendingTaunt); V.pendingTaunt = null;
      playTaunt(r, m);
    }
  });

  const upd = document.querySelector("[data-update]");
  if (upd) upd.onclick = applyUpdate;
  document.querySelectorAll("[data-profile]").forEach(el => el.onclick = () => {
    V.view = "profile"; V.profileId = el.dataset.profile; render(); window.scrollTo(0, 0);
  });
  document.querySelectorAll("[data-sheet]").forEach(el =>
    el.onclick = () => { V.sheet = el.dataset.sheet; render(); });
  document.querySelectorAll("[data-sort]").forEach(el =>
    el.onclick = () => { V.statSort = el.dataset.sort; render(); window.scrollTo(0, 0); });
  const sel = document.getElementById("statsel");
  if (sel) sel.onchange = () => { V.statSort = sel.value; render(); };

  /* --- chat --------------------------------------------------------------- */
  document.querySelectorAll("[data-chan]").forEach(el =>
    el.onclick = () => { V.chan = el.dataset.chan; render(); });
  const retry = document.querySelector("[data-retry]");
  if (retry) retry.onclick = () => { Store.chatRetry(); render(); };

  if (V.view === "chat"){
    const inp = document.getElementById("chatin");
    const btn = document.getElementById("chatsend");
    const tag = document.getElementById("tagbtn");
    if (tag){
      tag.classList.toggle("on", !!V.tagOpen);
      tag.onclick = () => { V.draft = inp ? inp.value : null; V.tagOpen = !V.tagOpen;
                            V.refocusChat = false; render(); };
    }
    document.querySelectorAll("[data-tag]").forEach(el => el.onclick = () => {
      const box = document.getElementById("chatin");
      const cur = (box.value || "").trimEnd();
      V.draft = (cur ? cur + " " : "") + "@" + PLAYERS[el.dataset.tag].n + " ";
      V.tagOpen = false; V.refocusChat = true; render();
    });
    const listEl = document.getElementById("chatlist");
    const ch = V.chan === "team" ? myChannel() : "all";
    if (listEl) listEl.scrollTop = listEl.scrollHeight;      // newest message in view
    Store.chatMarkRead(ch);

    const grow = () => { inp.style.height = "auto";
                         inp.style.height = Math.min(inp.scrollHeight, 104) + "px"; };
    const send = () => {
      const txt = inp.value.trim();
      if (!txt) return;
      Store.chatSend(ch, txt.slice(0, 500), Session.id);
      inp.value = ""; grow(); V.pending = false; render();
      const l = document.getElementById("chatlist");
      if (l) l.scrollTop = l.scrollHeight;
      document.getElementById("chatin").focus();
    };
    if (inp){
      // a message arriving mid-sentence must not eat the draft or the caret
      if (V.draft != null){ inp.value = V.draft; V.draft = null; grow(); }
      inp.oninput = grow;
      inp.onfocus = () => setTimeout(() =>
        inp.scrollIntoView({block: "center", behavior: "smooth"}), 260);
      inp.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
      };
      if (V.refocusChat){ V.refocusChat = false; inp.focus(); }
    }
    if (btn) btn.onclick = send;
  }
  document.querySelectorAll("[data-close]").forEach(el =>
    el.onclick = e => { if (e.target === el){ V.sheet = null; render(); } });
  document.querySelectorAll("[data-closebtn]").forEach(el =>
    el.onclick = () => { V.sheet = null; render(); });
  /* --- tiebreak ----------------------------------------------------------- */
  const tbf = document.querySelector("[data-tbformat]");
  if (tbf) tbf.onclick = () => {
    const v = (document.getElementById("tbformat").value || "").trim();
    if (!v){ alert("Say what the tiebreak is first."); return; }
    Store.setTiebreak({format: v.slice(0, 300)}, Session.id);
    render(); window.scrollTo(0, 0);
  };
  document.querySelectorAll("[data-tbwinner]").forEach(el => el.onclick = () => {
    const res = (document.getElementById("tbresult").value || "").trim();
    const team = el.dataset.tbwinner;
    if (!confirm(`Declare the ${team === "s" ? "SNOTS" : "DUCKS"} winners of the Crusade on the tiebreak?`)) return;
    Store.setTiebreak({result: res.slice(0, 300), winner: team}, Session.id);
    render(); window.scrollTo(0, 0);
  });
  const tbe = document.querySelector("[data-tbedit]");
  if (tbe) tbe.onclick = () => { Store.setTiebreak({format: ""}, Session.id); render(); };
  const tbr = document.querySelector("[data-tbreset]");
  if (tbr) tbr.onclick = () => {
    if (confirm("Clear the tiebreak and start it over?")) { Store.clearTiebreak(Session.id); render(); }
  };

  const exp = document.querySelector("[data-export]");
  if (exp) exp.onclick = () => {
    const blob = new Blob([JSON.stringify(Store.exportAll(), null, 1)], {type:"application/json"});
    const a = document.createElement("a");
    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${
      String(d.getDate()).padStart(2,"0")}-${String(d.getHours()).padStart(2,"0")}${
      String(d.getMinutes()).padStart(2,"0")}`;
    a.href = URL.createObjectURL(blob);
    a.download = `crusade-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    showToast("Backup downloaded");
  };
  const rst2 = document.querySelector("[data-restore]");
  const rf = document.getElementById("restorefile");
  if (rst2 && rf){
    rst2.onclick = () => rf.click();
    rf.onchange = () => {
      const f = rf.files && rf.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const res = Store.importAll(JSON.parse(rd.result));
          showToast(`Restored ${res.restored} entr${res.restored === 1 ? "y" : "ies"}` +
                    (res.skipped ? ` &middot; ${res.skipped} already current` : ""));
          V.sheet = null; render();
        } catch(e){ alert("Couldn't read that file.\n\n" + e.message); }
      };
      rd.readAsText(f);
    };
  }
  const so = document.querySelector("[data-signout]");
  if (so) so.onclick = () => { Session.id = null; V.sheet = null; V.view = "home"; render(); };

  document.querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    V.hole = Math.max(0, Math.min(17, V.hole + (+el.dataset.step))); render(); });
  document.querySelectorAll("[data-hole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.hole; render(); });
  // tapping a hole on the review card jumps straight into editing it
  document.querySelectorAll("[data-gohole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.gohole; V.view = "match"; V.fromCard = true;
    render(); window.scrollTo(0, 0); });

  const claim = document.querySelector("[data-claim]");
  if (claim) claim.onclick = () => { Store.setScorer(claim.dataset.claim, Session.id); render(); };
  const rel = document.querySelector("[data-release]");
  if (rel) rel.onclick = () => {
    if (confirm("Hand off scorekeeping?\n\nScores lock until someone else in the match takes it on."))
      { Store.setScorer(rel.dataset.release, null); render(); }
  };
  // hand the card to a named player straight from the briefing
  document.querySelectorAll("[data-give]").forEach(el => el.onclick = () => {
    const to = el.dataset.to;
    if (to !== Session.id && !confirm(`Hand scoring to ${PLAYERS[to].n}?\n\n`
      + `${PLAYERS[to].n} enters the scores from their own phone.`)) return;
    Store.setScorer(el.dataset.give, to); render();
  });
  document.querySelectorAll("[data-briefopen]").forEach(el => el.onclick = () => {
    V.briefOpen = !V.briefOpen; render();
    if (V.briefOpen){ const d = document.querySelector(".briefdrop");
      if (d) d.scrollIntoView({behavior: "smooth", block: "nearest"}); }
  });
  const pro = document.querySelector("[data-toscoring]");
  if (pro) pro.onclick = () => { V.view = "match"; render(); window.scrollTo(0, 0); };
  const sub = document.querySelector("[data-submit]");
  if (sub) sub.onclick = () => {
    const id = sub.dataset.submit, {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    Store.setSubmitted(id, true, Session.id);
    V.view = "home"; render(); window.scrollTo(0, 0);
    // celebrate only once the card is signed off, never on a mistyped score
    if (st.winner === "s") playWin(r, m, st);
  };
  const unsub = document.querySelector("[data-unsubmit]");
  if (unsub) unsub.onclick = () => {
    if (confirm("Reopen this round for editing?\n\nIt stops being official until it's submitted again."))
      { Store.setSubmitted(unsub.dataset.unsubmit, false, Session.id); render(); }
  };
  const rst = document.querySelector("[data-reset]");
  if (rst) rst.onclick = () => {
    if (confirm("Wipe every score in this match and start it over?\n\nThis clears it on everyone's phone."))
      { Store.resetMatch(rst.dataset.reset); V.hole = 0; render(); } };

  /* --- gross score inputs -------------------------------------------------
     Writes are "silent" (no re-render) so the keyboard stays open and the
     caret doesn't jump. The derived numbers are patched in place instead. */
  document.querySelectorAll(".gsin").forEach(el => {
    if (el.readOnly) return;
    el.oninput = () => {
      const raw = el.value.replace(/[^0-9]/g, "").slice(0, 2);
      if (el.value !== raw) el.value = raw;
      let v = raw === "" ? null : parseInt(raw, 10);
      // Out of range: refuse the keystroke and put the box back to what is
      // actually stored. Letting "16" sit in the box while a 1 is saved is how
      // a scorer ends up certain he entered a number the card never got.
      if (v !== null && (v < 1 || v > 15)){
        const {m: mm} = ALL_MATCHES[V.matchId];
        const cur = (Store.scores(mm.id)[V.hole] || {})[el.dataset.entrant];
        el.value = (cur == null || cur === PICKED) ? "" : String(cur);
        el.select();
        return;
      }
      const {r, m} = ALL_MATCHES[V.matchId];
      const before = holeEntered(r, m, V.hole, Store.scores(m.id));
      Store.setScore(m.id, V.hole, el.dataset.entrant, v, Session.id, true);
      patch();
      // The LAST expected score just landed. Don't judge it instantly — the "1"
      // may be about to become "12". Settle, then announce and unlock together.
      // While a settle is armed, every further keystroke pushes it back, so the
      // verdict always reads the finished number. It never re-arms for a hole
      // that was already complete, so corrections don't re-announce.
      const after = holeEntered(r, m, V.hole, Store.scores(m.id));
      const armed = scheduleHoleSettle._armed;
      if (after && (!before || (armed && armed.mId === m.id && armed.h === V.hole)))
        scheduleHoleSettle(r, m, V.hole);
      else if (!after){
        clearTimeout(scheduleHoleSettle._t);
        scheduleHoleSettle._armed = null;
      }
    };
    el.onfocus = () => {
      el.select();
      // iOS slides the keyboard up over the page; put the active box mid-screen.
      setTimeout(() => el.scrollIntoView({block: "center", behavior: "smooth"}), 260);
    };
    el.onblur = () => {
      // last line of defence: the box must always show what the card holds
      const {m: mm} = ALL_MATCHES[V.matchId];
      const cur = (Store.scores(mm.id)[V.hole] || {})[el.dataset.entrant];
      const shown = (cur == null) ? "" : cur === PICKED ? "X" : String(cur);
      if (el.value !== shown) el.value = shown;
      if (V.pending){ V.pending = false; render(); } else patch();
    };
  });
  const proceed = document.querySelector("[data-proceed]");
  if (proceed) proceed.onclick = () => {
    const ae = document.activeElement;
    if (ae && ae.classList.contains("gsin")) ae.blur();   // commit what's typed
    if (V.fromCard){ V.fromCard = false; V.view = "card"; }   // one tap back to review
    else if (V.hole === 17) V.view = "card";                  // all 18 in — review and submit
    else V.hole = V.hole + 1;
    V.pending = false; render(); window.scrollTo(0, 0);
  };
  document.querySelectorAll("[data-clear]").forEach(el => el.onclick = () => {
    const {m} = ALL_MATCHES[V.matchId];
    Store.setScore(m.id, V.hole, el.dataset.clear, null, Session.id, true);
    render();
  });
  document.querySelectorAll("[data-pick]").forEach(el => el.onclick = () => {
    const {r, m} = ALL_MATCHES[V.matchId];
    const cur = (Store.scores(m.id)[V.hole] || {})[el.dataset.pick];
    const before = holeEntered(r, m, V.hole, Store.scores(m.id));
    // tapping Picked Up again un-picks
    Store.setScore(m.id, V.hole, el.dataset.pick,
      cur === PICKED ? null : PICKED, Session.id, true);
    render();
    // a tap is deliberate — no settle delay needed, announce right away
    const verdict = holeVerdict(r, m, V.hole, Store.scores(m.id));
    if (verdict && !before) afterHoleComplete(r, m, V.hole, verdict);
  });

  if (V.view === "match"){
    let x0 = null, y0 = null;
    const w = document.querySelector(".wrap");
    w.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; };
    w.ontouchend = e => {
      if (x0 === null || document.activeElement.classList.contains("gsin")) { x0 = null; return; }
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8){
        const fwd = dx < 0;
        // swiping forward obeys the same gate as the buttons
        const {r: rr, m: mm2} = ALL_MATCHES[V.matchId];
        const done = matchState(rr, mm2, Store.scores(mm2.id)).holes[V.hole] !== null;
        if (!fwd || done){ V.hole = Math.max(0, Math.min(17, V.hole + (fwd ? 1 : -1))); render(); }
      }
      x0 = null;
    };
  }
}

/** Update everything derived from a score without rebuilding the DOM. */
function patch(){
  if (V.view !== "match") return;
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores), h = V.hole;

  ["s","d"].forEach(key => {
    const side = m[key], bh = sideHole(r, m, key, h, scores);
    const sn = document.getElementById(`sidenet-${key}`);
    if (sn) sn.innerHTML = bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;";
    const ents = r.mode === "team" ? [[key, teamStrokes(r, side, h)]]
      : side.p.map(pl => [pl[0], playerStrokes(r, side, pl, h)]);
    const hs = holeScores(r, m, h, scores);
    ents.forEach(([id, strokes]) => {
      const raw = (scores[h] || {})[id], v = hs[id], picked = raw === PICKED;
      const out = document.getElementById(`net-${id}`);
      if (out) out.innerHTML = !v ? "" : `${picked ? "plays" : "net"}<b>${v.net}</b>`;
      const inp = document.getElementById(`gs-${id}`);
      if (inp){
        inp.className = "gsin " + (raw == null ? "blank"
          : picked ? "picked" : markCls(v.gross, c.par[h]));
        const row = inp.closest(".prow");
        if (row) row.classList.toggle("best",
          !!(bh && bh.byId === id && r.mode !== "team" && side.p.length > 1));
      }
    });
  });

  const r1 = document.getElementById("res1"), r2 = document.getElementById("res2");
  // matchLine() returns HTML-escaped text (a result like "5 & 3" becomes
  // "5 &amp; 3"), so it must go in as innerHTML — textContent would print the
  // escape literally. holeLine() is plain text and stays textContent.
  if (r1) r1.textContent = holeLine(r, m, h, scores);
  if (r2) r2.innerHTML = matchBegun(m.id) ? matchLine(st) : "Match not started";
  const rb = document.getElementById("resbar");
  if (rb) rb.className = "resbar " + (st.winner || "");

  /* Navigation gating has to follow the scores LIVE — patch() runs on every
     keystroke while render() can't (it would rebuild the DOM under the
     scorer's thumb). Before this, the forward arrow and Save button kept
     whatever disabled state they were rendered with, so a hole completed
     from the keyboard stayed locked until something else forced a render. */
  let firstOpen = 17;
  for (let i = 0; i < 18; i++){ if (st.holes[i] === null){ firstOpen = i; break; } }
  const holeDone = st.holes[h] !== null;
  for (let i = 0; i < 18; i++){
    const chip = document.getElementById(`chip-${i}`), w = st.holes[i];
    if (!chip) continue;
    const locked = i > firstOpen, sp = specialAt(r.n, i);
    // rebuild the FULL class list — dropping "lock"/"sp" here is what used to
    // erase the CTP/LD dots from the strip after the first keystroke
    chip.className = (i === h ? "cur " : "") + (locked ? "lock " : "") + (sp ? "sp " : "") +
      (w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : "");
    chip.disabled = locked;
  }
  const fwd = document.querySelector('.navbtn[data-step="1"]');
  if (fwd) fwd.disabled = h === 17 || !holeDone;
  const go = document.querySelector("[data-proceed]");
  if (go) go.disabled = !(holeDone || V.fromCard);
  const gate = document.getElementById("gatebar");
  if (gate) gate.classList.toggle("off", holeDone || V.fromCard);
}

/* ==========================================================================
   9. BOOT
   ========================================================================== */
Store.onChange(() => {
  if (!Session.id) return;
  checkVictory();
  const ae = document.activeElement, cls = ae && ae.classList;
  // Never rebuild the DOM out from under someone who is typing a score.
  if (cls && cls.contains("gsin")){ V.pending = true; return; }
  // Chat can redraw live, but the draft and caret have to survive it.
  if (cls && cls.contains("chatin")){ V.draft = ae.value; V.refocusChat = true; }
  render();
});
Store.connect();
render();

// check for a new build on load, when the app comes back to the foreground,
// and every ten minutes while it's open
setTimeout(checkForUpdate, 4000);
setInterval(checkForUpdate, 600000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") checkForUpdate();
});

window.MI26 = {PLAYERS, COURSES, ROUNDS, ALL_MATCHES, Store, Session, V,
  strokesOn, playerStrokes, teamStrokes, sideHole, holeScores, holeEntered, matchState, standings, markCls, PICKED,
  playerStats, playerPoints, mvp, toPar, roundSummary, holeVerdict, briefBody, viewBrief, seriesHTML, rColour,
  eventResult, tiebreakHTML, tugSVG, avatarSVG, viewProfile,
  SPECIALS, specialAt, flashSpecial, afterHoleComplete, showToast, flashHoleResult, navBtnsHTML,
  mentionsMe, renderMsgText, taggedUnread, taggedTotal,
  playTaunt, tauntSVG, taunted, markTaunted, playWin, duckHuntSVG, matchLine, holeLine,
  playScene, playTurkey, playBigDuck, playVictory, checkVictory,
  rocketSVG, darthSVG, moonSVG, turkeySVG, bigDuckSVG, victorySVG,
  render, patch, MATCH_COUNT, myMatch, BUILD, checkForUpdate,
  resetAll(){ Object.keys(ALL_MATCHES).forEach(id => Store.resetMatch(id)); render(); }};
</script>
