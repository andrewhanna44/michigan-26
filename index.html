<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Michigan '26 &middot; Snots vs Ducks</title>
<style>
:root{
  --bg:#eef1f4; --surface:#fff; --surface2:#f4f6f8; --surface3:#e7ebef;
  --line:#dce2e8; --text:#0e1216; --muted:#5c6773; --dim:#8d97a3;
  --red:#c8102e; --red-dim:#fbe9ec;
  --snots:#14477f; --ducks:#8a6100;
  --snots-tint:#e4edf8; --ducks-tint:#f8f0dd;
  --win:#1f7a3d; --half:#9aa4b0;
  --shadow:0 1px 2px rgba(14,18,22,.06), 0 1px 8px rgba(14,18,22,.04);
  --safe-b:env(safe-area-inset-bottom,0px);
}
/* The splash keeps the dark space theme; everything past the door is daylight. */
.splash{
  --surface:#1d2025; --surface2:#262a30; --line:#3a4048;
  --text:#e9ecef; --muted:#98a1ad; --dim:#6b7480; --red:#e03131;
  --snots:#4dabf7; --ducks:#fab005;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{padding-bottom:var(--safe-b)}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
.topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;
  padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.topbar h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.1px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:0}
.iconbtn{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:var(--surface2);border:1px solid var(--line);
  flex:none;font-size:17px;line-height:1}
.iconbtn:active{background:var(--surface3)}
.wrap{padding:14px 14px 40px}

/* ---------- splash / login ---------- */
.splash{position:fixed;inset:0;background:
  radial-gradient(1100px 620px at 50% -18%, #1d2740 0%, #14161a 62%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:28px;z-index:100;overflow:hidden}
.stars{position:absolute;inset:0;pointer-events:none}
.stars i{position:absolute;background:#fff;border-radius:50%;opacity:.55;
  animation:tw 3.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.16}50%{opacity:.85}}
.splash-inner{position:relative;z-index:2;width:100%;max-width:400px;text-align:center}
.kicker{font-size:11px;letter-spacing:3.4px;color:var(--muted);text-transform:uppercase;font-weight:700}
.bigtitle{font-size:40px;font-weight:850;letter-spacing:-1.2px;margin:6px 0 2px;line-height:1}
.bigtitle .yr{color:var(--red)}
.dates{font-size:12px;color:var(--dim);letter-spacing:1.6px;text-transform:uppercase;font-weight:600}
.vsrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px 0 22px}
.crest{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}
.crest svg{width:74px;height:74px;display:block}
.crest .nm{font-size:13px;font-weight:800;letter-spacing:2.2px}
.crest.s .nm{color:var(--snots)} .crest.d .nm{color:var(--ducks)}
.vs{font-size:15px;font-weight:850;color:var(--dim);letter-spacing:1px;flex:none}
.loginbox{margin-top:6px}
.codein{width:100%;text-align:center;font-size:27px;letter-spacing:11px;font-weight:800;
  padding:15px 10px 15px 21px;border-radius:13px;background:var(--surface);
  border:1.5px solid var(--line);color:var(--text);text-transform:uppercase;outline:none}
.codein:focus{border-color:var(--red)}
.codein::placeholder{letter-spacing:9px;color:#4a525c;font-weight:600}
.btn{display:block;width:100%;padding:15px;border-radius:13px;background:var(--red);
  color:#fff;font-weight:750;font-size:16px;margin-top:11px;letter-spacing:.3px}
.btn:active{background:#b02525}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--line);
  box-shadow:var(--shadow)}
.btn.ghost:active{background:var(--surface2)}
.hint{font-size:12px;color:var(--dim);margin-top:15px;line-height:1.55}
.err{color:var(--red);font-size:13px;margin-top:11px;font-weight:600;min-height:18px}

/* ---------- scoreboard ---------- */
.board{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.board-top{display:flex;align-items:flex-end;gap:8px}
.bteam{flex:1;text-align:center}
.bteam .nm{font-size:11px;font-weight:800;letter-spacing:2px;margin-bottom:3px}
.bteam.s .nm{color:var(--snots)} .bteam.d .nm{color:var(--ducks)}
.bteam .pts{font-size:42px;font-weight:850;line-height:.95;letter-spacing:-1.5px}
.bmid{flex:none;text-align:center;padding-bottom:11px}
.bmid .dash{font-size:15px;color:var(--dim);font-weight:800}
.clinch{text-align:center;font-size:11px;color:var(--dim);margin-top:11px;
  padding-top:11px;border-top:1px solid var(--line);letter-spacing:.4px}
.clinch b{color:var(--muted)}
.pbar{display:flex;height:7px;border-radius:5px;overflow:hidden;margin-top:13px;background:var(--surface3)}
.pbar .s{background:var(--snots)} .pbar .d{background:var(--ducks)}
.pbar .u{background:var(--surface3)}

/* ---------- cards / lists ---------- */
.sect{font-size:11px;font-weight:750;letter-spacing:2px;color:var(--dim);
  text-transform:uppercase;margin:22px 0 9px}
.sect:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;
  padding:13px 14px;margin-bottom:9px;display:block;width:100%;text-align:left;
  box-shadow:var(--shadow)}
.card:active{background:var(--surface2)}
.card.flat{background:var(--surface2);box-shadow:none}
.rowline{display:flex;align-items:center;gap:11px}
.rnum{width:33px;height:33px;border-radius:9px;background:var(--surface2);flex:none;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:var(--muted)}
.rnum.done{background:var(--red-dim);border-color:#f2ccd3;color:var(--red)}
.rmeta{flex:1;min-width:0}
.rmeta .t1{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta .t2{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.rright{flex:none;text-align:right}
.rright .big{font-weight:800;font-size:15px}
.rright .small{font-size:11px;color:var(--dim);margin-top:2px}
.chev{color:var(--dim);font-size:19px;flex:none;margin-left:2px}

.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-size:10px;
  font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.badge.live{background:var(--red);color:#fff}
.badge.fin{background:var(--surface3);color:var(--muted)}
.badge.soon{background:var(--surface2);color:var(--dim);border:1px solid var(--line)}
.badge.s{background:var(--snots-tint);color:var(--snots)}
.badge.d{background:var(--ducks-tint);color:var(--ducks)}
.badge.h{background:var(--surface3);color:var(--muted)}

/* ---------- match / hole entry ---------- */
.holehead{background:var(--surface);border:1px solid var(--line);border-radius:15px;
  padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
.holenav{display:flex;align-items:center;gap:12px}
.navbtn{width:46px;height:46px;border-radius:12px;background:var(--surface2);flex:none;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:700}
.navbtn:active{background:var(--surface3)}
.navbtn:disabled{opacity:.32}
.holeinfo{flex:1;text-align:center}
.holeinfo .hn{font-size:27px;font-weight:850;line-height:1;letter-spacing:-.6px}
.holeinfo .hd{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.strip{display:flex;gap:3px;margin-top:13px}
.strip button{flex:1;height:27px;border-radius:5px;background:var(--surface2);
  border:1px solid var(--line);
  font-size:10px;font-weight:700;color:var(--dim);display:flex;align-items:center;
  justify-content:center;padding:0;min-width:0}
.strip button.cur{outline:2px solid var(--text);outline-offset:-1px;color:var(--text)}
.strip button.w{background:var(--snots);border-color:var(--snots);color:#fff}
.strip button.l{background:var(--ducks);border-color:var(--ducks);color:#fff}
.strip button.h{background:var(--half);border-color:var(--half);color:#fff}

.sidebox{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden;
  background:var(--surface);box-shadow:var(--shadow)}
.sidehdr{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;
  font-size:11px;font-weight:800;letter-spacing:2px;border-bottom:1px solid var(--line)}
.sidebox.s .sidehdr{color:var(--snots);background:var(--snots-tint)}
.sidebox.d .sidehdr{color:var(--ducks);background:var(--ducks-tint)}
.sidehdr .net{letter-spacing:.4px;font-weight:700;font-size:12px;color:var(--muted)}
.prow{display:flex;align-items:center;gap:8px;padding:9px 11px;border-top:1px solid var(--line)}
.prow:first-child{border-top:none}
.pname{flex:1;min-width:0;font-size:13.5px;font-weight:650;line-height:1.3;
  overflow-wrap:anywhere}
.pname .hc{color:var(--dim);font-weight:600;font-size:10.5px;margin-left:4px;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.sbtn{width:36px;height:40px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.sbtn:active{background:var(--surface3)}
.sbtn:disabled{opacity:.3}
.scorecell{position:relative;width:47px;height:42px;border-radius:10px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;
  border:1.5px solid var(--surface3)}
.scorecell.empty{color:var(--dim);font-weight:600;font-size:15px;
  border-color:var(--line);border-style:dashed;background:transparent}
.scorecell.best{border-color:var(--red);background:var(--red-dim)}
.dots{position:absolute;top:3px;right:4px;display:flex;gap:2px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--red)}
.netlbl{flex:none;width:38px;text-align:center;font-size:10px;color:var(--dim);font-weight:700}
.netlbl b{color:var(--text);font-size:15px;display:block;line-height:1.15}

.resbar{border-radius:13px;padding:14px;text-align:center;margin-bottom:11px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.resbar .r1{font-size:12px;color:var(--muted);font-weight:650}
.resbar .r2{font-size:21px;font-weight:850;margin-top:4px;letter-spacing:-.3px}
.resbar.s{background:var(--snots-tint);border-color:#c9dcf1}
.resbar.d{background:var(--ducks-tint);border-color:#ecdcb4}
.resbar.s .r2{color:var(--snots)} .resbar.d .r2{color:var(--ducks)}

.lockbar{background:var(--surface2);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;margin-bottom:11px;font-size:12.5px;color:var(--muted);line-height:1.5}
.lockbar b{color:var(--text)}
.lockbar button{color:var(--red);font-weight:750;text-decoration:underline;padding:0;margin-top:3px}

/* ---------- scorecard grid ---------- */
.gridwrap{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:13px;
  background:var(--surface);box-shadow:var(--shadow)}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.gc{border-collapse:collapse;font-size:12px;width:100%}
table.gc th,table.gc td{padding:0;text-align:center;height:31px;min-width:31px;
  border-left:1px solid var(--line);border-top:1px solid var(--line);position:relative;
  font-variant-numeric:tabular-nums}
table.gc tr:first-child th,table.gc tr:first-child td{border-top:none}
table.gc .lbl{text-align:left;padding:0 8px;min-width:132px;width:132px;position:sticky;left:0;
  background:var(--surface);z-index:2;border-left:none;font-weight:650;font-size:11.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:132px}
table.gc thead .lbl{background:var(--surface2)}
table.gc thead th{background:var(--surface2);font-weight:750;color:var(--muted);font-size:11px}
table.gc .tot{background:var(--surface2);font-weight:800}
table.gc .meta td,table.gc .meta th{color:var(--dim);font-size:11px;font-weight:600}
table.gc .gross{font-weight:750}
table.gc .net{color:var(--muted);font-size:11.5px;background:var(--surface2)}
table.gc .net b{color:var(--text);font-weight:750}
table.gc .lbl.net{background:var(--surface2)}
table.gc .sep td,table.gc .sep th{height:6px;background:var(--surface3);padding:0}
table.gc .sep .lbl{background:var(--surface3)}
table.gc .gdot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:var(--red)}
table.gc .gdot.two{width:9px;background:none}
table.gc .gdot.two::before,table.gc .gdot.two::after{content:"";position:absolute;top:0;
  width:4px;height:4px;border-radius:50%;background:var(--red)}
table.gc .gdot.two::before{right:5px} table.gc .gdot.two::after{right:0}
table.gc td.w{background:var(--snots);color:#fff}
table.gc td.l{background:var(--ducks);color:#fff}
table.gc td.hh{background:var(--surface3);color:var(--muted)}
table.gc .rowres td{font-weight:800;font-size:11px}
.legend{font-size:11px;color:var(--dim);padding:9px 12px;line-height:1.6;
  border-top:1px solid var(--line);background:var(--surface)}
.legend .dot{display:inline-block;vertical-align:middle;margin:0 3px}

/* ---------- misc ---------- */
.syncpill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);
  padding:8px 12px;justify-content:center}
.syncpill .led{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.syncpill.on .led{background:var(--win)} .syncpill.off .led{background:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:10px;background:var(--surface);
  border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
.empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 12px;line-height:1.6}
.sheet{position:fixed;inset:0;background:rgba(14,18,22,.45);z-index:80;display:flex;
  align-items:flex-end;justify-content:center}
.sheet-in{background:var(--surface);width:100%;max-width:560px;border-radius:17px 17px 0 0;
  padding:19px 16px calc(22px + var(--safe-b));border-top:1px solid var(--line);
  max-height:86vh;overflow-y:auto}
.sheet h3{margin:0 0 5px;font-size:17px}
.sheet p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 15px}
.codelist{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px;margin-bottom:15px}
.codelist .cn{padding:6px 0;border-bottom:1px solid var(--line)}
.codelist .cc{padding:6px 0;border-bottom:1px solid var(--line);font-weight:800;
  letter-spacing:1.5px;text-align:right;color:var(--red)}
</style>
</head>

const ALL_MATCHES = {};           // matchId -> {round, match}
ROUNDS.forEach(r => r.matches.forEach(m => ALL_MATCHES[m.id] = {r, m}));
const MATCH_COUNT  = Object.keys(ALL_MATCHES).length;
const TOTAL_POINTS = MATCH_COUNT * PT_WIN;
const CLINCH       = TOTAL_POINTS / 2 + PT_HALVE;

/* ==========================================================================
   3. SCORING ENGINE   (gross in -> everything else derived)
   ========================================================================== */

/** Strokes a given allowance receives on a hole of this stroke index. */
function strokesOn(allowance, strokeIndex){
  if (!allowance || allowance <= 0) return 0;
  let s = 0;
  if (strokeIndex <= allowance) s++;
  if (strokeIndex <= allowance - 18) s++;   // 2nd stroke for 19+ handicaps
  return s;
}

/** Strokes one player gets on hole h, honouring Round 3's par-3 rule. */
function playerStrokes(r, side, pl, h){
  const c = COURSES[r.course];
  let allow = pl[2];
  if (r.par3Low && c.par[h] === 3) allow = Math.min(...side.p.map(x => x[2]));
  return strokesOn(allow, c.hcp[h]);
}

/** Strokes a whole side gets on hole h (team formats only). */
function teamStrokes(r, side, h){ return strokesOn(side.net, COURSES[r.course].hcp[h]); }

/**
 * The number that actually plays for one side on one hole.
 * Returns {net, gross, byId} or null when the hole isn't complete for that side.
 */
function sideHole(r, m, key, h, scores){
  const side = m[key], row = scores[h] || {};
  if (r.mode === "team"){
    const g = row[key];
    if (g == null) return null;
    return {net: g - teamStrokes(r, side, h), gross: g, byId: null};
  }
  let best = null;
  for (const pl of side.p){
    const g = row[pl[0]];
    if (g == null) continue;                       // picked up / not entered
    const net = g - playerStrokes(r, side, pl, h);
    if (!best || net < best.net) best = {net, gross: g, byId: pl[0]};
  }
  return best;
}

/** Full match state, walked hole by hole so close-outs are exact. */
function matchState(r, m, scores){
  let up = 0, sW = 0, dW = 0, halved = 0;
  const holes = new Array(18).fill(null);
  let closedAt = null, closedMargin = 0;

  for (let h = 0; h < 18; h++){
    const s = sideHole(r, m, "s", h, scores);
    const d = sideHole(r, m, "d", h, scores);
    if (!s || !d) continue;
    let w;
    if (s.net < d.net){ w = "s"; up++; sW++; }
    else if (d.net < s.net){ w = "d"; up--; dW++; }
    else { w = "h"; halved++; }
    holes[h] = w;
    if (closedAt === null && Math.abs(up) > 17 - h){
      closedAt = h + 1; closedMargin = Math.abs(up);
    }
  }

  const played = sW + dW + halved;   // "thru" counts completed holes, not position
  const thru = played;
  const done = closedAt !== null || played === 18;
  let text, winner = null;
  if (closedAt !== null){
    winner = up > 0 ? "s" : "d";
    const rem = 18 - closedAt;
    text = rem === 0 ? "1 UP" : `${closedMargin} & ${rem}`;
  } else if (played === 18){
    if (up === 0) text = "HALVED";
    else { winner = up > 0 ? "s" : "d"; text = `${Math.abs(up)} UP`; }
  } else if (played === 0){
    text = "Not started";
  } else {
    text = up === 0 ? "ALL SQUARE" : `${Math.abs(up)} UP`;
    winner = up === 0 ? null : (up > 0 ? "s" : "d");
  }

  return {up, thru, played, holes, done, winner, text, closedAt,
          started: played > 0,
          pts: {s: done ? (up > 0 ? PT_WIN : up < 0 ? 0 : PT_HALVE) : 0,
                d: done ? (up < 0 ? PT_WIN : up > 0 ? 0 : PT_HALVE) : 0}};
}

/** Event-wide totals. Provisional counts in-progress matches for the leader. */
function standings(){
  let s = 0, d = 0, ps = 0, pd = 0, fin = 0, live = 0;
  for (const id in ALL_MATCHES){
    const {r, m} = ALL_MATCHES[id];
    const st = matchState(r, m, Store.scores(id));
    if (st.done){ s += st.pts.s; d += st.pts.d; ps += st.pts.s; pd += st.pts.d; fin++; }
    else if (st.started){
      live++;
      if (st.up > 0) ps += PT_WIN; else if (st.up < 0) pd += PT_WIN;
      else { ps += PT_HALVE; pd += PT_HALVE; }
    }
  }
  return {s, d, projS: ps, projD: pd, fin, live};
}

const grossTotal = (r, m, key, scores, from, to) => {
  let t = 0, any = false;
  for (let h = from; h <= to; h++){
    const v = sideHole(r, m, key, h, scores);
    if (v){ t += v.gross; any = true; }
  }
  return any ? t : null;
};
const playerTotal = (id, scores, from, to) => {
  let t = 0, any = false;
  for (let h = from; h <= to; h++){
    const v = (scores[h] || {})[id];
    if (v != null){ t += v; any = true; }
  }
  return any ? t : null;
};

/* ==========================================================================
   4. STORE  — localStorage is durable truth, Firebase is shared truth.
   Every cell carries a timestamp, so a merge is just "newest wins".
   That makes offline-then-reconnect safe without any special casing.
   ========================================================================== */
const Store = (() => {
  const LS = `${EVENT_KEY}_data`;
  let data = {};          // matchId -> {scores:{h:{entrant:{v,t,by}}}, scorer:{id,t}}
  let db = null, connected = false, listeners = [];

  try { data = JSON.parse(localStorage.getItem(LS) || "{}"); } catch(e){ data = {}; }

  const flush = () => { try { localStorage.setItem(LS, JSON.stringify(data)); } catch(e){} };
  const bucket = id => (data[id] = data[id] || {scores:{}, scorer:null});

  /** newest-wins merge of one remote match blob into local */
  function mergeRemote(id, remote){
    if (!remote) return false;
    const b = bucket(id); let changed = false;
    if (remote.scores){
      for (const h in remote.scores){
        for (const e in remote.scores[h]){
          const rc = remote.scores[h][e], lc = (b.scores[h] || {})[e];
          if (!rc || typeof rc.t !== "number") continue;
          if (!lc || rc.t > lc.t){
            b.scores[h] = b.scores[h] || {};
            b.scores[h][e] = rc; changed = true;
          }
        }
      }
    }
    if (remote.scorer && (!b.scorer || remote.scorer.t > b.scorer.t)){
      b.scorer = remote.scorer; changed = true;
    }
    return changed;
  }

  return {
    get online(){ return connected; },
    onChange(fn){ listeners.push(fn); },
    _emit(){ listeners.forEach(f => f()); },

    /** flat {holeIdx: {entrantId: grossNumber}} for the engine */
    scores(id){
      const b = data[id]; if (!b) return {};
      const out = {};
      for (const h in b.scores){
        for (const e in b.scores[h]){
          const c = b.scores[h][e];
          if (c && c.v != null){ out[h] = out[h] || {}; out[h][e] = c.v; }
        }
      }
      return out;
    },

    setScore(id, h, entrant, val, by){
      const b = bucket(id), t = Date.now();
      b.scores[h] = b.scores[h] || {};
      b.scores[h][entrant] = {v: val, t, by};      // val null == tombstone (picked up)
      flush(); this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scores/${h}/${entrant}`),
                     {v: val === null ? null : val, t, by}).catch(()=>{});
    },

    scorer(id){ return (data[id] || {}).scorer || null; },
    setScorer(id, pid){
      const b = bucket(id), t = Date.now();
      b.scorer = {id: pid, t}; flush(); this._emit();
      if (db) update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: pid, t}).catch(()=>{});
    },

    /** Wipe a match back to blank. Tombstones (not deletes) so the reset
        itself replicates to phones that were offline when it happened. */
    resetMatch(id){
      const b = bucket(id), t = Date.now(), payload = {};
      for (const h in b.scores) for (const e in b.scores[h]){
        b.scores[h][e] = {v: null, t, by: "reset"};
        payload[`${h}/${e}`] = {v: null, t, by: "reset"};
      }
      b.scorer = {id: null, t};
      flush(); this._emit();
      if (db){
        update(ref(db, `${EVENT_KEY}/matches/${id}/scores`), payload).catch(()=>{});
        update(ref(db, `${EVENT_KEY}/matches/${id}/scorer`), {id: null, t}).catch(()=>{});
      }
    },

    connect(){
      try {
        const app = initializeApp(FIREBASE_CONFIG);
        db = getDatabase(app);
        onValue(ref(db, ".info/connected"), s => { connected = !!s.val(); this._emit(); });
        onValue(ref(db, `${EVENT_KEY}/matches`), snap => {
          const all = snap.val() || {}; let changed = false;
          for (const id in all) if (mergeRemote(id, all[id])) changed = true;
          if (changed){ flush(); this._emit(); }
        }, () => {});
      } catch(e){ console.warn("sync unavailable", e); }
    }
  };
})();

/* ==========================================================================
   5. SESSION
   ========================================================================== */
const Session = {
  get id(){ return localStorage.getItem(`${EVENT_KEY}_me`); },
  set id(v){ v ? localStorage.setItem(`${EVENT_KEY}_me`, v)
                : localStorage.removeItem(`${EVENT_KEY}_me`); },
  get me(){ return PLAYERS[this.id] || null; },
  get admin(){ return !!(this.me && this.me.admin); },
  find(code){
    const c = (code || "").trim().toUpperCase();
    return Object.keys(PLAYERS).find(id => PLAYERS[id].code === c) || null;
  }
};
const inMatch = (m, pid) => [...m.s.p, ...m.d.p].some(x => x[0] === pid);
function canScore(m){
  const me = Session.id; if (!me) return false;
  if (Session.admin) return true;
  const sc = Store.scorer(m.id);
  if (!sc || !sc.id) return inMatch(m, me);
  return sc.id === me;
}

      <div class="board">
        <div class="board-top">
          <div class="bteam s"><div class="nm">SNOTS</div><div class="pts mono">${fmtPt(st.s)}</div></div>
          <div class="bmid"><div class="dash">&ndash;</div></div>
          <div class="bteam d"><div class="nm">DUCKS</div><div class="pts mono">${fmtPt(st.d)}</div></div>
        </div>
        <div class="pbar">
          <span class="s" style="width:${(st.projS/total*100).toFixed(1)}%"></span>
          <span class="d" style="width:${(st.projD/total*100).toFixed(1)}%"></span>
        </div>
        <div class="clinch">${st.live
          ? `Projected <b>${fmtPt(st.projS)} &ndash; ${fmtPt(st.projD)}</b> with ${st.live} match${st.live>1?"es":""} live`
          : `${st.fin} of ${MATCH_COUNT} matches complete`}
          &middot; <b>${fmtPt(CLINCH)}</b> to clinch</div>
      </div>
      ${nextUp ? `<div class="sect">Your match</div>${matchCard(nextUp.r, nextUp.m, nextUp.st, true)}` : ""}
      <div class="sect">Rounds</div>${rounds}
      <div class="syncpill ${Store.online ? "on" : "off"}"><span class="led"></span>
        ${Store.online ? "Live &middot; synced to every phone" : "Offline &middot; saved here, will sync"}</div>
    </div>`;
}
const fmtPt = n => Number.isInteger(n) ? String(n) : n.toFixed(1).replace(/\.0$/, "");

/* ---------- round ---------- */
function viewRound(){
  const r = ROUNDS[V.round], c = COURSES[r.course];
  let list = "";
  r.matches.forEach(m => list += matchCard(r, m, matchState(r, m, Store.scores(m.id))));
  return `<div class="topbar">
      <button class="iconbtn" data-nav="home">&lsaquo;</button>
      <h1>Round ${r.n} &middot; ${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(r.tee)} tees</div></h1>
    </div><div class="wrap">
      <div class="card flat" style="border-style:dashed">
        <div style="font-size:12px;color:var(--muted);line-height:1.6">
          <b style="color:var(--text)">Strokes:</b> ${esc(r.rule)}<br>
          <b style="color:var(--text)">Format:</b> ${fmtBlurb(r)}
          ${c.note ? `<br><b style="color:var(--text)">Note:</b> ${esc(c.note)}` : ""}
        </div></div>
      <div class="sect">Matches</div>${list}</div>`;
}
const fmtBlurb = r => ({
  "Scramble":"Both partners tee off, play the best ball, repeat. One score per team.",
  "Best Ball":"Everyone plays their own ball. The pair's better net score counts.",
  "Shamble":"Play the best drive, then everyone plays their own ball in. Better net counts.",
  "Alternate Shot":"Partners alternate shots on one ball. One score per team.",
  "Singles":"One on one, own ball, net match play."
})[r.fmt] || "";

function matchCard(r, m, st, showRound){
  const nm = k => m[k].p.map(p => last(p[0])).join(" / ");
  const cls = st.winner ? teamCls(st.winner) : "h";
  const right = st.started
    ? `<span class="badge ${cls}">${esc(st.text)}</span>`
    : `<span class="badge soon">${esc(m.t)}</span>`;
  const sub = st.done ? "Final" : st.started ? `thru ${st.thru}` : (showRound ? `Round ${r.n} &middot; ${esc(COURSES[r.course].n)}` : esc(r.fmt));
  return `<button class="card" data-nav="match" data-id="${m.id}"><div class="rowline">
    <div class="rmeta">
      <div class="t1" style="color:var(--snots)">${esc(nm("s"))}</div>
      <div class="t1" style="color:var(--ducks)">${esc(nm("d"))}</div>
      <div class="t2" style="margin-top:4px">${sub}</div>
    </div>
    <div class="rright"><div class="small" style="margin:0 0 5px">${right}</div></div>
    <div class="chev">&rsaquo;</div></div></button>`;
}

/* ---------- match: hole entry ---------- */
function viewMatch(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);
  const h = V.hole, editable = canScore(m), sc = Store.scorer(m.id);

  let strip = "";
  for (let i = 0; i < 18; i++){
    const w = st.holes[i];
    strip += `<button data-hole="${i}" class="${i === h ? "cur " : ""}${
      w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "h" : ""}">${i + 1}</button>`;
  }

  const yd = yards(r, m, h);
  const sideBox = key => {
    const side = m[key], rows = [];
    const bh = sideHole(r, m, key, h, scores);
    if (r.mode === "team"){
      const n = teamStrokes(r, side, h), g = (scores[h] || {})[key];
      rows.push(entryRow(side.p.map(p => last(p[0])).join(" / "),
        shotLbl(side.net), key, g, n, r, h, editable, false));
    } else {
      side.p.forEach(pl => {
        const n = playerStrokes(r, side, pl, h), g = (scores[h] || {})[pl[0]];
        const isBest = bh && bh.byId === pl[0] && side.p.length > 1;
        rows.push(entryRow(PLAYERS[pl[0]].n, shotLbl(pl[2]), pl[0], g, n, r, h, editable, isBest));
      });
    }
    return `<div class="sidebox ${key}"><div class="sidehdr">
        <span>${key === "s" ? "SNOTS" : "DUCKS"}</span>
        <span class="net">${bh ? `hole net <b style="color:var(--text)">${bh.net}</b>` : "&mdash;"}</span>
      </div>${rows.join("")}</div>`;
  };

  const hs = sideHole(r, m, "s", h, scores), hd = sideHole(r, m, "d", h, scores);
  let holeLine = "Enter both sides to score the hole";
  if (hs && hd) holeLine = hs.net < hd.net ? "Snots win the hole"
    : hd.net < hs.net ? "Ducks win the hole" : "Hole halved";

  return `<div class="topbar">
      <button class="iconbtn" data-nav="round" data-i="${ROUNDS.indexOf(r)}">&lsaquo;</button>
      <h1>${esc(r.fmt)}<div class="sub">${esc(c.n)} &middot; ${esc(m.tee || r.tee)} &middot; ${esc(m.t)}</div></h1>
      <button class="iconbtn" data-nav="card" data-id="${m.id}">&#9638;</button>
    </div><div class="wrap">
      <div class="resbar ${st.winner ? teamCls(st.winner) : ""}">
        <div class="r1">${holeLine}</div>
        <div class="r2">${st.started ? matchLine(st) : "Match not started"}</div>
      </div>
      ${scorerBar(m, sc, editable)}
      <div class="holehead">
        <div class="holenav">
          <button class="navbtn" data-step="-1" ${h === 0 ? "disabled" : ""}>&lsaquo;</button>
          <div class="holeinfo"><div class="hn">Hole ${h + 1}</div>
            <div class="hd">Par ${c.par[h]}${yd ? " &middot; " + yd : ""} &middot; S.I. ${c.hcp[h]}</div></div>
          <button class="navbtn" data-step="1" ${h === 17 ? "disabled" : ""}>&rsaquo;</button>
        </div>
        <div class="strip">${strip}</div>
      </div>
      ${sideBox("s")}${sideBox("d")}
      <button class="btn ghost" data-nav="card" data-id="${m.id}">View full scorecard</button>
      ${Session.admin ? `<button class="btn ghost" data-reset="${m.id}"
        style="color:var(--red);margin-top:8px">Reset this match</button>` : ""}
    </div>`;
}
/* Always rendered, always the same height. If this bar appears or disappears
   as scores go in, every button below it jumps under the scorer's thumb. */
function scorerBar(m, sc, editable){
  let body;
  if (sc && sc.id === Session.id) body = `<b>You're keeping score.</b> Everyone else sees this live.`;
  else if (sc && sc.id) body = `<b>${esc(PLAYERS[sc.id].n)}</b> is keeping score.` +
    (Session.admin ? ` <button data-claim="${m.id}">Take over &rsaquo;</button>` : ` View only.`);
  else if (editable) body = `Nobody is keeping score yet. <button data-claim="${m.id}">I'll keep score &rsaquo;</button>`;
  else body = `<b>View only.</b> You're not in this match.`;
  return `<div class="lockbar">${body}</div>`;
}
function matchLine(st){
  if (st.done) return st.winner
    ? `${st.winner === "s" ? "SNOTS" : "DUCKS"} win ${esc(st.text)}`
    : "Match halved";
  if (st.up === 0) return `All square thru ${st.thru}`;
  return `${st.up > 0 ? "SNOTS" : "DUCKS"} ${Math.abs(st.up)} UP thru ${st.thru}`;
}
/* The number beside a name is shots RECEIVED in this match, not the course
   handicap — that's what the dots are drawn from, so they must agree.
   Never prefix with "+": in golf a plus handicap means BETTER than scratch,
   so "+13" would read as the opposite of thirteen shots. */
const shotLbl = n => `${n <= 0 ? 0 : n} shot${n === 1 ? "" : "s"}`;

/* Handicap index in proper golf notation: -0.6 is a plus handicap, "+0.6". */
const fmtIdx = i => i < 0 ? `+${Math.abs(i).toFixed(1)}` : i.toFixed(1);
function entryRow(name, hcLbl, entrant, gross, strokes, r, h, editable, highlight){
  const par = COURSES[r.course].par[h];
  const cell = gross == null
    ? `<div class="scorecell empty">${dotsHTML(strokes)}&mdash;</div>`
    : `<div class="scorecell ${highlight ? "best" : ""}">${dotsHTML(strokes)}${gross}</div>`;
  const net = gross == null ? "" : `<div class="netlbl">net<b>${gross - strokes}</b></div>`;
  return `<div class="prow">
    <div class="pname">${esc(name)}<span class="hc">${esc(hcLbl)}</span></div>
    ${editable ? `<div class="stepper">
      <button class="sbtn" data-adj="${entrant}" data-d="-1" ${gross == null ? "disabled" : ""}>&minus;</button>
      ${cell}
      <button class="sbtn" data-adj="${entrant}" data-d="1">+</button></div>`
      : `<div class="stepper">${cell}</div>`}
    ${net || `<div class="netlbl"></div>`}</div>`;
}

/* ---------- full scorecard ---------- */
function viewCard(){
  const {r, m} = ALL_MATCHES[V.matchId], c = COURSES[r.course];
  const scores = Store.scores(m.id), st = matchState(r, m, scores);

  const nine = (from, to, label) => {
    let head = `<tr><th class="lbl">${label}</th>`;
    for (let h = from; h <= to; h++) head += `<th>${h + 1}</th>`;
    head += `<th class="tot">${label === "OUT" ? "OUT" : "IN"}</th></tr>`;

    let par = `<tr class="meta"><td class="lbl">Par</td>`, si = `<tr class="meta"><td class="lbl">Stroke index</td>`;
    let pT = 0;
    for (let h = from; h <= to; h++){ par += `<td>${c.par[h]}</td>`; si += `<td>${c.hcp[h]}</td>`; pT += c.par[h]; }
    par += `<td class="tot">${pT}</td>`; si += `<td class="tot"></td>`;
    par += `</tr>`; si += `</tr>`;

    let body = "";
    ["s","d"].forEach(key => {
      const side = m[key], colour = key === "s" ? "var(--snots)" : "var(--ducks)";
      if (r.mode === "team"){
        body += rowPair(side.p.map(p => last(p[0])).join(" / "), colour, key,
          h => teamStrokes(r, side, h), h => (scores[h] || {})[key], from, to);
      } else {
        side.p.forEach(pl => {
          body += rowPair(PLAYERS[pl[0]].n, colour, pl[0],
            h => playerStrokes(r, side, pl, h), h => (scores[h] || {})[pl[0]], from, to);
        });
        if (side.p.length > 1){
          let g = `<tr><td class="lbl" style="color:${colour};font-weight:800">
            ${key === "s" ? "SNOTS" : "DUCKS"} net</td>`;
          let t = 0, any = false;
          for (let h = from; h <= to; h++){
            const v = sideHole(r, m, key, h, scores);
            g += `<td class="gross">${v ? v.net : ""}</td>`;
            if (v){ t += v.net; any = true; }
          }
          g += `<td class="tot">${any ? t : ""}</td></tr>`;
          body += g;
        }
      }
      body += `<tr class="sep"><td class="lbl"></td>${"<td></td>".repeat(to - from + 2)}</tr>`;
    });

    let res = `<tr class="rowres"><td class="lbl">Result</td>`;
    let sw = 0, dw = 0;
    for (let h = from; h <= to; h++){
      const w = st.holes[h];
      if (w === "s") sw++; if (w === "d") dw++;
      res += `<td class="${w === "s" ? "w" : w === "d" ? "l" : w === "h" ? "hh" : ""}">${
        w === "s" ? "S" : w === "d" ? "D" : w === "h" ? "&frac12;" : ""}</td>`;
    }
    res += `<td class="tot">${sw || dw ? `${sw}&ndash;${dw}` : ""}</td></tr>`;

    return `<div class="gridwrap"><div class="gscroll"><table class="gc">
      <thead>${head}</thead><tbody>${par}${si}${body}${res}</tbody></table></div></div>`;
  };

  const rowPair = (name, colour, entrant, strokeFn, grossFn, from, to) => {
    let g = `<tr><td class="lbl" style="color:${colour}">${esc(name)}</td>`;
    let n = `<tr><td class="lbl net" style="padding-left:16px">net</td>`;
    let gt = 0, nt = 0, any = false;
    for (let h = from; h <= to; h++){
      const s = strokeFn(h), v = grossFn(h);
      g += `<td class="gross">${s > 0 ? `<span class="gdot${s > 1 ? " two" : ""}"></span>` : ""}${v ?? ""}</td>`;
      n += `<td class="net">${v != null ? `<b>${v - s}</b>` : ""}</td>`;
      if (v != null){ gt += v; nt += v - s; any = true; }
    }
    g += `<td class="tot">${any ? gt : ""}</td></tr>`;
    n += `<td class="tot net">${any ? `<b>${nt}</b>` : ""}</td></tr>`;
    return g + n;
  };

  const gs = grossTotal(r, m, "s", scores, 0, 17), gd = grossTotal(r, m, "d", scores, 0, 17);
  return `<div class="topbar">
      <button class="iconbtn" data-nav="match" data-id="${m.id}">&lsaquo;</button>
      <h1>Scorecard<div class="sub">${esc(c.n)} &middot; ${esc(r.fmt)} &middot; ${esc(m.tee || r.tee)}</div></h1>
    </div><div class="wrap">
      <div class="resbar ${st.winner ? teamCls(st.winner) : ""}">
        <div class="r1">Match result</div>
        <div class="r2">${st.started ? matchLine(st) : "Not started"}</div>
      </div>
      ${nine(0, 8, "OUT")}${nine(9, 17, "IN")}
      <div class="gridwrap"><div class="legend">
        <span class="dot"></span> = a stroke is given on that hole
        ${r.par3Low ? "<br>Par 3s: the pair plays off the lower partner's strokes." : ""}
        ${gs != null || gd != null ? `<br>Gross totals &mdash; Snots <b style="color:var(--text)">${gs ?? "&mdash;"}</b>,
          Ducks <b style="color:var(--text)">${gd ?? "&mdash;"}</b>` : ""}
      </div></div>
      <button class="btn ghost" data-nav="match" data-id="${m.id}">Back to scoring</button>
    </div>`;
}

/* ---------- menu sheet ---------- */
function viewSheet(){
  if (V.sheet === "menu"){
    const admin = Session.admin;
    let codes = "";
    if (admin){
      codes = `<div class="sect" style="margin-top:6px">Player codes</div><div class="codelist">` +
        Object.keys(PLAYERS).map(id =>
          `<div class="cn">${esc(PLAYERS[id].n)}<span style="color:var(--dim)"> &middot; ${
            PLAYERS[id].t === "s" ? "Snots" : "Ducks"}</span></div>
           <div class="cc mono">${PLAYERS[id].code}</div>`).join("") + `</div>`;
    }
    return `<div class="sheet" data-close="1"><div class="sheet-in">
      <h3>${esc(Session.me.n)}</h3>
      <p>${Session.me.t === "s" ? "Snots" : "Ducks"} &middot; Index ${fmtIdx(Session.me.idx)}
         ${admin ? " &middot; Commissioner" : ""}<br>
         ${Store.online ? "Live sync is on." : "Offline &mdash; scores save here and sync when you get service."}</p>
      ${codes}
      <button class="btn ghost" data-signout="1">Sign out</button>
    </div></div>`;
  }
  return "";
}

/* ==========================================================================
   8. EVENTS
   ========================================================================== */
function wire(){
  document.querySelectorAll("[data-nav]").forEach(el => el.onclick = () => {
    const n = el.dataset.nav;
    if (n === "home"){ V.view = "home"; }
    if (n === "round"){ V.view = "round"; V.round = +el.dataset.i; }
    if (n === "match"){
      V.view = "match"; V.matchId = el.dataset.id;
      const {r, m} = ALL_MATCHES[V.matchId];
      V.round = ROUNDS.indexOf(r);
      const st = matchState(r, m, Store.scores(m.id));
      V.hole = st.done ? Math.max(0, (st.closedAt || 18) - 1) : Math.min(17, st.thru);
    }
    if (n === "card"){ V.view = "card"; V.matchId = el.dataset.id; }
    V.sheet = null; render(); window.scrollTo(0, 0);
  });

  document.querySelectorAll("[data-sheet]").forEach(el =>
    el.onclick = () => { V.sheet = el.dataset.sheet; render(); });
  document.querySelectorAll("[data-close]").forEach(el =>
    el.onclick = e => { if (e.target === el){ V.sheet = null; render(); } });
  const so = document.querySelector("[data-signout]");
  if (so) so.onclick = () => { Session.id = null; V.sheet = null; render(); };

  document.querySelectorAll("[data-step]").forEach(el => el.onclick = () => {
    V.hole = Math.max(0, Math.min(17, V.hole + (+el.dataset.step))); render();
  });
  document.querySelectorAll("[data-hole]").forEach(el => el.onclick = () => {
    V.hole = +el.dataset.hole; render();
  });
  const claim = document.querySelector("[data-claim]");
  if (claim) claim.onclick = () => { Store.setScorer(claim.dataset.claim, Session.id); render(); };
  const rst = document.querySelector("[data-reset]");
  if (rst) rst.onclick = () => {
    if (confirm("Wipe every score in this match and start it over?\n\nThis clears it on everyone's phone."))
      { Store.resetMatch(rst.dataset.reset); V.hole = 0; render(); }
  };

  document.querySelectorAll("[data-adj]").forEach(el => el.onclick = () => {
    const {r, m} = ALL_MATCHES[V.matchId];
    const entrant = el.dataset.adj, d = +el.dataset.d;
    const cur = (Store.scores(m.id)[V.hole] || {})[entrant];
    const par = COURSES[r.course].par[V.hole];
    let next;
    if (cur == null) next = d > 0 ? par : null;          // first tap starts at par
    else next = cur + d;
    if (next != null && next < 1) next = null;            // stepping below 1 clears
    if (next != null && next > 15) next = 15;
    // first person to enter a score in an unclaimed match becomes the scorer
    const sc = Store.scorer(m.id);
    if ((!sc || !sc.id) && inMatch(m, Session.id)) Store.setScorer(m.id, Session.id);
    Store.setScore(m.id, V.hole, entrant, next, Session.id);
  });

  // swipe between holes
  if (V.view === "match"){
    let x0 = null, y0 = null;
    const w = document.querySelector(".wrap");
    w.ontouchstart = e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; };
    w.ontouchend = e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.8){
        V.hole = Math.max(0, Math.min(17, V.hole + (dx < 0 ? 1 : -1))); render();
      }
      x0 = null;
    };
  }
}

/* ==========================================================================
   9. BOOT
   ========================================================================== */
Store.onChange(() => { if (Session.id) render(); });
Store.connect();
render();

// Exposed so the scoring engine can be exercised directly (tests, debugging).
window.MI26 = {PLAYERS, COURSES, ROUNDS, ALL_MATCHES, Store, Session,
  strokesOn, playerStrokes, teamStrokes, sideHole, matchState, standings,
  render, V, MATCH_COUNT,
  resetAll(){ Object.keys(ALL_MATCHES).forEach(id => Store.resetMatch(id)); render(); }};
</script>
</body>
</html>
